/* ================= tokens ================= */
:root{
  --bg:#F7F1E6; --paper:#FFFCF6; --ink:#262140; --ink-soft:#5E5878; --line:#E4D8C6; --grid:#EADFCC;
  --accent:#E8553F;          /* main buttons, focus */
  --accent-ink:#FFFFFF;
  --pin:#E8553F;
  /* theme colours for the five question cards (each also has a symbol) */
  --t-habits:#FFC94D; --t-people:#8FD3B8; --t-senses:#9CC9F0; --t-feelings:#F6A7B8; --t-now:#C7B5FF; --t-words:#FFB98A;
  --display:'Bricolage Grotesque','Trebuchet MS',sans-serif;
  --body:'Atkinson Hyperlegible',Verdana,sans-serif;
  --mono:'Space Mono',ui-monospace,Menlo,monospace;
  --r-s:10px; --r-m:16px; --r-l:26px;
  --shadow:0 2px 0 rgba(38,33,64,.08), 0 10px 26px -14px rgba(38,33,64,.35);
  --spring:cubic-bezier(.34,1.56,.64,1); --ease:cubic-bezier(.25,.46,.45,.94);
  --barH:72px;
}
/* ================= base ================= */
*{box-sizing:border-box}
html{touch-action:manipulation;font-size:clamp(16px, .9rem + .35vw, 21px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.5 var(--body);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button{font:inherit;color:inherit;min-height:44px;cursor:pointer;border:0;background:none}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--display);font-weight:800;line-height:1.1;margin:0}
b,strong{font-weight:700}
.screen{display:none}.screen.active{display:block}
.wrap{max-width:1240px;margin:0 auto;padding:16px}
.card{background:var(--paper);border:2px solid var(--ink);border-radius:var(--r-l);box-shadow:var(--shadow)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4em;padding:.55em 1.1em;border-radius:999px;
  font-family:var(--display);font-weight:800;border:2px solid var(--ink);background:var(--paper);transition:transform .15s var(--ease)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn[disabled]{opacity:.4;cursor:default}
.small{font-size:.9rem;color:var(--ink-soft)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ================= start screen ================= */
.start{display:grid;gap:20px;padding:22px;margin-top:8px}
.start h1{font-size:clamp(2.2rem,1.4rem + 4vw,4.2rem);letter-spacing:-.02em}
.start .kicker{margin-bottom:8px}
.start .lead{font-size:1.1rem;max-width:44em}
.cando{display:inline-block;background:var(--t-habits);border:2px solid var(--ink);border-radius:var(--r-s);padding:.35em .8em;font-weight:700}
.howto{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:0;padding:0;list-style:none}
.howto li{background:var(--bg);border:2px dashed var(--line);border-radius:var(--r-m);padding:12px 14px}
.howto .n{font-family:var(--mono);font-weight:700;color:var(--accent)}
.sizes{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.sizes .btn[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.resume{background:var(--t-now);border:2px solid var(--ink);border-radius:var(--r-m);padding:12px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* ================= activity layout ================= */
.top{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;margin-bottom:12px}
.brand{font-family:var(--display);font-weight:800;font-size:1.2rem;display:flex;gap:.4em;align-items:center}
.tools{display:flex;flex-wrap:wrap;gap:6px}
.tools .btn{padding:.35em .8em;font-size:.9rem;min-height:40px}
.route{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px;padding:0;list-style:none}
.route button{border:2px solid var(--ink);border-radius:999px;padding:.3em .9em;background:var(--paper);font-weight:700;min-height:40px}
.route button[aria-current="step"]{background:var(--ink);color:var(--paper)}
.route button[aria-current="step"]::before{content:"● "}
.route button.done::after{content:" ✓"}
.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,360px);gap:16px;align-items:start}
.main{padding:20px 22px 24px}
.aside{padding:16px 18px;position:sticky;top:12px;max-height:calc(100dvh - 128px - var(--barH) - 24px);overflow:auto}
@media (max-width:1000px){
  .layout{grid-template-columns:1fr}
  .aside{position:static;max-height:none}
}
.stephead{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;justify-content:space-between;margin-bottom:10px}
.stephead h2{font-size:clamp(1.6rem,1.1rem + 2vw,2.5rem)}
.kicker{font-family:var(--mono);font-weight:700;font-size:.9rem;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em}
.instr{font-size:1.08rem;margin:.2em 0 1em;max-width:42em}
.instr p{margin:.3em 0}
.enter{animation:enter .35s var(--ease)}
@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* turn indicator */
.turn{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 14px}
.who{display:inline-flex;align-items:center;justify-content:center;min-width:44px;height:44px;border-radius:50%;border:2px solid var(--ink);
  font-family:var(--display);font-weight:800;background:var(--paper)}
.who.now{background:var(--accent);color:#fff;transform:scale(1.12)}
.who.now::after{content:"";}
.turn .label{font-weight:700}

/* timer */
.timer{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;background:var(--bg);border:2px solid var(--ink);border-radius:var(--r-m);padding:8px 12px;margin:0 0 16px}
.clock{font-family:var(--mono);font-weight:700;font-size:clamp(1.6rem,1.2rem + 1.6vw,2.4rem);line-height:1;min-width:4.2ch}
.clock.hurry{color:var(--accent)}
.tmeta{display:flex;flex-direction:column;line-height:1.25;margin-right:auto}
.tmeta .state{font-weight:700}
.tbtns{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tbtns .btn{padding:.3em .8em;min-height:40px;font-size:.9rem}
.secs{display:inline-flex;gap:2px;border:2px solid var(--ink);border-radius:999px;padding:2px}
.secs button{min-height:40px;min-width:42px;border-radius:999px;font-family:var(--mono);font-weight:700;font-size:.88rem}
.secs button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

/* places (step 1) */
.places{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin:0;padding:0;list-style:none}
.places li{background:var(--bg);border:2px solid var(--line);border-radius:var(--r-m);padding:12px 14px;display:flex;gap:10px;align-items:center;font-weight:700}
.places .ico{font-size:1.5rem}
.note{border-left:5px solid var(--t-habits);background:var(--bg);padding:10px 14px;border-radius:0 var(--r-s) var(--r-s) 0;margin:14px 0 0}

/* example map */
.example{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;align-items:start;margin-top:8px}
@media (max-width:1180px){.example{grid-template-columns:1fr}.example svg{max-width:520px}}
.example svg{width:100%;height:auto;display:block;background:var(--paper);border:2px solid var(--ink);border-radius:var(--r-m)}
.quote{background:var(--bg);border-radius:var(--r-m);padding:14px 16px;font-size:1.02rem}
.quote p{margin:.4em 0}
.quote .pin{display:inline-flex;align-items:center;justify-content:center;width:1.6em;height:1.6em;border-radius:50%;background:var(--pin);color:#fff;font-family:var(--mono);font-weight:700;font-size:.8em;margin-right:.3em;vertical-align:.1em}
details.ex{margin:0 0 16px;border:2px dashed var(--line);border-radius:var(--r-m);padding:6px 14px}
details.ex summary{cursor:pointer;font-weight:700;min-height:40px;display:flex;align-items:center}
.tips{margin:.4em 0 0;padding-left:1.2em}
.tips li{margin:.2em 0}

/* roles */
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-bottom:16px}
.role{border:2px solid var(--ink);border-radius:var(--r-m);padding:12px 14px;background:var(--paper)}
.role h3{font-size:1.1rem;margin-bottom:.3em}
.role p{margin:.25em 0}
.role.speak{background:#FFF3D6}


/* phrase strip, compact roles */
.strip{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin:0 0 16px;padding:10px 12px;border:2px dashed var(--line);border-radius:var(--r-m);background:var(--paper)}
.strip-t{font-family:var(--display);font-weight:800;margin-right:4px}
.chip{background:var(--bg);border:1.5px solid var(--line);border-radius:999px;padding:.2em .75em}
.roles.compact{display:block;border:2px solid var(--ink);border-radius:var(--r-m);padding:8px 14px;background:#FFF9EC}
.roles.compact p{margin:.25em 0}
.tag{display:inline-block;background:var(--bg);border-radius:8px;padding:0 .5em;margin:2px 2px 0 0}
details.ex > p{margin:.4em 0}
/* question cards */
.themes{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin:0 0 12px}
@media (max-width:1180px){.themes{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:420px){.themes{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:600px){#fullBtn{display:none}}
.theme{border:2px solid var(--ink);border-radius:var(--r-m);padding:10px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;
  font-family:var(--display);font-weight:800;line-height:1.15;text-align:center;min-height:76px;transition:transform .15s var(--spring)}
.theme .sym{font-size:1.5rem}
.theme[aria-expanded="true"]{transform:translateY(-3px);box-shadow:0 6px 0 var(--ink)}
.theme[aria-expanded="true"] .nm::after{content:" ▾"}
.qcard{border:2px solid var(--ink);border-radius:var(--r-l);padding:14px 18px 16px;margin-bottom:4px}
.qcard h3{font-size:1.15rem;margin-bottom:.4em;display:flex;gap:.4em;align-items:center}
.qcard ul{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.qcard li{background:rgba(255,255,255,.72);border-radius:var(--r-s);padding:8px 12px;font-size:1.06rem}
.qhint{color:var(--ink-soft);font-style:italic}

/* end */
.endbox{text-align:center;padding:28px 20px}
.endbox h2{font-size:clamp(2rem,1.4rem + 3vw,3.4rem);margin-bottom:.3em}
.endbox .instr{margin:0 auto 1em}
.endbtns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:16px}

/* aside: phrase bank */
.aside h2{font-size:1.35rem;margin-bottom:8px}
.aside details{border-top:2px dashed var(--line);padding:4px 0}
.aside details:first-of-type{border-top:0}
.aside summary{cursor:pointer;font-weight:700;font-family:var(--display);font-size:1.02rem;min-height:40px;display:flex;align-items:center;gap:.4em}
.aside ul{margin:.2em 0 .6em;padding-left:1.1em}
.aside li{margin:.25em 0}
.mist{list-style:none;padding:0!important}
.mist li{background:var(--bg);border-radius:var(--r-s);padding:8px 10px;margin:.45em 0!important}
.wrong{text-decoration:line-through;text-decoration-thickness:2px;color:#8A3B2E}
.wrong::before{content:"✗ ";text-decoration:none;display:inline-block}
.right{font-weight:700;color:#1D6B4F}
.right::before{content:"✓ "}
.uk{width:100%;border-collapse:collapse;font-size:.95rem;margin:.3em 0 .6em}
.uk th,.uk td{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left;vertical-align:top}
.uk th{font-family:var(--mono);font-size:.88rem;text-transform:uppercase}

/* bottom bar: Previous / Next */
.bar{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));display:flex;gap:8px;z-index:5}
.bar .btn{min-height:52px;padding:.5em 1.3em;font-size:1.05rem;box-shadow:var(--shadow)}
.spacer{height:calc(var(--barH) + 24px)}
@media (max-width:1000px){
  .bar{left:0;right:0;bottom:0;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:var(--paper);border-top:2px solid var(--ink)}
  .bar .btn{flex:1;box-shadow:none}
}
@media (max-height:500px) and (orientation:landscape){
  :root{--barH:56px}
  .bar .btn{min-height:44px;padding:.3em 1em}
}

/* footer (Class of Coffee signature footer v1.0, unchanged) */
.coc-footer{
  display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between;
  gap:4px 16px; padding:7px 20px;
  background:var(--coc-tan,#E6C496); color:var(--coc-coffee-dark,#5A2D0C);
  font-family:var(--coc-body,'Nunito','Segoe UI',Verdana,sans-serif); font-size:13px; line-height:1.4;
}
.coc-footer__brand{ display:flex; align-items:center; gap:10px; font-weight:600; }
.coc-footer__mark{ width:30px; height:30px; flex:none; }
.coc-footer a{ color:inherit; text-decoration:underline; text-underline-offset:3px;
  display:inline-flex; align-items:center; min-height:40px; padding:0 4px; }
.coc-footer a:focus-visible{ outline:2px solid var(--coc-coffee-dark,#5A2D0C); outline-offset:3px; border-radius:4px; }
.coc-footer{border-radius:var(--r-m);margin-top:18px}
</style>
</head>
<body>
<main id="app">
  <!-- start screen -->
  <section class="screen active" id="start">
    <div class="wrap">
      <div class="card start" id="startBox"></div>
      <div id="footStart"></div>
    </div>
  </section>

  <!-- activity -->
  <section class="screen" id="play">
    <div class="wrap">
      <div class="top">
        <div class="brand"><span aria-hidden="true">🗺️</span> <span id="brandName"></span></div>
        <div class="tools">
          <button class="btn" data-act="phrases" id="phrasesBtn" type="button"></button>
          <button class="btn" data-act="sound" id="soundBtn" type="button" aria-pressed="true"></button>
          <button class="btn" data-act="full" id="fullBtn" type="button"></button>
          <button class="btn" data-act="home" id="homeBtn" type="button"></button>
        </div>
      </div>
      <ol class="route" id="route" aria-label="Steps"></ol>
      <div class="layout">
        <article class="card main" id="mainBox" aria-live="polite"></article>
        <aside class="card aside" id="aside" tabindex="-1"></aside>
      </div>
      <div id="footPlay"></div>
      <div class="spacer"></div>
    </div>
    <nav class="bar" aria-label="Move between steps">
      <button class="btn" data-act="prev" id="prevBtn" type="button"></button>
      <button class="btn primary" data-act="next" id="nextBtn" type="button"></button>
    </nav>
  </section>
</main>

<template id="footerTpl">
<footer class="coc-footer">
  <span class="coc-footer__brand">
    <svg class="coc-footer__mark" xmlns="http://www.w3.org/2000/svg" viewBox="4 4 48 48" aria-hidden="true" focusable="false"><path d="M42.57 20.25A16.5 16.5 0 1 0 42.57 35.75L38.77 33.73A12.2 12.2 0 1 1 38.77 22.27Z" fill="#EDE3D6"/><path d="M42.57 20.25A16.5 16.5 0 1 0 42.57 35.75L40.89 34.85A14.6 14.6 0 1 1 40.89 21.15Z" fill="#D9C8B2"/><path d="M48.31 17.2A23 23 0 1 0 48.31 38.8A3.25 3.25 0 0 0 42.57 35.75A16.5 16.5 0 1 1 42.57 20.25A3.25 3.25 0 0 0 48.31 17.2Z" fill="#A2521A" stroke="#5A2D0C" stroke-width="1.8" stroke-linejoin="round"/><circle cx="28" cy="28" r="12.2" fill="#744823" stroke="#5A3517" stroke-width="1"/><path d="M32.5 22.64A7.0 7.0 0 1 0 32.5 33.36L32.64 32.21A5.5 5.5 0 1 1 32.64 23.79Z" fill="#F3E2BF" stroke="#F3E2BF" stroke-width="0.7" stroke-linejoin="round"/></svg>
    <span class="coc-footer__text"><a href="https://classofcoffee.com">Class of Coffee – with AI assistance</a><a class="coc-footer__lic" rel="license" href="https://creativecommons.org/licenses/by-nc-sa/4.0/" title="Licence: Creative Commons BY-NC-SA 4.0">CC BY-NC-SA</a></span>
  </span>
</footer>
</template>

<script>
/* ================= CONTENT (edit here) ================= */
// In any string, *word* is shown in bold. Timings are in minutes.
const CONTENT = {
  title: 'Memory Map',

/* ================= state ================= */
// S.pos is an index into the sequence built by seq(); text is always read fresh from CONTENT.
let S = null;
let prefs = { sound:true, hurry:30 };
const HURRY = [30, 20, 10];

/* ================= logic ================= */
function seq(size){
  const out = [{k:'choose'}, {k:'draw'}];
  for (let p = 0; p < size; p++) out.push({k:'tour', p});
  out.push({k:'plan'});
  for (let p = 0; p < size; p++) out.push({k:'story', p});
  for (let p = 0; p < size; p++) out.push({k:'retell', p});
  out.push({k:'end'});
  return out;
}
function startActivity(size){
  S = { v:2, size, pos:0, open:null, visited:[0] };
  timerReset(true); save();
}
function go(pos){
  const L = seq(S.size);
  S.pos = Math.max(0, Math.min(L.length - 1, pos));
  S.open = null;
  if (!S.visited.includes(S.pos)) S.visited.push(S.pos);
  timerReset(true); save();
}
function cur(){ return seq(S.size)[S.pos]; }
function stepKeys(){ return ['choose','draw','tour','story','retell']; }
// The planning minute belongs to the Story step.
const stepOf = x => x.k === 'plan' ? 'story' : x.k;
function firstPosOf(k){ return seq(S.size).findIndex(x => stepOf(x) === k); }
// Total suggested minutes for a group of this size
function totalMinutes(size){ return seq(size).reduce((t,x) => t + (CONTENT.steps[x.k]?.minutes || 0), 0); }

/* ---------- timer: stopwatch per turn + optional hurry-up countdown ---------- */
const T = { start:0, acc:0, running:false, hurryEnd:0, hurryLeftAtPause:0, overNotified:false, upNotified:false, lastTick:-1 };
let tickH = null;
function timerReset(autoStart){
  T.acc = 0; T.hurryEnd = 0; T.hurryLeftAtPause = 0; T.overNotified = false; T.upNotified = false; T.lastTick = -1;
  T.running = !!autoStart; T.start = Date.now();
  clearInterval(tickH); tickH = setInterval(drawTimer, 250);
}
function elapsed(){ return T.acc + (T.running ? Date.now() - T.start : 0); }
function togglePause(){
  if (T.running){ T.acc += Date.now() - T.start; T.running = false; if (T.hurryEnd) T.hurryLeftAtPause = Math.max(0, T.hurryEnd - Date.now()); }
  else { T.start = Date.now(); T.running = true; if (T.hurryLeftAtPause) { T.hurryEnd = Date.now() + T.hurryLeftAtPause; T.hurryLeftAtPause = 0; } }
  drawTimer(true);
}
function hurry(){
  if (!T.running) { T.start = Date.now(); T.running = true; }
  T.hurryEnd = Date.now() + prefs.hurry * 1000; T.hurryLeftAtPause = 0; T.upNotified = false; T.lastTick = -1; drawTimer(true);
}
function hurryLeft(){
  if (!T.hurryEnd) return null;
  if (!T.running) return T.hurryLeftAtPause;
  return Math.max(0, T.hurryEnd - Date.now());
}

function renderRoute(){
  const c = cur(), keys = stepKeys(), L = seq(S.size);
  $('#route').innerHTML = keys.map((k,i)=>{
    const isCur = stepOf(c) === k;
    const lastOf = L.map((x,j)=>stepOf(x)===k?j:-1).filter(j=>j>=0).pop();
    const done = !isCur && S.visited.includes(lastOf) && S.pos > lastOf;
    return `<li><button type="button" data-act="jump" data-k="${k}" ${isCur?'aria-current="step"':''} class="${done?'done':''}">${i+1} ${esc(CONTENT.steps[k].name)}</button></li>`;
  }).join('');
}

// Who does what in this turn. Returns [{letter, role}] for the label.
function listenerRoles(p){
  const n = S.size, st = CONTENT.steps.tour;
  if (n === 2) return [{ i:(p+1)%2, name:U.listener, text:st.pairListener }];
  return [{ i:(p+1)%3, name:st.curious.name, text:st.curious.text }, { i:(p+2)%3, name:st.detail.name, text:st.detail.text }];
}
function turnHTML(p, k){
  const n = S.size, who = CONTENT.students.slice(0,n);
  let label;
  if (k === 'retell'){
    const st = CONTENT.steps.retell, t = (p+1)%n;
    label = `${esc(st.tellerName)}: Student ${who[t]} · ${esc(st.ownerName)}: Student ${who[p]}`;
    return `<div class="turn">${who.map((w,i)=>`<span class="who ${i===t?'now':''}" aria-hidden="true">${w}</span>`).join('')}<span class="label">${label}</span></div>`;
  }
  const others = k === 'tour'
    ? listenerRoles(p).map(r=>`${esc(r.name)}: Student ${who[r.i]}`).join(' · ')
    : `${esc(n===2?U.listener:U.listeners)}: ${who.filter((_,i)=>i!==p).map(w=>'Student '+w).join(' and ')}`;
  label = `${esc(U.speaker)}: Student ${who[p]} · ${others}`;
  return `<div class="turn">${who.map((w,i)=>`<span class="who ${i===p?'now':''}" aria-hidden="true">${w}</span>`).join('')}<span class="label">${label}</span></div>`;
}

function renderPlay(animate){ renderTools(); renderRoute(); renderMain(animate); }

function drawTimer(force){
  const clock = $('#clock'); if (!clock) return;
  const c = cur(); const st = CONTENT.steps[c.k]; if (!st) return;
  const el = elapsed(), left = hurryLeft();
  const state = $('#tstate'), sub = $('#tsub'), pb = $('#pauseBtn');
  if (left !== null){
    const s = Math.ceil(left/1000);
    clock.textContent = left > 0 ? `0:${String(s).padStart(2,'0')}` : '0:00';
    clock.classList.add('hurry');
    state.textContent = left > 0 ? `⏳ ${U.hurry}` : `⏰ ${U.timesUp}`;
    sub.textContent = mmss(el);
    if (T.running && left > 0 && s <= 5 && s !== T.lastTick){ T.lastTick = s; sfx.tick(); }
    if (left <= 0 && !T.upNotified){ T.upNotified = true; sfx.chime(); }
  } else {
    clock.textContent = mmss(el); clock.classList.remove('hurry');
    const over = el >= st.minutes * 60000;
    state.textContent = !T.running ? `⏸ ${U.paused}` : over ? `🔔 ${U.overtime}` : `● ${U.running}`;
    sub.textContent = U.about(st.minutes);
    if (over && T.running && !T.overNotified){ T.overNotified = true; sfx.soft(); }
  }
  if (!T.running && left !== null) state.textContent = `⏸ ${U.paused}`;
  if (pb) pb.textContent = T.running ? `⏸ ${U.pause}` : `▶ ${U.play}`;
}

/* ---------- sound (Web Audio, no files) ---------- */
let AC = null;
function tone(freq, dur=.12, type='sine', gain=.07, when=0){
  if (!prefs.sound) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const t = AC.currentTime + when, o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(gain, t+.01); g.gain.exponentialRampToValueAtTime(.0001, t+dur);
    o.connect(g).connect(AC.destination); o.start(t); o.stop(t+dur+.02);
  } catch(e){}
}
const sfx = {
  tick(){ tone(880, .05, 'triangle', .04); },
  soft(){ [660, 880].forEach((f,i)=>tone(f, .35, 'sine', .05, i*.2)); },
  chime(){ [784, 988, 1175, 1568].forEach((f,i)=>tone(f, .6, 'sine', .07, i*.18)); },
};

/* ---------- full screen and wake lock ---------- */
function toggleFull(){ const d = document, el = d.documentElement; try { (d.fullscreenElement ? d.exitFullscreen() : el.requestFullscreen()).catch(()=>{}); } catch(e){} }
let lock = null;
async function keepAwake(on=true){ try { if (on && 'wakeLock' in navigator) lock = await navigator.wakeLock.request('screen'); else if (!on && lock){ await lock.release(); lock = null; } } catch(e){} }

/* ================= saving ================= */
const KEY = 'memorymap.v2', PKEY = 'memorymap.prefs';
const store = {
  load(){ try { const d = JSON.parse(localStorage.getItem(KEY)); return valid(d) ? d : null; } catch(e){ return null; } },
  save(d){ try { localStorage.setItem(KEY, JSON.stringify(d)); } catch(e){} },
  clear(){ try { localStorage.removeItem(KEY); } catch(e){} },
};
function valid(d){
  return d && d.v === 2 && CONTENT.sizes.includes(d.size) && Number.isInteger(d.pos) && d.pos >= 0 && d.pos < seq(d.size).length && Array.isArray(d.visited);
}
function save(){ if (S) store.save({ v:2, size:S.size, pos:S.pos, visited:S.visited.filter(Number.isInteger) }); }
function loadPrefs(){ try { const p = JSON.parse(localStorage.getItem(PKEY)); if (p){ if (typeof p.sound === 'boolean') prefs.sound = p.sound; if (HURRY.includes(p.hurry)) prefs.hurry = p.hurry; } } catch(e){} }
function savePrefs(){ try { localStorage.setItem(PKEY, JSON.stringify(prefs)); } catch(e){} }

/* ================= events ================= */
const ACT = {
  size(b){ document.querySelectorAll('[data-act="size"]').forEach(x=>x.setAttribute('aria-pressed', String(x===b))); },
  start(){ const sel = document.querySelector('[data-act="size"][aria-pressed="true"]'); startActivity(+(sel?.dataset.n || 3)); enterPlay(); },
  resume(){ const d = store.load(); if (!d) return renderStart(); S = { ...d, open:null }; timerReset(true); enterPlay(); },
  restart(){ store.clear(); S = null; clearInterval(tickH); keepAwake(false); renderStart(); show('start'); },
  home(){ clearInterval(tickH); keepAwake(false); renderStart(); show('start'); },
  next(){ const L = seq(S.size); if (S.pos < L.length-1){ go(S.pos+1); renderPlay(true); scrollTop(); } },
  prev(){ if (S.pos > 0){ go(S.pos-1); renderPlay(true); scrollTop(); } },
  jump(b){ const p = firstPosOf(b.dataset.k); if (p >= 0 && p !== S.pos){ go(p); renderPlay(true); scrollTop(); } },
  theme(b){ S.open = S.open === b.dataset.id ? null : b.dataset.id; renderMain(false);
            const qc = $('#qcard'); if (S.open && qc && qc.getBoundingClientRect().bottom > innerHeight - 90) qc.scrollIntoView({block:'nearest', behavior:'smooth'}); },
  pause(){ togglePause(); },
  reset(){ timerReset(true); drawTimer(true); },
  hurry(){ hurry(); },
  hsecs(b){ prefs.hurry = +b.dataset.s; savePrefs(); document.querySelectorAll('[data-act="hsecs"]').forEach(x=>x.setAttribute('aria-pressed', String(x===b))); },
  sound(){ prefs.sound = !prefs.sound; savePrefs(); renderTools(); },
  full(){ toggleFull(); },
  phrases(){ const a = $('#aside'); a.scrollIntoView({behavior:'smooth', block:'start'}); a.focus({preventScroll:true}); },
};
function scrollTop(){ window.scrollTo({top:0}); }
function enterPlay(){ renderAside(); show('play'); renderPlay(true); keepAwake(); }
document.addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (!b || b.disabled) return; ACT[b.dataset.act]?.(b); });
addEventListener('keydown', e => {
  if (e.target.closest('input, textarea, [contenteditable]')) return;
  if (!$('#play').classList.contains('active')) return;
  if (e.key === 'ArrowRight') ACT.next();
  else if (e.key === 'ArrowLeft') ACT.prev();
  else if (e.key === ' ' && !e.target.closest('button, summary')) { e.preventDefault(); togglePause(); }
  else if (e.key === 'h' || e.key === 'H') hurry();
  else if (e.key === 'f' || e.key === 'F') toggleFull();
});
document.addEventListener('visibilitychange', () => { if (!document.hidden && S && $('#play').classList.contains('active')) keepAwake(); });

/* ================= init ================= */
loadPrefs(); renderStart();
</script>
<script>
/* ===== Class of Coffee – origin check (separate from the tool's own code) ===== */
(function () {
  var HOME = ['classofcoffee.com', 'www.classofcoffee.com', 'as1-design.github.io', 'localhost', '127.0.0.1'];
  if (HOME.indexOf(location.hostname) > -1) return;
  try { if (sessionStorage.getItem('coc-origin-closed')) return; } catch (e) {}

  function show() {
    if (document.querySelector('.coc-origin')) return;
    var canon = document.querySelector('link[rel="canonical"]');
    var url = canon && /^https:\/\//.test(canon.href) ? canon.href : 'https://classofcoffee.com';
    var box = document.createElement('aside');
    box.className = 'coc-origin';
    box.setAttribute('aria-label', 'About this activity');
    box.innerHTML = '<svg viewBox="4 4 48 48" aria-hidden="true" focusable="false"><path d="M48.31 17.2A23 23 0 1 0 48.31 38.8A3.25 3.25 0 0 0 42.57 35.75A16.5 16.5 0 1 1 42.57 20.25A3.25 3.25 0 0 0 48.31 17.2Z" fill="#A2521A" stroke="#5A2D0C" stroke-width="1.8"/><circle cx="28" cy="28" r="12.2" fill="#744823"/><path d="M32.5 22.64A7.0 7.0 0 1 0 32.5 33.36L32.64 32.21A5.5 5.5 0 1 1 32.64 23.79Z" fill="#F3E2BF"/></svg>';
    var text = document.createElement('span');
    text.textContent = 'Original by Class of Coffee';
    var link = document.createElement('a');
    link.href = url; link.target = '_blank'; link.rel = 'noopener';
    link.textContent = 'Open the original';
    var close = document.createElement('button');
    close.type = 'button'; close.setAttribute('aria-label', 'Close this note'); close.textContent = '×';
    close.addEventListener('click', function () {
      box.remove();
      try { sessionStorage.setItem('coc-origin-closed', '1'); } catch (e) {}
    });
    box.appendChild(text); box.appendChild(link); box.appendChild(close);
    document.body.appendChild(box);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', show); else show();
})();
</script>
