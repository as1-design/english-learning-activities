            progress and the mistakes list use them.

.badge{position:absolute;top:-.55rem;right:-.45rem;width:1.35rem;height:1.35rem;border-radius:50%;display:grid;place-items:center;font-size:.8rem;font-weight:900;color:#fff;background:var(--ink);line-height:1}
.right .badge,.ok .badge{background:var(--ok)}

.bar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:rgba(255,246,227,.96);border-top:2px solid var(--line);

<script>
/* ================= CONTENT (edit here) ================= */
const CONTENT = {
  title: 'Inversion',
  subtitle: 'B2.2 · English File Advanced',
  canDo: 'I can use inversion to make what I say and write more emphatic or more formal.',
  publishedUrl: 'https://as1-design.github.io/english-learning-activities/b22-inversion.html',

  // Fixed option labels for two kinds of check.
  okOptions: ['Correct', 'Not correct'],
  whereOptions: ['Straight after this part', 'Later, in the main clause'],

  // Instructions shown above each kind of step.
  instr: {
    discover: 'Tap the words that are inverted, then tap Check.',
    see: 'Tap the button to change the word order.',
    choice: 'Choose the correct option.',
    reply: 'Choose the best reply.',
    ok: 'Is this sentence correct?',
    where: 'Where does the inversion come? Read the beginning and decide.',
  },

  // Each topic: discover = sentences to explore, see = plain/inverted pairs,
  // rule = explanation, checks = quick checks (types: choice, reply, ok, where).
  topics: [
    {
      id: 't1', title: 'So do I / Neither can I', tag: 'use', where: 'Conversation, chats and messages',
      why: 'You use this every day to agree with people quickly and naturally.',
      discover: [
        { s: '“I can’t stand queues.” “Neither [can I].”', why: 'After *Neither*, the modal *can* comes before the subject *I*.' },
      ],
      see: [
        { plain: 'I do too.', inv: 'So [do I].', label: 'With inversion', prompt: 'Say both replies aloud. Both are correct, and *So do I* is very common.' },
        { plain: 'I can’t either.', inv: 'Neither [can I].', label: 'With inversion', prompt: 'Notice that *can’t* becomes *can*: *Neither* already makes the reply negative.' },
      ],
      rule: {
        text: [
          'To agree with a positive statement, use *So*. To agree with a negative statement, use *Neither* or *Nor*.',
          'Then use the same auxiliary, modal or *be* as the first speaker, and then the subject. If there is no auxiliary (present or past simple), use *do*, *does* or *did*.',
          'To disagree, do not invert: “I love jazz.” “I don’t.” / “I can’t swim.” “I can.”',
        ],
        formula: ['So / Neither / Nor', 'auxiliary / modal / be', 'subject'],
        notes: [
          { kind: 'l1', title: 'Catalan and Spanish', text: 'You say *Jo també / Yo también* or *Jo tampoc / Yo tampoco*. In English the short reply needs a verb: *So do I*, *Neither can I*. *Neither I* is not correct.' },
          { kind: 'us', title: 'UK and US', text: 'In informal speech, *Me too* and *Me neither* are common in both varieties. In informal American English you may also hear *Me either*.' },
        ],
      },
      checks: [
        { id: 't1c1', type: 'reply', s: '“I’d love to live by the sea.”', options: ['So do I.', 'So would I.', 'Neither would I.'], a: 1, why: '*I’d* = *I would*, so the reply uses *would*. The statement is positive, so use *So*.' },
        { id: 't1c2', type: 'reply', s: '“I wasn’t at the meeting yesterday.”', options: ['So was I.', 'Neither did I.', 'Neither was I.'], a: 2, why: 'The statement is negative and uses *was*, so the reply is *Neither was I*.' },
        { id: 't1c3', type: 'reply', s: '“Alex has already booked a ticket.”', options: ['So has Sam.', 'So did Sam.', 'Neither has Sam.'], a: 0, why: 'The statement uses the present perfect (*has booked*), so the reply uses *has*.' },
        { id: 't1c4', type: 'reply', s: '“I can’t remember her surname.”', options: ['So can I.', 'Nor do I.', 'Nor can I.'], a: 2, why: 'The statement is negative and uses *can*, so the reply is *Nor can I* (or *Neither can I*).' },
      ],
    },
    {
      id: 't2', title: 'What is inversion?', tag: 'use', where: 'Questions and everyday conversation',
      why: 'Inversion is the word order you already use in questions. Seeing this makes the other patterns easier.',
      discover: [
        { s: 'Where [are you] staying this weekend?', why: 'In a question, *be* (*are*) comes before the subject (*you*).' },
        { s: '[Could you] tell me where you are staying?', why: 'The question starts with *Could you*. The second part (*where you are staying*) is an indirect question, so it keeps normal order.' },
      ],
      see: [
        { plain: 'You are staying at a hotel.', inv: '[Are you] staying at a hotel?', label: 'Question', prompt: 'This is inversion: the verb comes before the subject.' },
        { plain: 'I had never felt so welcome.', inv: 'Never [had I] felt so welcome.', label: 'With inversion', prompt: 'The same word order can appear in a statement. Say both aloud. Which one sounds more emphatic?' },
      ],
      rule: {
        text: [
          'Inversion means that the auxiliary, modal or *be* comes before the subject. You already do this in questions.',
          'In an indirect question (*Do you know where…? Could you tell me what…?*) the second part keeps normal order: *Do you know where the station is?*',
          'In statements, inversion makes the sentence more emphatic or more formal. It is more common in writing and speeches than in conversation.',
        ],
        formula: ['be / modal / auxiliary', 'subject', 'main verb'],
        notes: [
          { kind: 'l1', title: 'Catalan and Spanish', text: 'A question can keep normal order: *El teu germà ve? / ¿Tu hermano viene?* An English question needs the auxiliary before the subject: *Is your brother coming?*' },
        ],
      },
      checks: [
        { id: 't2c1', type: 'choice', s: 'Could you tell me what time ___ ?', options: ['the museum opens', 'does the museum open', 'opens the museum'], a: 0, why: 'After *Could you tell me…*, the second part is an indirect question, so it keeps normal order.' },
        { id: 't2c2', type: 'ok', s: 'Do you know where is the station?', a: 1, fix: 'Do you know where the station [is]?', why: 'In an indirect question, the verb goes after the subject.' },
        { id: 't2c3', type: 'choice', s: 'Where ___ last summer?', options: ['you went', 'did you go', 'went you'], a: 1, why: 'A direct question in the past simple needs *did* before the subject.' },
      ],
    },
    {
      id: 't3', title: 'Inversion straight after the word', tag: 'use', where: 'Reviews, speeches, formal emails and stories',
      why: 'These words at the start of a sentence add emphasis. They are typical of formal writing, speeches and storytelling.',

/* ================= state ================= */
const KEY = 'b22-inversion.v1', PKEY = 'b22-inversion.prefs';
// S is saved: ans = answers per check id, disc = discover answers, done = finished topics, mistakes = ids.
let S = { v: 1, ans: {}, disc: {}, done: {}, mistakes: [] };
let P = { sound: true };
// V is the view (not saved): where we are and temporary display states.
const V = { screen: 'home', t: 0, step: 0, panel: false, swapped: {}, qr: {}, mDeck: [], mAns: {}, confirmReset: false, lastKey: '' };

/* ================= logic ================= */
const T = i => CONTENT.topics[i];
const allChecks = () => CONTENT.topics.flatMap(t => t.checks);
const checkById = id => allChecks().find(c => c.id === id);
const optionsOf = c => c.type === 'ok' ? CONTENT.okOptions : c.type === 'where' ? CONTENT.whereOptions : c.options;

function stepsFor(t){
  const st = [];
  t.discover.forEach(d => st.push({ kind: 'discover', item: d }));
  t.see.forEach((p, i) => st.push({ kind: 'see', item: p, key: t.id + 's' + i }));
  st.push({ kind: 'rule', item: t.rule });
  t.checks.forEach(c => st.push({ kind: 'check', item: c }));
  st.push({ kind: 'done' });
  return st;
}
function mistakeSteps(){
  const st = [{ kind: 'mintro' }];
  V.mDeck.forEach(id => { const c = checkById(id); if (c) st.push({ kind: 'check', item: c, mist: true }); });
  if (V.mDeck.length) st.push({ kind: 'mdone' });
  return st;
}
function currentSteps(){ return V.screen === 'mist' ? mistakeSteps() : stepsFor(T(V.t)); }
function ansStore(mist){ return mist ? V.mAns : S.ans; }

function pick(item, idx, mist){
  const store = ansStore(mist);
  const st = store[item.id] || { p: [], done: false, first: false, auto: false };
  if (st.done || st.p.includes(idx)) return null;
  st.p.push(idx);
  const n = optionsOf(item).length;
  if (idx === item.a){ st.done = true; st.first = st.p.length === 1; }
  else if (n - st.p.length <= 1){ st.done = true; st.first = false; st.auto = true; }
  store[item.id] = st;
  if (st.done){
    if (mist){ if (st.first) S.mistakes = S.mistakes.filter(x => x !== item.id); }
    else if (!st.first && !S.mistakes.includes(item.id)) S.mistakes.push(item.id);
  }
  save();
  return idx === item.a ? 'right' : (st.done ? 'shown' : 'wrong');
}
function toggleTok(id, i){
  const d = S.disc[id] || { sel: [], checked: false };
  if (d.checked) return;
  d.sel = d.sel.includes(i) ? d.sel.filter(x => x !== i) : d.sel.concat(i);
  S.disc[id] = d; save();
}
function checkDisc(id){ const d = S.disc[id] || { sel: [], checked: false }; d.checked = true; S.disc[id] = d; save(); }
function topicScore(t){
  let first = 0, answered = 0;
  t.checks.forEach(c => { const a = S.ans[c.id]; if (a && a.done){ answered++; if (a.first) first++; } });
  return { first, answered, total: t.checks.length };
}
function canGoNext(){
  const steps = currentSteps(), s = steps[V.step];
  if (!s) return false;
  if (s.kind === 'check'){ const a = ansStore(s.mist)[s.item.id]; return !!(a && a.done); }
  return true;
}
function go(delta){
  const steps = currentSteps();
  const ns = V.step + delta;
  if (delta > 0 && !canGoNext()) return;
  if (ns < 0) return;
  if (ns >= steps.length){
    if (V.screen === 'topic'){ if (V.t < CONTENT.topics.length - 1) openTopic(V.t + 1); else home(); }
    else home();
    return;
  }
  V.step = ns; V.panel = false;
  if (V.screen === 'topic' && steps[ns].kind === 'done'){ S.done[T(V.t).id] = true; save(); }
  render();
}
function openTopic(i){ V.screen = 'topic'; V.t = i; V.step = 0; V.panel = false; render(); scrollTo(0, 0); }
function home(){ V.screen = 'home'; V.panel = false; render(); scrollTo(0, 0); }
function openMist(){ V.screen = 'mist'; V.mDeck = S.mistakes.filter(id => checkById(id)); V.mAns = {}; V.step = 0; render(); scrollTo(0, 0); }
function resetAll(){ S = { v: 1, ans: {}, disc: {}, done: {}, mistakes: [] }; V.swapped = {}; V.confirmReset = false; store.clear(); }

/* ================= text helpers ================= */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
// [x] → highlighted inverted words, *x* → italics, ___ → gap
function fmt(s, fill){
  let h = esc(s);
  h = h.replace(/\[([^\]]+)\]/g, '<mark class="inv">$1</mark>');
  h = h.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  h = h.replace(/_{3,}/g, fill != null ? `<mark class="inv">${esc(fill)}</mark>` : '<span class="gap" aria-label="gap"></span>');
  return h;
}
// Split a sentence into word tokens. Returns [{w, hl, p}] where p = punctuation token.
function tokens(s){
  const out = []; let inB = false;
  s.split(/\s+/).filter(Boolean).forEach(raw => {
    let w = raw, end = false, punct = '';
    const lead = w.match(/^[“"‘]+/); if (lead){ out.push({ w: lead[0], p: 'l' }); w = w.slice(lead[0].length); }
    if (w.startsWith('[')){ inB = true; w = w.slice(1); }
    const tail = w.match(/[.,!?;:”"]+$/); if (tail){ punct = tail[0]; w = w.slice(0, -punct.length); }
    if (w.endsWith(']')){ end = true; w = w.slice(0, -1); }
    if (w) out.push({ w, hl: inB });
    if (end) inB = false;
    if (punct) out.push({ w: punct, p: 't' });
  });
  return out;
}

/* ================= QR code (offline, byte mode, level M, versions 1–10) ================= */
const QR = (() => {
  const EC = [null,[10,1,16,0,0],[16,1,28,0,0],[26,1,44,0,0],[18,2,32,0,0],[24,2,43,0,0],[16,4,27,0,0],[18,4,31,0,0],[22,2,38,2,39],[22,3,36,2,37],[26,4,43,1,44]];
  const AL = [null,[],[6,18],[6,22],[6,26],[6,30],[6,34],[6,22,38],[6,24,42],[6,26,46],[6,28,50]];
  const mul = (x, y) => { let z = 0; for (let i = 7; i >= 0; i--){ z = (z << 1) ^ ((z >>> 7) * 0x11D); z ^= ((y >>> i) & 1) * x; } return z & 255; };
  const div = d => { const r = new Array(d).fill(0); r[d - 1] = 1; let root = 1; for (let i = 0; i < d; i++){ for (let j = 0; j < d; j++){ r[j] = mul(r[j], root); if (j + 1 < d) r[j] ^= r[j + 1]; } root = mul(root, 2); } return r; };
  const rem = (data, dv) => { const r = dv.map(() => 0); for (const b of data){ const f = b ^ r.shift(); r.push(0); dv.forEach((c, i) => { r[i] ^= mul(c, f); }); } return r; };
  return function make(text){
    const bytes = Array.from(new TextEncoder().encode(text));
    let ver = 0;
    for (let v = 1; v <= 10; v++){ const e = EC[v], cap = e[1] * e[2] + e[3] * e[4]; const cb = v < 10 ? 8 : 16; if (4 + cb + bytes.length * 8 <= cap * 8){ ver = v; break; } }
    if (!ver) return null;
    const [ecl, b1, d1, b2, d2] = EC[ver], cap = b1 * d1 + b2 * d2, size = ver * 4 + 17;
    const bits = []; const put = (val, n) => { for (let i = n - 1; i >= 0; i--) bits.push((val >>> i) & 1); };
    put(4, 4); put(bytes.length, ver < 10 ? 8 : 16); bytes.forEach(b => put(b, 8));
    put(0, Math.min(4, cap * 8 - bits.length)); while (bits.length % 8) bits.push(0);
    const data = []; for (let i = 0; i < bits.length; i += 8) data.push(parseInt(bits.slice(i, i + 8).join(''), 2));
    for (let p = 0xEC; data.length < cap; p ^= 0xEC ^ 0x11) data.push(p);
    const blocks = []; let k = 0; const dv = div(ecl);
    for (let i = 0; i < b1 + b2; i++){ const len = i < b1 ? d1 : d2; const d = data.slice(k, k + len); k += len; blocks.push({ d, e: rem(d, dv) }); }
    const all = []; const maxD = Math.max(d1, d2);
    for (let i = 0; i < maxD; i++) blocks.forEach(b => { if (i < b.d.length) all.push(b.d[i]); });
    for (let i = 0; i < ecl; i++) blocks.forEach(b => all.push(b.e[i]));
    const M = Array.from({ length: size }, () => new Array(size).fill(false));
    const F = Array.from({ length: size }, () => new Array(size).fill(false));
    const set = (x, y, v) => { M[y][x] = v; F[y][x] = true; };
    for (let i = 0; i < size; i++){ set(6, i, i % 2 === 0); set(i, 6, i % 2 === 0); }
    [[3, 3], [size - 4, 3], [3, size - 4]].forEach(([cx, cy]) => { for (let dy = -4; dy <= 4; dy++) for (let dx = -4; dx <= 4; dx++){ const x = cx + dx, y = cy + dy; if (x >= 0 && x < size && y >= 0 && y < size){ const d = Math.max(Math.abs(dx), Math.abs(dy)); set(x, y, d !== 2 && d !== 4); } } });
    const al = AL[ver], last = al.length - 1;
    al.forEach((ax, i) => al.forEach((ay, j) => { if ((i === 0 && j === 0) || (i === 0 && j === last) || (i === last && j === 0)) return; for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) set(ax + dx, ay + dy, Math.max(Math.abs(dx), Math.abs(dy)) !== 1); }));
    const fmtBits = mask => { const d = (0 << 3) | mask; let r = d; for (let i = 0; i < 10; i++) r = (r << 1) ^ ((r >>> 9) * 0x537); const b = ((d << 10) | r) ^ 0x5412; const g = i => ((b >>> i) & 1) === 1;
      for (let i = 0; i <= 5; i++) set(8, i, g(i)); set(8, 7, g(6)); set(8, 8, g(7)); set(7, 8, g(8));
      for (let i = 9; i < 15; i++) set(14 - i, 8, g(i));
      for (let i = 0; i < 8; i++) set(size - 1 - i, 8, g(i));
      for (let i = 8; i < 15; i++) set(8, size - 15 + i, g(i));
      set(8, size - 8, true); };
    fmtBits(0);
    if (ver >= 7){ let r = ver; for (let i = 0; i < 12; i++) r = (r << 1) ^ ((r >>> 11) * 0x1F25); const b = (ver << 12) | r;
      for (let i = 0; i < 18; i++){ const v = ((b >>> i) & 1) === 1, a = size - 11 + (i % 3), c = Math.floor(i / 3); set(a, c, v); set(c, a, v); } }
    let bi = 0;
    for (let right = size - 1; right >= 1; right -= 2){ if (right === 6) right = 5;
      for (let vert = 0; vert < size; vert++) for (let j = 0; j < 2; j++){ const x = right - j, up = ((right + 1) & 2) === 0, y = up ? size - 1 - vert : vert;
        if (!F[y][x] && bi < all.length * 8){ M[y][x] = ((all[bi >>> 3] >>> (7 - (bi & 7))) & 1) === 1; bi++; } } }
    const masks = [(x, y) => (x + y) % 2 === 0, (x, y) => y % 2 === 0, (x) => x % 3 === 0, (x, y) => (x + y) % 3 === 0, (x, y) => (Math.floor(x / 3) + Math.floor(y / 2)) % 2 === 0, (x, y) => x * y % 2 + x * y % 3 === 0, (x, y) => (x * y % 2 + x * y % 3) % 2 === 0, (x, y) => ((x + y) % 2 + x * y % 3) % 2 === 0];
    const apply = m => { for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) if (!F[y][x] && masks[m](x, y)) M[y][x] = !M[y][x]; };
    const penalty = () => { let p = 0, dark = 0;
      for (let y = 0; y < size; y++){ let run = 1, runV = 1; for (let x = 0; x < size; x++){ if (M[y][x]) dark++;
        if (x > 0){ if (M[y][x] === M[y][x - 1]){ run++; if (run === 5) p += 3; else if (run > 5) p++; } else run = 1;
                    if (M[x][y] === M[x - 1][y]){ runV++; if (runV === 5) p += 3; else if (runV > 5) p++; } else runV = 1; }
        if (x < size - 1 && y < size - 1 && M[y][x] === M[y][x + 1] && M[y][x] === M[y + 1][x] && M[y][x] === M[y + 1][x + 1]) p += 3; } }
      p += Math.floor(Math.abs(dark * 20 - size * size * 10) / (size * size)) * 10; return p; };
    let best = 0, bestP = Infinity;
    for (let m = 0; m < 8; m++){ apply(m); fmtBits(m); const p = penalty(); if (p < bestP){ bestP = p; best = m; } apply(m); }
    apply(best); fmtBits(best);
    let path = ''; for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) if (M[y][x]) path += `M${x + 4} ${y + 4}h1v1h-1z`;
    const n = size + 8;
    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${n} ${n}" shape-rendering="crispEdges" role="img" aria-label="QR code"><rect width="${n}" height="${n}" fill="#fff"/><path d="${path}" fill="#000"/></svg>`;
  };
})();
function pageUrl(){
  if (/^https?:/.test(location.protocol)) return location.origin + location.pathname;
  return CONTENT.publishedUrl;
}

/* ================= display ================= */
const app = document.getElementById('app');
function tagPill(t){ return t.tag === 'use' ? '<span class="pill use">Use it</span>' : '<span class="pill rec">Recognise it</span>'; }

function render(){
  document.body.classList.toggle('has-bar', V.screen === 'topic' || V.screen === 'mist');
  if (V.screen === 'home') renderHome();
  else if (V.screen === 'topic' || V.screen === 'mist') renderStep();
  else if (V.screen === 'more') renderMore();
  else if (V.screen === 'settings') renderSettings();
  renderBar();
}

function renderHome(){
  const tiles = CONTENT.topics.map((t, i) => {
    const sc = topicScore(t), done = S.done[t.id];
    const status = done ? `✓ Done · ${sc.first} of ${sc.total} right first time` : (sc.answered || Object.keys(S.disc).some(k => k.startsWith(t.id + 'd')) ? 'In progress' : 'Not started');
    return `<button class="tile${done ? ' done' : ''}${t.extra ? ' extra' : ''}" data-act="topic" data-i="${i}">
      <span class="num" aria-hidden="true">${i + 1}</span>
      ${tagPill(t)}
      <h2><span class="sr">Topic ${i + 1}: </span>${fmt(t.title)}</h2>
      <span class="where">Where you’ll see it: ${fmt(t.where)}</span>
      <span class="status">${status}</span>
    </button>`;
  }).join('');
  const nextI = CONTENT.topics.findIndex(t => !S.done[t.id]);
  const startLabel = nextI === -1 ? 'Start again from topic 1' : (nextI === 0 && !Object.keys(S.ans).length ? 'Start with topic 1' : `Continue with topic ${nextI + 1}`);
  const n = S.mistakes.filter(id => checkById(id)).length;
  app.innerHTML = `
    <header class="hero">
      <h1>${esc(CONTENT.title)}</h1>
      <div class="echo" aria-hidden="true">${esc(CONTENT.title)}</div>
      <p class="sub">${esc(CONTENT.subtitle)}</p>
    </header>
    <div class="cando"><b>Can do</b>${esc(CONTENT.canDo)}</div>
    <div class="start row"><button class="btn primary" data-act="topic" data-i="${nextI === -1 ? 0 : nextI}">${startLabel} →</button></div>
    <div class="tiles">${tiles}</div>
    <div class="row home-more">
      <button class="btn mistbtn" data-act="mist">My mistakes (${n})</button>
      <button class="btn morebtn" data-act="more">More practice</button>
      <button class="btn ghost" data-act="settings">⚙ Settings</button>
    </div>`;
  V.lastKey = 'home';
}

function stepCard(s, key, inner){
  const fresh = key !== V.lastKey; V.lastKey = key;
  return `<div class="card${fresh ? ' enter' : ''}">${inner}</div>`;
}

function renderStep(){
  const steps = currentSteps(), s = steps[V.step];
  const isMist = V.screen === 'mist';
  const t = isMist ? null : T(V.t);
  let head;
  if (isMist){
    head = `<div class="tophead"><button class="btn ghost" data-act="home">← Topics</button><h1>My mistakes</h1></div>`;
  } else {
    head = `<div class="tophead"><button class="btn ghost" data-act="home">← Topics</button><h1>${V.t + 1}. ${fmt(t.title)}</h1></div>
      <div class="meta">${tagPill(t)}<span>Where you’ll see it: ${fmt(t.where)}</span></div>
      ${V.step === 0 ? `<p class="why">${fmt(t.why)}</p>` : ''}`;
  }
  const key = V.screen + V.t + '-' + V.step + (V.panel ? 'p' : '');
  let inner = '';
  if (s.kind === 'discover') inner = discoverHTML(s.item, t.id + 'd' + t.discover.indexOf(s.item));
  else if (s.kind === 'see') inner = seeHTML(s);
  else if (s.kind === 'rule') inner = V.panel ? panelHTML(s.item.panel) : ruleHTML(s.item, t);
  else if (s.kind === 'check') inner = (t && t.diagram ? diagramHTML(t.diagram, true) : '') + checkHTML(s.item, s.mist);
  else if (s.kind === 'done') inner = doneHTML(t);
  else if (s.kind === 'mintro') inner = mintroHTML();
  else if (s.kind === 'mdone') inner = mdoneHTML();
  app.innerHTML = head + stepCard(s, key, inner);
}

function discoverHTML(item, id){
  const d = S.disc[id] || { sel: [], checked: false };
  const toks = tokens(item.s);
  const answer = toks.map((tk, i) => tk.hl ? i : -1).filter(i => i >= 0);
  const exact = d.checked && answer.length === d.sel.length && answer.every(i => d.sel.includes(i));
  const tk = toks.map((tk, i) => {
    if (tk.p) return `<span class="punct ${tk.p}">${esc(tk.w)}</span>`;
    const on = d.sel.includes(i);
    let cls = 'tok', mark = '', sr = '';
    if (d.checked){ if (tk.hl && on){ cls += ' ok'; mark = '✓'; sr = ' (right)'; } else if (tk.hl){ cls += ' miss'; mark = '!'; sr = ' (missed)'; } else if (on){ cls += ' bad'; mark = '✗'; sr = ' (not inverted)'; } }
    return `<button class="${cls}" data-act="tok" data-id="${id}" data-i="${i}" aria-pressed="${on}"${d.checked ? ' disabled' : ''}>${esc(tk.w)}${mark ? `<span class="badge" aria-hidden="true">${mark}</span><span class="sr">${sr}</span>` : ''}</button>`;
  }).join('');
  let fb = '';
  if (d.checked){
    fb = `<div class="fb ${exact ? 'good' : 'shown'}"><b class="v">${exact ? 'Well spotted!' : 'Here are the inverted words:'}</b><p>${fmt(item.s)}</p><p>${fmt(item.why)}</p></div>`;
  }
  return `<p class="kicker">Spot it</p><p class="instr">${esc(CONTENT.instr.discover)}</p>
    <div class="toks">${tk}</div>
    <div class="row"><button class="btn primary" style="min-width:9rem" data-act="checkdisc" data-id="${id}"${d.checked ? ' disabled' : ''}>${d.checked ? 'Checked ✓' : 'Check'}</button></div>${fb}`;
}

function seeTokens(s, swapped){
  const plain = tokens(s.item.plain), inv = tokens(s.item.inv);
  const count = {};
  plain.forEach(tk => { const k = tk.w.toLowerCase(); count[k] = (count[k] || 0) + 1; tk.key = k + '#' + count[k]; });
  const used = {};
  inv.forEach((tk, i) => { const k = tk.w.toLowerCase(); used[k] = (used[k] || 0) + 1; const key = k + '#' + used[k]; tk.key = plain.some(p => p.key === key) ? key : 'new' + i; });
  return swapped ? inv : plain;
}
function seeSentenceHTML(s, swapped){
  return seeTokens(s, swapped).map(tk => `<span class="wt${tk.p ? ' pu' : ''}${!tk.p && tk.hl && swapped ? ' hl' : ''}" data-k="${esc(tk.key)}">${esc(tk.w)}</span>`).join(' ')
    .replace(/ (<span class="wt pu")/g, '$1');
}
function seeHTML(s){
  const sw = !!V.swapped[s.key];
  return `<p class="kicker">See it</p><p class="instr">${esc(CONTENT.instr.see)}</p>
    <div class="swapbox"><div class="swaplabel${sw ? ' on' : ''}" id="swl">${sw ? esc(s.item.label) : 'Plain order'}</div>
    <p class="sent" id="swsent">${seeSentenceHTML(s, sw)}</p></div>
    <div class="row"><button class="btn primary swap" data-act="swap" data-k="${s.key}">${sw ? 'Show plain order' : 'Swap word order'}</button></div>
    <p class="prompt">${fmt(s.item.prompt)}</p>`;
}
function doSwap(btn){
  const steps = currentSteps(), s = steps[V.step]; if (!s || s.kind !== 'see') return;
  const box = document.getElementById('swsent'); if (!box) return;
  const before = {}; box.querySelectorAll('.wt').forEach(el => { before[el.dataset.k] = el.getBoundingClientRect(); });
  V.swapped[s.key] = !V.swapped[s.key];
  const sw = V.swapped[s.key];
  box.innerHTML = seeSentenceHTML(s, sw);
  const lab = document.getElementById('swl'); lab.textContent = sw ? s.item.label : 'Plain order'; lab.classList.toggle('on', sw);
  btn.textContent = sw ? 'Show plain order' : 'Swap word order';
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  box.querySelectorAll('.wt').forEach(el => {
    const b = before[el.dataset.k];
    if (reduce) return;
    if (!b){ el.classList.add('fresh'); return; }
    const a = el.getBoundingClientRect(), dx = b.left - a.left, dy = b.top - a.top;
    if (dx || dy){ el.style.transform = `translate(${dx}px,${dy}px)`; el.style.transition = 'none';
      requestAnimationFrame(() => requestAnimationFrame(() => { el.style.transition = 'transform .6s cubic-bezier(.34,1.3,.64,1)'; el.style.transform = ''; })); }
    if (sw && el.classList.contains('hl')) setTimeout(() => el.classList.add('pop'), 450);
  });
  sfx.tap();
}

function noteHTML(n){ return `<div class="note ${n.kind}"><h3>${n.kind === 'l1' ? '🗣 ' : n.kind === 'us' ? '🇬🇧🇺🇸 ' : ''}${esc(n.title)}</h3><p>${fmt(n.text)}</p></div>`; }
function formulaHTML(f){ return `<div class="formula" aria-label="Pattern">${f.map((c, i) => `${i ? '<span class="plus">+</span>' : ''}<span class="chip${i === 1 ? ' k' : ''}">${fmt(c)}</span>`).join('')}</div>`; }
function diagramHTML(d, pinned){
  return `<div class="diagram${pinned ? ' pinned' : ''}" aria-label="Two-part sentence"><div class="dpart"><small>Part 1 · normal order</small><div>${fmt(d.c1)}</div></div><span class="hinge" aria-hidden="true">→</span><div class="dpart two"><small>Part 2 · inversion</small><div>${fmt(d.c2)}</div></div></div>`;
}
function ruleHTML(r, t){
  return `<p class="kicker">The rule</p>
    ${t.diagram ? diagramHTML(t.diagram, false) : ''}
    <div class="rule">${r.text.map(p => `<p>${fmt(p)}</p>`).join('')}</div>

    ${r.notes.map(noteHTML).join('')}
    ${r.panel ? `<div class="row panelbtn"><button class="btn" data-act="panel">${esc(r.panel.button)} →</button></div>` : ''}`;
}
function panelHTML(p){

    <p class="kicker">Complete list</p><h2 style="margin-bottom:.8rem">${esc(p.title)}</h2>

      ${g.rows.map(r => `<div class="trow"><b>${fmt(r[0])}</b><span>${fmt(r[1])}</span></div>`).join('')}</div>`).join('')}`;

function checkHTML(c, mist){
  const st = ansStore(mist)[c.id] || { p: [], done: false };
  const opts = optionsOf(c);
  let sent = '';
  if (c.type === 'choice') sent = `<p class="sent">${fmt(c.s, st.done ? opts[c.a] : null)}</p>`;
  else if (c.type === 'reply') sent = `<p class="sent quote">${fmt(c.s)}</p><p class="sent">→ ${st.done ? `<mark class="inv">${esc(opts[c.a])}</mark>` : '<span class="gap" aria-label="gap"></span>'}</p>`;
  else if (c.type === 'ok') sent = `<p class="sent">${fmt(c.s)}</p>`;
  else if (c.type === 'where') sent = `<p class="sent">${st.done ? fmt(c.full) : fmt(c.first) + ' …'}</p>`;
  const ob = opts.map((o, i) => {
    const tried = st.p.includes(i), right = i === c.a;
    let cls = 'opt', mk = '';
    if (right && st.done){ cls += ' right'; mk = '✓'; }
    else if (tried){ cls += ' wrong'; mk = '✗'; }
    return `<button class="${cls}" data-act="pick" data-i="${i}"${st.done || tried ? ' disabled' : ''}>${mk ? `<span class="badge" aria-hidden="true">${mk}</span>` : ''}${esc(o)}${mk === '✓' ? '<span class="sr"> (correct answer)</span>' : mk === '✗' ? '<span class="sr"> (wrong)</span>' : ''}</button>`;
  }).join('');
  let fb = '';
  if (st.done){
    const verdict = st.auto ? 'Here is the answer.' : st.first ? 'Right!' : 'Right, on a second try.';
    const extra = c.type === 'ok' && c.fix ? `<p class="fix">${c.a === 1 ? 'Correct version: ' : ''}${fmt(c.fix)}</p>` : '';
    const note = mist ? (st.first ? '<p>This one has been removed from your mistakes.</p>' : '<p>This one stays in your mistakes for next time.</p>') : (!st.first ? '<p>It has been added to My mistakes.</p>' : '');
    fb = `<div class="fb ${st.first ? 'good' : 'shown'}" role="status"><b class="v">${verdict}</b>${extra}<p>${fmt(c.why)}</p>${note}</div>`;
  } else if (st.p.length){
    fb = `<div class="fb try" role="status"><b class="v">Not quite. Try again.</b></div>`;
  }
  const instr = CONTENT.instr[c.type];
  const from = mist ? CONTENT.topics.findIndex(t => t.checks.includes(c)) : -1;
  return `<p class="kicker">Quick check${from >= 0 ? ` · from topic ${from + 1}` : ''}</p><p class="instr">${esc(instr)}</p>${sent}<div class="opts">${ob}</div>${fb}`;
}

      <div class="linkcard"><h3>Full screen</h3><p>Useful on the classroom board. You can also press F.</p>
        <button class="btn" data-act="full">⛶ Full screen</button></div>
      <div class="linkcard"><h3>Reset my progress</h3><p>This deletes your answers and your mistakes on this device.</p>
        <button class="btn" style="min-width:14rem" data-act="reset">${V.confirmReset ? 'Tap again to confirm' : 'Reset my progress'}</button></div>
    </div>`;
  V.lastKey = 'settings';
}

function renderBar(){
  if (!(V.screen === 'topic' || V.screen === 'mist')) return;
  const steps = currentSteps(), n = steps.length;
  document.getElementById('pos').textContent = `Step ${V.step + 1} of ${n}`;
  const prev = document.getElementById('prevBtn'), next = document.getElementById('nextBtn');
  prev.disabled = V.step === 0;
  const atEnd = V.step === n - 1;
  next.textContent = atEnd ? (V.screen === 'topic' && V.t < CONTENT.topics.length - 1 ? 'Next topic →' : 'Topics') : 'Next →';
  next.disabled = !canGoNext();
}

/* ================= sound ================= */
let AC = null;
function tone(freq, dur = .12, type = 'sine', gain = .06, when = 0){
  if (!P.sound) return;
  try { AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const t = AC.currentTime + when, o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(gain, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g).connect(AC.destination); o.start(t); o.stop(t + dur + .02);
  } catch(e){}
}
const sfx = {
  tap(){ tone(660, .06, 'triangle', .04); },
  good(){ [523, 659, 784].forEach((f, i) => tone(f, .16, 'triangle', .06, i * .07)); },
  bad(){ tone(220, .18, 'triangle', .05); },
};

/* ================= saving ================= */
const store = {
  load(){ try { return JSON.parse(localStorage.getItem(KEY)); } catch(e){ return null; } },
  save(){ try { localStorage.setItem(KEY, JSON.stringify({ ...S, v: 1, savedAt: Date.now() })); } catch(e){} },
  clear(){ try { localStorage.removeItem(KEY); } catch(e){} },
};
function save(){ store.save(); }
function savePrefs(){ try { localStorage.setItem(PKEY, JSON.stringify(P)); } catch(e){} }
// Only accept saved data in the expected shape: ids that exist and numbers.
function loadSaved(){
  const d = store.load(); if (!d || typeof d !== 'object' || d.v !== 1) return;
  const ids = new Set(allChecks().map(c => c.id));
  const isIdx = x => Number.isInteger(x) && x >= 0 && x < 10;
  if (d.ans && typeof d.ans === 'object') for (const [id, a] of Object.entries(d.ans)){
    if (ids.has(id) && a && Array.isArray(a.p) && a.p.every(isIdx)) S.ans[id] = { p: a.p.slice(0, 4), done: !!a.done, first: !!a.first, auto: !!a.auto };
  }
  const discIds = new Set(CONTENT.topics.flatMap(t => t.discover.map((_, i) => t.id + 'd' + i)));
  if (d.disc && typeof d.disc === 'object') for (const [id, a] of Object.entries(d.disc)){
    if (discIds.has(id) && a && Array.isArray(a.sel) && a.sel.every(x => Number.isInteger(x) && x >= 0 && x < 40)) S.disc[id] = { sel: a.sel, checked: !!a.checked };
  }
  if (d.done && typeof d.done === 'object') CONTENT.topics.forEach(t => { if (d.done[t.id] === true) S.done[t.id] = true; });
  if (Array.isArray(d.mistakes)) S.mistakes = [...new Set(d.mistakes.filter(id => ids.has(id)))];
}
function loadPrefs(){ try { const p = JSON.parse(localStorage.getItem(PKEY)); if (p && typeof p.sound === 'boolean') P.sound = p.sound; } catch(e){} }

/* ================= events ================= */
function toggleFull(){ const d = document, el = d.documentElement; try { (d.fullscreenElement ? d.exitFullscreen() : el.requestFullscreen()).catch(() => {}); } catch(e){} }
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act;
  if (act === 'topic') openTopic(+b.dataset.i);
  else if (act === 'home') home();
  else if (act === 'more'){ V.screen = 'more'; render(); scrollTo(0, 0); }
  else if (act === 'settings'){ V.screen = 'settings'; V.confirmReset = false; render(); scrollTo(0, 0); }
  else if (act === 'mist') openMist();
  else if (act === 'next') go(1);
  else if (act === 'prev') go(-1);
  else if (act === 'tok'){ toggleTok(b.dataset.id, +b.dataset.i); sfx.tap(); render(); }
  else if (act === 'checkdisc'){ checkDisc(b.dataset.id); render(); }
  else if (act === 'swap') doSwap(b);
  else if (act === 'panel'){ V.panel = true; render(); }
  else if (act === 'panelback'){ V.panel = false; render(); }
  else if (act === 'pick'){
    const s = currentSteps()[V.step]; if (!s || s.kind !== 'check') return;
    const r = pick(s.item, +b.dataset.i, s.mist);
    if (r === 'right') sfx.good(); else if (r) sfx.bad();
    render();
  }
  else if (act === 'qr'){ V.qr[b.dataset.k] = !V.qr[b.dataset.k]; render(); }
  else if (act === 'sound'){ P.sound = !P.sound; savePrefs(); render(); }
  else if (act === 'full') toggleFull();
  else if (act === 'reset'){ if (V.confirmReset){ resetAll(); } else V.confirmReset = true; render(); }
});
document.addEventListener('keydown', e => {
  if (e.target.closest('input,textarea')) return;
  if (e.key === 'ArrowRight' && (V.screen === 'topic' || V.screen === 'mist')) go(1);
  else if (e.key === 'ArrowLeft' && (V.screen === 'topic' || V.screen === 'mist')) go(-1);
  else if (e.key === 'f' || e.key === 'F') toggleFull();
});

/* ================= start ================= */
loadPrefs(); loadSaved();
(() => { const m = location.hash.match(/^#t(\d)$/); if (m && T(+m[1] - 1)){ V.screen = 'topic'; V.t = +m[1] - 1; } })();
render();
</script>
