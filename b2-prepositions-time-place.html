}

*{box-sizing:border-box}
html{touch-action:manipulation;-webkit-text-size-adjust:100%;background:#F4E4CF}
body{margin:0;color:var(--cocoa);font:600 clamp(1rem,.96rem + .25vw,1.12rem)/1.6 var(--body);
  padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);
  min-height:100vh;display:flex;flex-direction:column}
h1,h2,h3{font-family:var(--display);color:var(--cocoa);line-height:1.2;margin:0 0 .45em;font-weight:500}
h2{font-size:clamp(1.45rem,1.2rem + 1.1vw,2rem)}
h3{font-size:1.12rem}
p{margin:0 0 .8em}
button{font:inherit;cursor:pointer;min-height:44px;color:inherit}
button:focus-visible,a:focus-visible{outline:3px solid var(--sage);outline-offset:3px}
button:disabled{cursor:not-allowed}
.wrap{width:100%;max-width:var(--maxw);margin:0 auto;padding:0 16px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (min-width:1600px){html{font-size:118%}}

/* ================= the café scene (behind everything) ================= */
.scene{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.28) 0 22px,transparent 22px 44px),linear-gradient(#F6E8D4,#F1DEC4 62%);transition:filter .5s var(--ease)}
.scene::before{content:"";position:absolute;inset:0;opacity:.06;background-image:radial-gradient(#5A3A2E 1px,transparent 1.2px);background-size:7px 7px;z-index:1}
.scene::after{content:"";position:absolute;inset:0;background:rgba(251,243,230,0);transition:background .5s var(--ease);z-index:2}
.scene svg{position:absolute;display:block;overflow:visible}
.scene .glow{position:absolute;top:60px;width:520px;height:520px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,226,150,.45),rgba(255,226,150,0));display:none}
.scene .glow.g1{left:calc(50% - 760px)} .scene .glow.g2{left:calc(50% + 240px)}
.scene .wainscot{left:0;top:62%;width:100%;height:38%}
.scene .lamps{left:0;top:0;width:100%;height:200px;display:none}
@media (min-width:1000px){.scene .lamps,.scene .glow{display:block}}
.scene .plant{top:-8px;width:clamp(92px,15vw,200px)}
.scene .plant.l{left:1vw} .scene .plant.r{right:1vw;transform:scaleX(-1)}
.scene .window{left:50%;top:max(64px,7vh);width:min(84vw,620px);transform:translateX(-50%)}
.scene .counter{left:0;right:0;bottom:0;width:100%;height:clamp(150px,27vh,270px)}
.scene .board{left:4vw;top:max(380px,46vh);width:170px;display:none}
.scene .shelf{right:4vw;top:max(380px,46vh);width:220px;display:none}
@media (min-width:1000px){.scene .board,.scene .shelf{display:block}}
body.soft .scene{filter:blur(5px) saturate(.9)}
body.soft .scene::after{background:rgba(251,243,230,.5)}
body.soft .scene *{animation-play-state:paused!important}
/* ambient motion */
.sway{transform-origin:50% 0;transform-box:fill-box;animation:sway 7s ease-in-out infinite alternate}
.sway2{transform-origin:50% 0;transform-box:fill-box;animation:sway 9s ease-in-out infinite alternate-reverse}
@keyframes sway{from{transform:rotate(-2.2deg)}to{transform:rotate(2.2deg)}}
.cloud{animation:cloud 46s linear infinite alternate}
.cloud.c2{animation-duration:62s;animation-direction:alternate-reverse}
@keyframes cloud{from{transform:translateX(-70px)}to{transform:translateX(90px)}}
.twinkle{animation:twinkle 2.8s ease-in-out infinite}
@keyframes twinkle{50%{opacity:.35}}
.steam{stroke-dasharray:6 10;animation:steam 2.4s linear infinite}
@keyframes steam{to{stroke-dashoffset:-32}}
.steam-rise{animation:rise-fade 3.2s ease-in-out infinite}
@keyframes rise-fade{0%{transform:translateY(8px);opacity:0}40%{opacity:.85}100%{transform:translateY(-14px);opacity:0}}
.breathe{transform-box:fill-box;transform-origin:50% 100%;animation:breathe 3.6s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.03,1.06)}}
.zzz{animation:zzz 3.6s ease-in-out infinite}
.flicker{animation:flicker 5s ease-in-out infinite}
@keyframes flicker{0%,100%{opacity:1}48%{opacity:.85}52%{opacity:1}}
.bird{animation:bird 30s linear infinite}.bird.b2{animation-duration:38s;animation-delay:-12s}
@keyframes bird{0%{transform:translate(-200px,30px)}100%{transform:translate(520px,-40px)}}

/* ================= header ================= */
header.top{position:sticky;top:0;z-index:4;background:rgba(255,248,238,.82);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1.5px solid rgba(90,58,46,.25)}
header.top .wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 14px;padding-top:8px;padding-bottom:8px}
body.start header.top{display:none}
.brand{display:flex;align-items:center;gap:10px;background:none;border:none;padding:0;text-align:left}
.brand .cup{width:38px;height:38px;flex:none}
.brand b{display:block;font:500 clamp(1.2rem,1.05rem + .6vw,1.5rem)/1.1 var(--display)}
.brand b .w-at{color:var(--at-ink)} .brand b .w-on{color:var(--on-ink)} .brand b .w-in{color:var(--in-ink)}
.brand small{display:block;font:700 .78rem/1.2 var(--body);color:var(--cocoa-soft)}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
@media (max-width:480px){header.top .wrap{flex-wrap:nowrap;gap:8px}.brand small{display:none}.brand .cup{width:30px;height:30px}.tabs{gap:6px;flex-wrap:nowrap}.tabs .pill{padding:4px 12px;font-size:.98rem}}

/* cream pill buttons (the café menu look) */
.pill{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--cream);color:var(--cocoa);border:var(--line);border-radius:var(--r-pill);
  padding:6px 20px;font:500 1.05rem/1.2 var(--display);box-shadow:var(--btn-in),0 3px 0 rgba(90,58,46,.22);transition:transform .18s var(--ease),box-shadow .18s var(--ease),background .2s}
.pill:hover{transform:translateY(-2px);box-shadow:var(--btn-in),0 6px 12px -2px rgba(90,58,46,.25)}
.pill:active{transform:translateY(2px);box-shadow:inset 0 3px 0 rgba(90,58,46,.12),0 0 0 rgba(90,58,46,0)}
.pill[aria-selected="true"]{background:var(--honey)}
.pill.primary{background:var(--sage);color:var(--cream)}
.pill.primary{box-shadow:inset 0 2px 0 rgba(255,255,255,.25),inset 0 -4px 0 rgba(0,0,0,.15),0 3px 0 rgba(90,58,46,.22)}
.pill.big{min-width:min(280px,80vw);min-height:56px;font-size:1.3rem;border-width:2.5px;border-radius:22px}
.pill small{font:700 .8rem var(--body);color:var(--cocoa-soft)}
.linkbtn{background:none;border:none;color:#1E5449;text-decoration:underline;text-underline-offset:3px;font-weight:800;padding:0 6px}

main{flex:1;padding:22px 0 calc(var(--bar-h) + 32px)}
main.nobar{padding-bottom:32px}

/* paper cards */
.card{background:rgba(255,250,243,.94);border:var(--line);border-radius:var(--r-l);padding:clamp(16px,3vw,28px);margin-bottom:22px;box-shadow:var(--shadow);position:relative}
.kicker{font:500 .82rem/1.2 var(--display);text-transform:uppercase;letter-spacing:.1em;color:var(--cocoa-soft);margin-bottom:6px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.tape{position:absolute;top:-12px;left:50%;width:92px;height:24px;transform:translateX(-50%) rotate(-2deg);background:rgba(242,184,176,.75);border-left:2px dashed rgba(255,255,255,.6);border-right:2px dashed rgba(255,255,255,.6)}

/* preposition marks and coloured words */
.pm{display:inline-block;vertical-align:-.18em;flex:none}
.m-at{color:var(--at-ink)} .m-on{color:var(--on-ink)} .m-in{color:var(--in-ink)} .m-none{color:var(--none-ink)} .m-ok{color:var(--good-ink)}
.pw{font-weight:800;border-radius:6px;padding:0 .1em;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.pw.p-at{color:var(--at-ink);background:var(--at-tint)} .pw.p-on{color:var(--on-ink);background:var(--on-tint)} .pw.p-in{color:var(--in-ink);background:var(--in-tint)}
.pw.p-x{color:var(--cocoa);padding:0}
.prompt .pw{font-weight:600}


/* ================= start screen ================= */
.start-wrap{min-height:calc(100vh - 60px);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:max(16px,3vh);gap:12px;text-align:center}
.sign{position:relative;padding-top:58px;margin-bottom:6px}
.sign .ropes{position:absolute;top:0;left:50%;transform:translateX(-50%);width:100%;height:62px}
.sign .plank{position:relative;background:linear-gradient(#D7A579,#C08655);border:2.5px solid var(--cocoa);border-radius:20px;padding:10px 34px 12px;
  box-shadow:inset 0 3px 0 rgba(255,255,255,.35),inset 0 -5px 0 rgba(90,58,46,.18),0 10px 22px -8px rgba(90,58,46,.45);transform-origin:50% -60px;animation:signsway 6s ease-in-out infinite alternate}
@keyframes signsway{from{transform:rotate(-1.4deg)}to{transform:rotate(1.4deg)}}
.sign h1{margin:0;font:600 clamp(2.1rem,1.6rem + 3vw,3.4rem)/1 var(--display);color:var(--cream);letter-spacing:.02em;text-shadow:0 2px 0 rgba(90,58,46,.55)}
.sign h1 .dot{color:var(--honey)}
.sign small{display:block;font:700 .86rem/1.3 var(--body);color:#FFF3DF;margin-top:6px}
.menu{display:grid;gap:12px;justify-items:center;margin-top:4px}
.menu .pill .count{font:700 .82rem var(--body);background:var(--blush);border:1.5px solid var(--cocoa);border-radius:var(--r-pill);padding:0 8px}
.erase{max-width:480px;margin:10px auto 0;text-align:left;background:var(--cream);border:var(--line);border-radius:18px;padding:14px 16px;box-shadow:var(--shadow)}
.erase h3{margin:0 0 .3em}.erase p{margin:0 0 .8em;font-size:.98rem}
.pill.danger{background:var(--bad-ink);color:#fff}
.toast{display:inline-block;background:var(--good-tint);border:1.5px solid var(--good-ink);color:var(--good-ink);border-radius:var(--r-pill);padding:4px 14px;font:500 .95rem var(--display)}
.erase-link{font-size:.92rem;background:rgba(255,248,238,.85);border-radius:var(--r-pill);padding:2px 12px}
.stats{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;font:500 .92rem var(--display)}
.stats span{background:rgba(255,248,238,.9);border:1.5px solid rgba(90,58,46,.5);border-radius:var(--r-pill);padding:2px 12px}
.start-foot{margin-top:auto}

/* ================= contents (learn home) ================= */
.hero{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
@media (max-width:560px){.hero{grid-template-columns:1fr}}
.hero .cup{width:72px;height:72px}
.meter{height:12px;border-radius:10px;background:var(--paper);border:1.5px solid var(--cocoa);overflow:hidden;margin:10px 0 4px}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--at),var(--honey) 50%,var(--on));transition:width .6s var(--ease)}
.meter-label{font:500 .9rem var(--display);color:var(--cocoa-soft)}
.diagrams{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:22px}
.tri{display:grid;gap:8px;justify-items:center}
.tri .band{display:flex;align-items:center;gap:12px;border:var(--line);border-radius:16px;padding:6px 14px;color:#fff;min-height:56px;box-shadow:inset 0 2px 0 rgba(255,255,255,.25)}
.tri .band b{font:600 1.6rem/1 var(--display);min-width:1.4em}
.tri .band span{font-weight:800;font-size:.92rem;line-height:1.25}
.tri .b-in{width:100%;background:var(--in-ink)} .tri .b-on{width:82%;background:var(--on-ink)} .tri .b-at{width:64%;background:var(--at-ink)}
.tri-note{font:500 .9rem var(--display);color:var(--cocoa-soft);text-align:center;margin:8px 0 0}
.shapes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.shape{border:var(--line);border-radius:18px;padding:10px 6px;text-align:center;display:grid;justify-items:center;gap:4px}
.shape b{font:600 1.45rem/1 var(--display)}
.shape span{font-size:.85rem;font-weight:800;line-height:1.25}
.shape em{font-style:normal;font-size:.85rem}
.s-at{background:var(--at-tint)} .s-at b{color:var(--at-ink)} .s-on{background:var(--on-tint)} .s-on b{color:var(--on-ink)} .s-in{background:var(--in-tint)} .s-in b{color:var(--in-ink)}
.toc{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:22px}
.toc ol{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.topic{width:100%;display:flex;align-items:center;gap:12px;text-align:left;background:var(--cream);border:var(--line);border-radius:var(--r-m);padding:7px 12px;
  box-shadow:var(--btn-in);transition:transform .18s var(--ease),background .2s}
.topic:hover{transform:translateX(4px);background:#FFF2DF}
.topic .n{display:grid;place-items:center;flex:none;width:34px;height:34px;border-radius:50%;border:var(--line);font:600 1rem var(--display)}
.n.c-at{background:var(--at-tint);color:var(--at-ink)} .n.c-on{background:var(--on-tint);color:var(--on-ink)} .n.c-in{background:var(--in-tint);color:var(--in-ink)} .n.c-none{background:var(--none-tint);color:var(--none-ink)}
.topic .t{flex:1;font-weight:700;line-height:1.3}
.topic .done{font:500 .8rem var(--display);color:var(--good-ink);background:var(--good-tint);border-radius:var(--r-pill);padding:1px 8px;white-space:nowrap}

/* ================= learn screen ================= */
.lesson{padding:0;overflow:hidden}
.art{display:block;border-bottom:var(--line)}
.art svg{display:block;width:100%;height:auto;max-height:270px}
.art.c-at{background:var(--at-tint)} .art.c-on{background:var(--on-tint)} .art.c-in{background:var(--in-tint)} .art.c-none{background:var(--none-tint)}
.lesson .inner{padding:clamp(16px,3vw,28px)}
.rules{margin:0 0 1.1em;padding:0;list-style:none;display:grid;gap:10px}
.rules li{position:relative;padding-left:28px}
.rules li::before{content:"";position:absolute;left:3px;top:.5em;width:12px;height:12px;border-radius:50%;background:var(--honey);border:2px solid var(--cocoa)}
.examples{list-style:none;margin:0 0 1.1em;padding:0;display:grid;gap:0;border-top:2px dashed rgba(90,58,46,.25)}
.examples li{padding:8px 4px;display:flex;flex-wrap:wrap;align-items:center;gap:4px;border-bottom:2px dashed rgba(90,58,46,.25)}
.gapbtn{display:inline-flex;align-items:center;gap:6px;min-width:70px;min-height:44px;justify-content:center;border:2px dashed var(--cocoa-soft);background:var(--cream);
  border-radius:var(--r-pill);font:500 1.05rem var(--display);padding:0 12px;margin:0 3px;transition:transform .2s var(--soft)}
.gapbtn:hover{transform:scale(1.05)}
.gapbtn.shown{border-style:solid;border-color:var(--cocoa)}
.gapbtn.shown.c-at{background:var(--at-tint);color:var(--at-ink)} .gapbtn.shown.c-on{background:var(--on-tint);color:var(--on-ink)}
.gapbtn.shown.c-in{background:var(--in-tint);color:var(--in-ink)} .gapbtn.shown.c-none{background:var(--none-tint);color:var(--none-ink)}
.gapbtn.pop{animation:pop .45s var(--soft)}
@keyframes pop{0%{transform:scale(.7);opacity:.4}100%{transform:scale(1);opacity:1}}
.hint{font-size:.92rem;color:var(--cocoa-soft)}
.careful{position:relative;display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;background:#FFF4D8;border:var(--line);border-radius:14px;padding:16px 14px 12px;margin-top:18px}
.careful h3{margin:0 0 .25em;font-size:1.05rem}
.careful p{margin:0 0 .4em} .careful p:last-child{margin:0}
.careful .sign-i{width:38px;height:38px}

/* ================= practise ================= */
.levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px;margin-bottom:22px}
.level{position:relative;display:flex;flex-direction:column;gap:8px;text-align:left;background:rgba(255,250,243,.95);border:var(--line);border-radius:var(--r-l);padding:18px;
  box-shadow:var(--shadow);transition:transform .2s var(--ease),box-shadow .2s var(--ease)}
.level:hover{transform:translateY(-4px);box-shadow:0 18px 30px -12px rgba(90,58,46,.4)}
.level:active{transform:translateY(1px)}
.level .num{display:grid;place-items:center;width:48px;height:48px;border-radius:50%;border:var(--line);font:600 1.45rem var(--display)}
.level:nth-child(1) .num{background:var(--at-tint);color:var(--at-ink)} .level:nth-child(2) .num{background:var(--on-tint);color:var(--on-ink)} .level:nth-child(3) .num{background:var(--in-tint);color:var(--in-ink)}
.level .rt{font:500 1.2rem/1.2 var(--display)}
.level .rd{font-size:.95rem}
.level .rp{font-size:.88rem;font-weight:800;color:var(--cocoa-soft)}
.level .stars{position:absolute;top:16px;right:16px;display:flex;gap:2px}
.star{width:24px;height:24px}
.mistcard{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.mistcard .rt{font:500 1.2rem var(--display)}

.hud{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-bottom:12px}
.hud .title{font:500 1.05rem var(--display);margin-right:auto}
.chip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--cocoa);border-radius:var(--r-pill);padding:1px 12px;font:500 .95rem var(--display);background:var(--cream)}
.chip.streak{background:#FFE9C7}
.chip.streak.bump{animation:bump .6s var(--soft)}
@keyframes bump{40%{transform:scale(1.18)}}
.segs{display:flex;gap:4px;margin-bottom:16px}
.segs i{flex:1;height:8px;border-radius:6px;background:rgba(90,58,46,.14)}
.segs i.ok{background:var(--good)} .segs i.no{background:var(--bad)} .segs i.cur{background:var(--honey);box-shadow:0 0 0 2px rgba(90,58,46,.35)}
.task{font-size:.95rem;color:var(--cocoa-soft);margin-bottom:8px}
.prompt{font:500 clamp(1.35rem,1.1rem + 1.3vw,1.95rem)/1.45 var(--display);margin:6px 0 20px}
.slot{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:3.2em;min-height:1.45em;border:2px dashed var(--cocoa-soft);border-radius:var(--r-pill);padding:0 12px;background:var(--cream);line-height:1.3}
.slot.mark{border:2px solid var(--cocoa);background:var(--honey)}
.slot.fill{border-style:solid;border-color:var(--cocoa);animation:pop .45s var(--soft)}
.slot.fill.c-at{background:var(--at-tint);color:var(--at-ink)} .slot.fill.c-on{background:var(--on-tint);color:var(--on-ink)}
.slot.fill.c-in{background:var(--in-tint);color:var(--in-ink)} .slot.fill.c-none{background:var(--none-tint);color:var(--none-ink)} .slot.fill.c-ok{background:var(--good-tint);color:var(--good-ink)}
.slot.strike{text-decoration:line-through;text-decoration-thickness:2.5px;color:var(--bad-ink);background:var(--bad-tint);border:2px solid var(--bad)}
.opts{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.opts.five{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
@media (max-width:640px){.opts,.opts.five{grid-template-columns:1fr 1fr}}
.opt{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:78px;border:var(--line);border-radius:22px;
  background:var(--cream);font:500 1.3rem/1.15 var(--display);padding:8px;box-shadow:var(--btn-in),0 3px 0 rgba(90,58,46,.2);transition:transform .18s var(--ease),box-shadow .18s var(--ease),background .25s,opacity .25s}
.opt small{font:700 .78rem/1.2 var(--body);color:var(--cocoa-soft)}
.opt.c-at{color:var(--at-ink)} .opt.c-on{color:var(--on-ink)} .opt.c-in{color:var(--in-ink)} .opt.c-none{color:var(--none-ink)} .opt.c-ok{color:var(--good-ink)}
.opt:not(:disabled):hover{transform:translateY(-3px);box-shadow:var(--btn-in),0 10px 16px -6px rgba(90,58,46,.3)}
.opt.c-at:not(:disabled):hover{background:var(--at-tint)} .opt.c-on:not(:disabled):hover{background:var(--on-tint)} .opt.c-in:not(:disabled):hover{background:var(--in-tint)}
.opt.c-none:not(:disabled):hover{background:var(--none-tint)} .opt.c-ok:not(:disabled):hover{background:var(--good-tint)}
.opt:not(:disabled):active{transform:translateY(2px);box-shadow:inset 0 3px 0 rgba(90,58,46,.12)}
.opt .key{position:absolute;top:6px;left:10px;font:500 .75rem var(--display);color:var(--cocoa-soft)}
.opt:disabled{cursor:default}
.opt.right{background:var(--good-tint);color:var(--good-ink);border-color:var(--good-ink);animation:pop .45s var(--soft)}
.opt.wrong{background:var(--bad-tint);color:var(--bad-ink);border-color:var(--bad-ink)}
.opt.dim{opacity:.5;box-shadow:none}
.opt .tick{position:absolute;top:-11px;right:-8px;width:28px;height:28px;border-radius:50%;border:var(--line);background:var(--cream);font:600 .95rem/24px var(--display);text-align:center}
.opt.right .tick{background:var(--good);color:#fff} .opt.wrong .tick{background:var(--bad);color:#fff}

<script>
/* =====================================================================
   ================= CONTENT (edit here) =================
   Mini-formats used in the text below:
   - *word*      shows the word in bold. If it starts with at, on or in,
                 it is coloured with that preposition's colour.
   - {at}        in an example: a gap the student taps to reveal the answer.
                 Use {–} for "no preposition".
   - ___         in a Round 1 or Round 2 prompt: the gap.
   - [word]      in a Round 3 sentence: the highlighted word to check.
   - a:          the right answer: "at", "on", "in" or "–" (no preposition).
                 In Round 3, "ok" means the sentence is already correct.
   - alt:        (optional) another answer that is also accepted.
   - why:        the explanation shown after answering.
   - rule:       the id of the Learn screen that explains the point.
   - prep:       (Learn screens) the colour of the screen: at, on, in or none.
   - art:        (Learn screens) the name of the drawing in the ART section.
   ===================================================================== */
const CONTENT = {
  title: "at · on · in",
  subtitle: "Prepositions of time and place · B2",
  none: "–",                 // the symbol for "no preposition"
  noneLabel: "no preposition",

  intro: {
    heading: "At, on and in: time and place",
    text: "These three prepositions are short, but they cause a lot of mistakes, because Catalan and Spanish often use one word (*a* or *en*) where English uses three. Read the rules, tap the gaps in the examples to check yourself, and then try the three practice rounds. Your progress is saved on this device.",
    start: "Start with the first rule",
    practise: "Go to Practise"
  },

  // Learn screens. Each one has: id, part ("Time" or "Place"), title, rules,
  // examples (with one {gap} each) and an optional "careful" note.
  learn: [
    { id:"t-at", prep:"at", art:"clock", part:"Time", title:"at + exact times",
      rules:[
        "Use *at* for a precise moment: clock times and specific times of the day.",
        "Also: *at noon*, *at midnight*, *at night*, *at lunchtime*, *at dinner time*, *at sunrise*, *at sunset*."
      ],
      examples:[
        "The film starts {at} 9.30.",
        "We usually have a break {at} lunchtime.",
        "I find it hard to sleep {at} night when it's hot."
      ],
      careful:[
        "We say *at night* (in general), but *in the morning*, *in the afternoon* and *in the evening*.",
        "*In the night* is possible, but it means during one particular night: \"The baby woke up three times in the night.\"",
        "Spanish *por la noche* and Catalan *a la nit* become *at night*, not \"in the night\" or \"on the night\"."
      ] },

    { id:"t-at2", prep:"at", art:"weekend", part:"Time", title:"at + holidays, the weekend and fixed expressions",
      rules:[
        "Use *at* for holiday periods: *at Christmas*, *at Easter*, *at New Year*.",
        "In British English we say *at the weekend*. American English says *on the weekend*.",
        "Fixed expressions: *at the moment*, *at present*, *at the same time*, *at the beginning (of)*, *at the end (of)*, *at the age of 18*."
      ],
      examples:[
        "We always visit my grandparents {at} Christmas.",
        "What are you doing {at} the weekend?",
        "I'm afraid she's busy {at} the moment.",
        "He started working {at} the age of sixteen."
      ],
      careful:[
        "*At Christmas* is the holiday period. For the day itself, use *on*: *on Christmas Day*, *on Christmas Eve*."
      ] },

    { id:"t-on", prep:"on", art:"calendar", part:"Time", title:"on + days and dates",
      rules:[
        "Use *on* for days and dates: *on Monday*, *on 12th June*, *on my birthday*, *on Christmas Day*, *on New Year's Eve*.",
        "Use *on* when a day is combined with a part of the day: *on Sunday morning*, *on Friday night*.",
        "Use *on* for a particular day or occasion: *on a cold winter evening*, *on the first day of the course*, *on my wedding day*.",
        "For a habit, add *-s*: *on Mondays* = every Monday."
      ],
      examples:[
        "The exam is {on} 3rd June.",
        "Let's meet {on} Saturday afternoon.",
        "The museum is closed {on} Mondays."
      ],
      careful:[
        "*In the morning*, but *on Monday morning*. When the day is mentioned, the day decides the preposition.",
        "Spanish *el lunes* and Catalan *dilluns* become *on Monday*, not \"the Monday\" or \"in Monday\"."
      ] },

    { id:"t-in", prep:"in", art:"year", part:"Time", title:"in + longer periods (and the future)",
      rules:[
        "Use *in* for months, seasons, years, decades and centuries: *in September*, *in spring*, *in 2018*, *in the 1990s*, *in the 21st century*.",
        "Also for parts of the day and longer periods: *in the morning*, *in the evening*, *in the holidays*, *in the past*, *in the future*.",
        "*in* + a period of time can mean \"after that time from now\": *in ten minutes*, *in two weeks*."
      ],
      examples:[
        "My parents met {in} 1987.",
        "The streets are very quiet {in} August.",
        "Don't worry, I'll be ready {in} five minutes."
      ],
      careful:[
        "*I'll finish it in two weeks* means two weeks from now. To say \"before the end of\" a period, use *within*: *within two weeks*.",
        "For a length of time, use *for*, not *in*: *I've lived here for three years* (not \"in three years\")."
      ] },

    { id:"t-none", prep:"none", art:"nochips", part:"Time", title:"No preposition",
      rules:[
        "Do not use *at*, *on* or *in* before *this*, *next*, *last* and *every*: *this morning*, *next Friday*, *last summer*, *every week*.",
        "No preposition before *today*, *tonight*, *tomorrow* and *yesterday*: *tomorrow afternoon*, *yesterday evening*.",
        "Also: *the day after tomorrow*, *the week before last*, *this time next year*."
      ],
      examples:[
        "I'll see you {–} next Friday.",
        "We went to Menorca {–} last summer.",
        "She calls her mother {–} every Sunday.",
        "Are you doing anything {–} tomorrow evening?"

  if (kindOf(round, item) !== "fix") return CONTENT.labels.opts.slice();
  const cur = (item.p.match(/\[(.*?)\]/) || [,""])[1];
  return ["ok", ...CONTENT.labels.opts.filter(o => o !== cur)];
}
function roundScore(rid){
  const r = ROUND[rid]; let s = 0, done = 0;
  r.items.forEach((it, i) => { const c = S.answers[rid][`${rid}-${i}`]; if (c !== undefined){ done++; if (isRight(it, c)) s++; } });
  return { s, done, n:r.items.length };
}
function starsFor(s, n){ const f = s / n; return f === 1 ? 3 : f >= .8 ? 2 : f >= .5 ? 1 : 0; }
function totalStars(){ return CONTENT.rounds.reduce((t, r) => { const { s, done, n } = roundScore(r.id); return t + (done === n ? starsFor(s, n) : 0); }, 0); }
function streakAt(rid, upto){
  let k = 0;
  for (let i = upto; i >= 0; i--){ const c = S.answers[rid][`${rid}-${i}`]; if (c !== undefined && isRight(ROUND[rid].items[i], c)) k++; else break; }
  return k;
}
function bestStreak(rid){
  let best = 0, k = 0;
  ROUND[rid].items.forEach((it, i) => { const c = S.answers[rid][`${rid}-${i}`]; if (c !== undefined && isRight(it, c)){ k++; best = Math.max(best, k); } else k = 0; });
  return best;
}
function answer(choice){
  let item, key;
  if (S.view === "mist"){
    const mq = S.mq; key = mq.list[mq.idx];
    if (mq.answers[key] !== undefined) return;
    mq.answers[key] = choice; item = ITEM[key].item;
    if (isRight(item, choice)) S.mistakes = S.mistakes.filter(k => k !== key);
  } else {
    key = `${S.round}-${S.idx}`;
    if (S.answers[S.round][key] !== undefined) return;
    S.answers[S.round][key] = choice; item = ITEM[key].item;
    if (!isRight(item, choice) && !S.mistakes.includes(key)) S.mistakes.push(key);
  }
  fxQueue = { kind: isRight(item, choice) ? "right" : "wrong" };
  save();
}
function openRound(rid){
  if (REV && rid === REV.id){ S.tab = "practise"; S.round = rid; S.view = "mode"; save(); return; }
  openSolo(rid);
}
function openSolo(rid){
  S.tab = "practise"; S.round = rid; S.view = "q";
  const r = ROUND[rid];
  const firstOpen = r.items.findIndex((_, i) => S.answers[rid][`${rid}-${i}`] === undefined);
  if (firstOpen === -1) S.view = "end"; else S.idx = firstOpen;
  save();
}
function restartRound(rid){ S.answers[rid] = {}; S.round = rid; S.idx = 0; S.view = "q"; save(); }
function reviewRound(rid){ S.round = rid; S.idx = 0; S.view = "q"; save(); }
function startMistakes(){
  if (!S.mistakes.length) return;
  S.tab = "practise"; S.mq = { list:S.mistakes.slice(), idx:0, answers:{} }; S.view = "mist"; save();
}
function step(d){
  if (S.view === "team" && S.tab === "practise"){ teamStep(d); return; }
  if (S.tab === "learn"){
    S.learn = Math.max(0, Math.min(CONTENT.learn.length, S.learn + d));
  } else if (S.view === "q"){
    const n = ROUND[S.round].items.length;
    if (d > 0 && S.idx === n - 1){ S.view = "end"; fxQueue = { kind:"end" }; }
    else S.idx = Math.max(0, Math.min(n - 1, S.idx + d));
  } else if (S.view === "mist"){
    const n = S.mq.list.length;
    if (d > 0 && S.mq.idx === n - 1) S.view = "mistend";
    else S.mq.idx = Math.max(0, Math.min(n - 1, S.mq.idx + d));
  }
  save();
}
function rememberPlace(){
  if (S.tab === "learn" && S.learn > 0) S.last = { tab:"learn", learn:S.learn };
  else if (S.tab === "practise" && S.view === "q") S.last = { tab:"practise", round:S.round };
}
function continueLast(){
  const l = S.last;
  if (l && l.tab === "learn"){ S.tab = "learn"; S.learn = l.learn; }
  else if (l && l.tab === "practise" && ROUND[l.round]) openSolo(l.round);
  else { S.tab = "learn"; S.learn = 0; }
  save();
}

/* ================= team game (revision round) =================
   Saved separately from personal progress, so a class game never changes
   anyone's answers, stars or mistakes. Rules follow the html-tools skill:
   2 points first try, 1 point second try, 0 after time's up; full rounds only. */
const TEAM = [{ sym:"◆" }, { sym:"●" }, { sym:"▲" }, { sym:"■" }];
let TG = null;                 // the team game
let setupNames = ["Team A", "Team B", "Team C", "Team D"], setupN = 2;
function teamOrder(n){
  const main = REV.items.map((_, i) => `${REV.id}-${i}`), res = (REV.reserves || []).map((_, i) => `${REV.id}-R${i}`);
  let per = Math.ceil(main.length / n);
  if (per * n - main.length > res.length) per = Math.floor(main.length / n);   // not enough reserves: drop the incomplete round
  return [...main, ...res].slice(0, per * n);
}
function newTeamGame(n, names){
  TG = { v:1, n, names:names.slice(0, n), order:teamOrder(n), idx:0, rec:{}, pts:Array(n).fill(0), ended:false };
  saveTG();
}
const teamOf = i => i % TG.n;
const roundOf = i => Math.floor(i / TG.n) + 1;
const roundsTotal = () => TG.order.length / TG.n;
function teamAnswer(o){
  const key = TG.order[TG.idx], item = ITEM[key].item, round = ITEM[key].round;
  const rec = TG.rec[key] || (TG.rec[key] = { tries:[], done:false, pts:0, late:false });
  if (rec.done || rec.tries.includes(o)) return;
  rec.tries.push(o);
  const right = isRight(item, o), many = optionsFor(round, item).length >= 3;
  if (right || rec.tries.length === 2 || !many){
    rec.done = true; qtStop(); rec.late = qt.timeUp;
    rec.pts = rec.late ? 0 : right ? (rec.tries.length === 1 ? 2 : 1) : 0;
    TG.pts[teamOf(TG.idx)] += rec.pts;
    fxQueue = { kind: right ? "right" : "wrong" };
  } else fxQueue = { kind:"wrong" };
  saveTG();
}
function teamStep(d){
  if (d > 0 && TG.idx === TG.order.length - 1){ TG.ended = true; S.view = "tend"; fxQueue = { kind:"tend" }; }
  else TG.idx = Math.max(0, Math.min(TG.order.length - 1, TG.idx + d));
  saveTG();
}

/* ---- thinking time: a free stopwatch, plus a countdown only when the teacher presses Hurry up ---- */
let qt = { key:null, t0:0, paused:false, pauseAt:0, pausedMs:0, stopAt:null, hurryEnd:null, timeUp:false, lastTick:null };
const qtNow = () => qt.paused ? qt.pauseAt : Date.now();
function qtStart(key){ qt = { key, t0:Date.now(), paused:false, pauseAt:0, pausedMs:0, stopAt:null, hurryEnd:null, timeUp:false, lastTick:null }; }
function qtStop(){ if (qt.stopAt === null) qt.stopAt = qtNow(); }
function qtPause(){
  if (qt.stopAt !== null) return;
  if (qt.paused){ const gap = Date.now() - qt.pauseAt; qt.pausedMs += gap; if (qt.hurryEnd) qt.hurryEnd += gap; qt.paused = false; }
  else { qt.paused = true; qt.pauseAt = Date.now(); }
}
function qtHurry(){ if (qt.stopAt !== null) return; if (qt.paused) qtPause(); qt.hurryEnd = Date.now() + PREFS.hurry * 1000; qt.timeUp = false; qt.lastTick = null; }
function qtTimeUp(){ qt.timeUp = true; sound("up"); }
const fmtTime = ms => { const t = Math.max(0, Math.floor(ms / 1000)); return `${Math.floor(t / 60)}:${String(t % 60).padStart(2, "0")}`; };
function updateTimer(){
  const box = $("qt"); if (!box) return;
  const T2 = CONTENT.labels.teams, end = qt.stopAt !== null ? qt.stopAt : qtNow(), think = end - qt.t0 - qt.pausedMs;
  let label = T2.thinking, main = fmtTime(think), sub = "", cls = "";
  if (qt.hurryEnd){
    const left = qt.hurryEnd - end;
    if (left <= 0 && !qt.timeUp && qt.stopAt === null) qtTimeUp();
    if (qt.timeUp){ label = T2.timeUp; main = "0"; cls = "up"; }
    else { label = T2.hurryLeft; main = String(Math.ceil(left / 1000)); cls = "hurry";
      const sec = Math.ceil(left / 1000); if (sec <= 5 && sec !== qt.lastTick && !qt.paused && qt.stopAt === null){ qt.lastTick = sec; sound("tick"); } }
    sub = `${T2.thinking} ${fmtTime(think)}`;
  }
  if (qt.paused){ label = T2.paused; cls += " paused"; }
  box.className = "qt " + cls;
  $("qtLabel").textContent = label; $("qtTime").textContent = main; $("qtSub").textContent = sub;
  const pb = $("qtPause"); if (pb){ pb.textContent = qt.paused ? T2.resume2 : T2.pause; pb.disabled = qt.stopAt !== null; }
  const hb = $("qtHurry"); if (hb) hb.disabled = qt.stopAt !== null;
}
setInterval(() => { if (S.view === "team") updateTimer(); }, 200);

/* ---- soft sounds (Web Audio; nothing is downloaded) ---- */
let actx = null;
function sound(kind){
  if (!PREFS.sound) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const notes = kind === "tick" ? [[880, 0, .05]] : [[660, 0, .22], [440, .24, .35]];
    notes.forEach(([f, at, dur]) => { const o = actx.createOscillator(), g = actx.createGain(); o.frequency.value = f; o.type = "sine";
      g.gain.setValueAtTime(.0001, actx.currentTime + at); g.gain.exponentialRampToValueAtTime(kind === "tick" ? .05 : .12, actx.currentTime + at + .02);
      g.gain.exponentialRampToValueAtTime(.0001, actx.currentTime + at + dur); o.connect(g).connect(actx.destination); o.start(actx.currentTime + at); o.stop(actx.currentTime + at + dur + .05); });
  } catch(e){}
}
/* ---- keep the screen awake during a team game ---- */
let wake = null;
async function keepAwake(on){
  try { if (on && !wake && navigator.wakeLock){ wake = await navigator.wakeLock.request("screen"); wake.addEventListener("release", () => { wake = null; }); }
        else if (!on && wake){ await wake.release(); wake = null; } } catch(e){}
}

/* ================= display: ART (one drawing per Learn screen) ================= */
/* Each drawing is an SVG 320 × 150. Animation classes are in the style block.
   Text in the drawings repeats the rule, so the drawings are decorative.     */
const K = "#5A3A2E";
const COL = { coral:"#E8896F", sage:"#6CB8A6", lav:"#A493DD", honey:"#F5C46B", cream:"#FFF8EE", wood:"#C99268", woodD:"#9C6646",
  leaf:"#3E9C7E", leafL:"#7CC4A1", sky:"#CFE9F4", stone:"#E4D9CC", road:"#B9AEA3", kraft:"#D9A86C", kraftD:"#B98348", chalk:"#3F4F4A" };
const INK = { at:"#A3452F", on:"#24695C", in:"#5C4A9E", none:"#6B5E57" };
const T = (x, y, txt, o = {}) =>
  `<text${o.cls ? ` class="${o.cls}"` : ""} x="${x}" y="${y}" text-anchor="${o.anchor || "middle"}" font-family="Fredoka, sans-serif" font-weight="${o.w || 600}" font-size="${o.size || 16}" fill="${o.col || K}"${o.extra || ""}>${txt}</text>`;
const LBL = (x, y, txt, fill, cls = "a-pop d5") => {
  const w = txt.length * 9.2 + 24;
  x = Math.max(w / 2 + 6, Math.min(320 - w / 2 - 6, x));   // keep the label inside the drawing
  return `<g class="${cls}"><rect x="${x - w / 2}" y="${y - 19}" width="${w}" height="28" rx="14" fill="${fill}" stroke="${K}" stroke-width="2.5"/>${T(x, y, txt, { col:"#FFF8EE", size:15.5, w:500 })}</g>`;
};
const SH = (cx, cy, rx) => `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${(rx * .16).toFixed(1)}" fill="rgba(90,58,46,.16)"/>`;
const stripes = (op = .35) => Array.from({ length:12 }, (_, i) => `<rect x="${i * 28}" y="0" width="14" height="150" fill="#fff" opacity="${op}"/>`).join("");
const floor = (y, fill = "#E9D6BB") => `<rect x="0" y="${y}" width="320" height="${150 - y}" fill="${fill}"/><line x1="0" y1="${y}" x2="320" y2="${y}" stroke="${K}" stroke-width="2.5"/>`;

const ART = {
  /* 1 · a café wall clock at half past nine, and a night window */
  clock: () => {
    const ticks = Array.from({ length:60 }, (_, i) => { const a = i * Math.PI / 30, r1 = i % 5 ? 41 : 38;
      return `<line x1="${(96 + r1 * Math.sin(a)).toFixed(1)}" y1="${(75 - r1 * Math.cos(a)).toFixed(1)}" x2="${(96 + 44 * Math.sin(a)).toFixed(1)}" y2="${(75 - 44 * Math.cos(a)).toFixed(1)}" stroke="${K}" stroke-width="${i % 5 ? 1 : 2.5}" stroke-linecap="round"/>`; }).join("");

    return `${stripes()}
      <line x1="96" y1="0" x2="96" y2="14" stroke="${K}" stroke-width="2"/>

      <g transform="rotate(180 96 75)"><rect class="a-spin" x="94" y="36" width="4" height="39" rx="2" fill="${INK.at}"/></g>
      <circle class="a-pop d6" cx="96" cy="75" r="5" fill="${COL.coral}" stroke="${K}" stroke-width="2"/>
      <path d="M58 25 a48 48 0 0 1 30 -16" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".7"/>
      <g class="a-rise d3"><rect x="196" y="14" width="108" height="64" rx="8" fill="#2E3A5C" stroke="${K}" stroke-width="3"/>

        <line x1="250" y1="14" x2="250" y2="78" stroke="${COL.wood}" stroke-width="4"/></g>
      ${LBL(250, 106, "at 9.30", INK.at, "a-pop d6")}${LBL(250, 138, "at night", INK.at, "a-pop d7")}`; },

function render(){

  $("classbtn").setAttribute("aria-pressed", PREFS.classview ? "true" : "false");
  let html = "", bar = null, footer = false;

  if (S.tab === "start"){ html = renderStart(); footer = true; }
  else if (S.tab === "learn"){
    if (S.learn === 0){ html = renderContents(); footer = true; }
    else { const s = CONTENT.learn[S.learn - 1];
      if (!S.visited.includes(s.id)){ S.visited.push(s.id); save(); }
      html = renderLearn(S.learn - 1);
      bar = { info:`${s.part} · ${L.learnOf(S.learn, CONTENT.learn.length)}`, prev:true, next:S.learn < CONTENT.learn.length, nextLabel:"next →" }; }
  } else {
    if (S.view === "home"){ html = renderPractiseHome(); footer = true; }
    else if (S.view === "q"){ const r = ROUND[S.round], key = `${S.round}-${S.idx}`, chosen = S.answers[S.round][key];
      html = renderQuestion(r, r.items[S.idx], chosen, S.idx, false);
      bar = { info:L.questionOf(S.idx + 1, r.items.length), prev:S.idx > 0, next:chosen !== undefined, nextLabel: S.idx === r.items.length - 1 ? "finish →" : "next →" }; }
    else if (S.view === "end"){ html = renderEnd(); footer = true; }
    else if (S.view === "mist"){ const mq = S.mq, key = mq.list[mq.idx], { round, item, i } = ITEM[key];
      html = renderQuestion(round, item, mq.answers[key], i, true);
      bar = { info:L.questionOf(mq.idx + 1, mq.list.length), prev:mq.idx > 0, next:mq.answers[key] !== undefined, nextLabel: mq.idx === mq.list.length - 1 ? "finish →" : "next →" }; }

    else if (S.view === "mode"){ html = renderMode(); footer = true; }
    else if (S.view === "tsetup"){ html = renderSetup(); footer = true; }
    else if (S.view === "team" && TG){ const key = TG.order[TG.idx], rec = TG.rec[key];
      if (!(rec && rec.done) && qt.key !== key) qtStart(key);
      html = renderTeamQuestion();

      bar = { info:T2.turn(roundOf(TG.idx), roundsTotal(), TG.names[teamOf(TG.idx)]), prev:TG.idx > 0, next:!!(rec && rec.done), nextLabel: last ? T2.finish : T2.next }; }
    else if (S.view === "tend" && TG){ html = renderTeamEnd(); footer = true; }
    else { S.view = "home"; html = renderPractiseHome(); footer = true; }
  }
  keepAwake(S.view === "team");

  const screenKey = `${S.tab}|${S.learn}|${S.view}|${S.round}|${S.idx}|${S.mq ? S.mq.idx : ""}|${TG ? TG.idx : ""}`;
  const view = $("view"), isNew = screenKey !== lastScreen;
  view.classList.remove("enter");
  view.innerHTML = (S.tab === "start" ? "" : `<h1 class="sr">${esc(CONTENT.labels.menuSub)}: at, on, in</h1>`) + html;
  if (isNew){ void view.offsetWidth; view.classList.add("enter"); window.scrollTo(0, 0); lastScreen = screenKey; }
  $("navbar").hidden = !bar;
  $("main").classList.toggle("nobar", !bar);
  if (bar){ $("navinfo").textContent = bar.info; $("btnPrev").disabled = !bar.prev; $("btnNext").disabled = !bar.next; $("btnNext").textContent = bar.nextLabel; }
  $("footer").classList.toggle("hidden", !footer);
  if (S.view === "team") updateTimer();
  playFx();
}

function renderQuestion(round, item, chosen, itemIdx, isMist){
  const L = CONTENT.labels, answered = chosen !== undefined, ok = answered && isRight(item, chosen);
  const shownAns = ok ? chosen : item.a;
  const kind = kindOf(round, item);
  let prompt = promptHTML(round, item, chosen);
  const opts = optionsFor(round, item).map((o, k) => {
    const c = cOf(o);
    let cls = `opt c-${c}`, tick = "";
    if (answered){
      if (isRight(item, o) && (o === item.a || o === chosen)){ cls += " right"; if (o === chosen) tick = `<span class="tick">✓</span>`; }
      else if (o === chosen){ cls += " wrong"; tick = `<span class="tick">✗</span>`; }
      else cls += " dim";
    }
    const main = o === "ok" ? "correct" : o === NONE ? "–" : esc(o);
    const sub = o === "ok" ? "no change" : o === NONE ? CONTENT.noneLabel : (kind === "fix" ? "change to" : "");
    return `<button class="${cls}" data-act="answer" data-o="${esc(o)}" data-k="${k + 1}" ${answered ? "disabled" : ""} aria-label="${esc(o === "ok" ? "Correct as it is" : (kind === "fix" ? "Change to " : "") + (o === NONE ? CONTENT.noneLabel : o))}">
      <span class="key" aria-hidden="true">${k + 1}</span>${mark(c, 28)}<span>${main}</span>${sub ? `<small>${esc(sub)}</small>` : ""}${tick}</button>`;
  }).join("");
  let hud = "", segs = "";
  if (!isMist){
    const n = round.items.length;
    segs = `<div class="segs" aria-hidden="true">${round.items.map((it, i) => { const c = S.answers[round.id][`${round.id}-${i}`];
      return `<i class="${c === undefined ? (i === itemIdx ? "cur" : "") : isRight(it, c) ? "ok" : "no"}"></i>`; }).join("")}</div>`;
    const st = answered ? streakAt(round.id, itemIdx) : streakAt(round.id, itemIdx - 1);
    hud = `<div class="hud"><span class="title">${esc(round.title)}</span>${st >= 2 ? `<span class="chip streak${answered && ok ? " bump" : ""}">☕ ${esc(L.streak(st))}</span>` : ""}<span class="chip">${esc(L.questionOf(itemIdx + 1, n))}</span></div>`;
  } else {
    const mq = S.mq;
    hud = `<div class="hud"><span class="title">${esc(L.mistakes)} · ${esc(round.title.split("·")[1].trim())}</span><span class="chip">${esc(L.questionOf(mq.idx + 1, mq.list.length))}</span></div>`;
  }
  let fb = "";
  if (answered){
    const list = ok ? L.verdictRight : L.verdictWrong, say = list[itemIdx % list.length];
    const ruleBtn = ruleToggle(item);
    const ansLine = ok ? "" : `<p>${L.answerIs}: <b>${answerText(round, item)}</b>.</p>`;
    const mistLine = isMist ? `<p><span class="badge">${ok ? esc(L.mistakesRemoved) : esc(L.mistakesStay)}</span></p>` : "";
    fb = `<div class="feedback ${ok ? "ok" : "no"}" role="status"><span class="fbicon" aria-hidden="true">${ok ? "✓" : "✗"}</span><div class="fbbox"><p class="verdict">${esc(say)}</p>${ansLine}<p>${fmt(item.why)}</p>${mistLine}<p>${ruleBtn}</p></div></div>`;
  }
  const modeLink = round.type === "mix" && !isMist ? ` <button class="linkbtn" data-act="mode">${esc(L.teams.changeMode)}</button>` : "";
  return `<p class="row" style="margin:0 0 12px"><button class="linkbtn" data-act="home">${L.back}</button>${modeLink}</p>
    <div class="card qcard" id="qcard" ${stg(0)}>${hud}${segs}
    ${round.type === "mix" ? `<span class="tag">${esc(L.kindName[kind])}</span>` : ""}
    <p class="task">${esc(L.tasks[kind])}</p>
    <p class="prompt">${prompt}</p>
    <div class="qbody"><div class="opts${kind === "fix" ? " five" : ""}" role="group" aria-label="Choices">${opts}</div>${fb}</div></div>`;
}

/* the sentence or phrase, with the gap or the highlighted word; "chosen" fills it after answering */
function promptHTML(round, item, chosen){
  const answered = chosen !== undefined, ok = answered && isRight(item, chosen), shownAns = ok ? chosen : item.a;
  if (kindOf(round, item) !== "fix"){
    const c = cOf(shownAns);
    const fill = answered ? `<span class="slot fill c-${c}">${mark(c, 22)}${shownAns === NONE ? "–" : esc(shownAns)}</span>` : `<span class="slot">?</span><span class="sr">gap</span>`;
    return hl(esc(item.p)).replace("___", fill);
  }
  return esc(item.p).split(/(\[.*?\])/).map(x => x.startsWith("[") ? x : hl(x)).join("").replace(/\[(.*?)\]/, (_, w) => {
    if (!answered) return `<span class="slot mark">${w}</span>`;
    if (item.a === "ok") return `<span class="slot fill c-ok">${mark("ok", 22)}${w}</span>`;
    return `<span class="slot strike">${w}</span> <span class="slot fill c-${cOf(item.a)}">${mark(cOf(item.a), 22)}${item.a === NONE ? "–" : esc(item.a)}</span>`;
  });
}
function answerText(round, item){
  return kindOf(round, item) === "fix" && item.a === "ok" ? "the sentence is correct" : esc(item.a === NONE ? "– (" + CONTENT.noneLabel + ")" : item.a);
}
/* the rule opens inside the feedback box, so learners keep their place */
let openRuleFor = null;
function ruleToggle(item){
  if (!item.rule) return "";
  const L = CONTENT.labels, open = openRuleFor === item.rule && LEARN_IDX[item.rule];
  let card = "";
  if (open){ const s = CONTENT.learn[LEARN_IDX[item.rule] - 1];
    card = `<div class="rulecard"><p class="rh">${fmt(s.title)}</p><ul>${s.rules.map(r => `<li>${fmt(r)}</li>`).join("")}</ul>
      ${s.careful ? `<div class="care">⚠ ${fmt(s.careful[0])}</div>` : ""}<button class="linkbtn" data-act="seeRule" data-id="${item.rule}">${esc(L.openRule)}</button></div>`; }
  return `<button class="linkbtn" data-act="toggleRule" data-id="${item.rule}" aria-expanded="${open ? "true" : "false"}">${esc(open ? L.hideRule : L.showRule)}</button>${card}`;
}

function renderTeamQuestion(){
  const L = CONTENT.labels, T2 = L.teams, key = TG.order[TG.idx], { round, item } = ITEM[key], kind = kindOf(round, item);
  const rec = TG.rec[key] || { tries:[], done:false }, cur = teamOf(TG.idx), name = TG.names[cur];
  const final = rec.done ? rec.tries[rec.tries.length - 1] : undefined;
  const prompt = promptHTML(round, item, final);
  const opts = optionsFor(round, item).map((o, k) => {
    const c = cOf(o), tried = rec.tries.includes(o);
    let cls = `opt c-${c}`, tick = "";
    if (rec.done){
      if (o === item.a || (isRight(item, o) && tried)){ cls += " right"; if (tried) tick = `<span class="tick">✓</span>`; }
      else if (tried){ cls += " wrong"; tick = `<span class="tick">✗</span>`; } else cls += " dim";
    } else if (tried){ cls += " wrong"; tick = `<span class="tick">✗</span>`; }
    const main = o === "ok" ? "correct" : o === NONE ? "–" : esc(o);
    const sub = o === "ok" ? "no change" : o === NONE ? CONTENT.noneLabel : (kind === "fix" ? "change to" : "");
    return `<button class="${cls}" data-act="tanswer" data-o="${esc(o)}" data-k="${k + 1}" ${rec.done || tried ? "disabled" : ""} aria-label="${esc(o === "ok" ? "Correct as it is" : (kind === "fix" ? "Change to " : "") + (o === NONE ? CONTENT.noneLabel : o))}">
      <span class="key" aria-hidden="true">${k + 1}</span>${mark(c, 28)}<span>${main}</span>${sub ? `<small>${esc(sub)}</small>` : ""}${tick}</button>`;
  }).join("");
  const segs = `<div class="segs" aria-hidden="true">${TG.order.map((k2, i) => { const r = TG.rec[k2]; return `<i class="${r && r.done ? "p" + r.pts : i === TG.idx ? "cur" : ""}"></i>`; }).join("")}</div>`;
  const timer = rec.done ? "" : `<div class="qt" id="qt"><div class="qt-main"><span class="qt-label" id="qtLabel"></span><span class="qt-time" id="qtTime" role="timer">0:00</span><span class="qt-sub" id="qtSub"></span></div>
      <div class="qt-ctrl"><button class="pill" data-act="hurry" id="qtHurry">⏱ ${esc(T2.hurry)}</button>
        <span class="secs" role="group" aria-label="Countdown length">${[20,10,5].map(x => `<button data-act="hsecs" data-s="${x}" aria-pressed="${PREFS.hurry === x}">${x}s</button>`).join("")}</span>
        <button class="pill" data-act="pause" id="qtPause">${esc(T2.pause)}</button>
        <button class="pill" data-act="sound" aria-pressed="${PREFS.sound}" aria-label="Sound">${PREFS.sound ? "🔊" : "🔇"}</button></div></div>`;
  let fb = "";
  if (rec.done){
    const right = isRight(item, final), list = right ? L.verdictRight : L.verdictWrong, say = list[TG.idx % list.length];
    const ptsLine = rec.late ? T2.late : rec.pts ? T2.points(rec.pts, name) : T2.zero(name);
    fb = `<div class="feedback ${right ? "ok" : "no"}" role="status"><span class="fbicon" aria-hidden="true">${right ? "✓" : "✗"}</span><div class="fbbox"><p class="verdict">${esc(say)}</p>
      <p><span class="badge">${esc(ptsLine)}</span></p>${right ? "" : `<p>${L.answerIs}: <b>${answerText(round, item)}</b>.</p>`}<p>${fmt(item.why)}</p><p>${ruleToggle(item)}</p></div></div>`;
  } else if (rec.tries.length) fb = `<p class="second" role="status"><span class="fbicon" aria-hidden="true" style="background:var(--bad)">✗</span>${esc(T2.second)}</p>`;
  return `<p class="row" style="margin:0 0 10px"><button class="linkbtn" data-act="mode">← ${esc(T2.changeMode)}</button></p>
    <div class="card qcard" id="qcard" ${stg(0)}>
    <div class="turnbar"><div class="turn"><span class="tsym ts${cur}" aria-hidden="true">${TEAM[cur].sym}</span><span>${esc(T2.turn(roundOf(TG.idx), roundsTotal(), name))}</span></div>${timer}</div>
    ${scoresHTML(cur)}${segs}
    <span class="tag">${esc(L.kindName[kind])}</span>
    <p class="task">${esc(L.tasks[kind])}</p>
    <p class="prompt">${prompt}</p>
    <div class="qbody"><div class="opts${kind === "fix" ? " five" : ""}" role="group" aria-label="Choices">${opts}</div>${fb}</div></div>`;
}
function renderTeamEnd(){
  const L = CONTENT.labels, T2 = L.teams, best = Math.max(...TG.pts), winners = TG.pts.filter(p => p === best).length;
  const order = TG.names.map((nm, i) => i).sort((a, b) => TG.pts[b] - TG.pts[a]);
  const recap = TG.order.filter(k => TG.rec[k] && TG.rec[k].pts < 2).slice(0, 5)

/* ================= display: effects ================= */
const FXCOL = ["#E8896F","#6CB8A6","#A493DD","#F5C46B"];
function burst(x, y, n = 12){
  if (reduced()) return;
  const fx = $("fx");
  for (let i = 0; i < n; i++){
    const b = document.createElement("i"), a = Math.random() * Math.PI * 2, d = 60 + Math.random() * 100;
    b.className = "bit " + ["bean","leaf",""][i % 3];
    b.style.cssText = `left:${x}px;top:${y}px;background:${FXCOL[i % 4]};--dx:${Math.cos(a) * d}px;--dy:${Math.sin(a) * d - 40}px;--r:${Math.random() * 400 - 200}deg`;
    fx.appendChild(b); setTimeout(() => b.remove(), 1050);
  }
}
function rain(n = 60){
  if (reduced()) return;
  const fx = $("fx"), w = innerWidth;
  for (let i = 0; i < n; i++){
    const b = document.createElement("i"), dur = 2 + Math.random() * 1.6;
    b.className = "bit rain " + ["bean","leaf",""][i % 3];
    b.style.cssText = `left:${Math.random() * w}px;top:0;background:${FXCOL[i % 4]};--dx:${Math.random() * 120 - 60}px;--r:${Math.random() * 540}deg;animation-duration:${dur}s;animation-delay:${Math.random() * .8}s`;
    fx.appendChild(b); setTimeout(() => b.remove(), (dur + 1) * 1000);
  }
}
function countUp(el){
  const to = +el.dataset.to; if (reduced() || !to) return;
  const t0 = performance.now(), dur = 900;
  const tick = t => { const p = Math.min(1, (t - t0) / dur); el.textContent = Math.round(to * (1 - Math.pow(1 - p, 3))); if (p < 1) requestAnimationFrame(tick); };
  el.textContent = "0"; requestAnimationFrame(tick);
}
function playFx(){
  const q = fxQueue; fxQueue = null;
  if (!q) return;
  const cu = $("countup"); if (cu && q.kind === "end") countUp(cu);
  if (q.kind === "right" || q.kind === "wrong"){
    const fb = document.querySelector(".feedback");
    if (fb) fb.scrollIntoView({ block:"nearest", behavior: reduced() ? "auto" : "smooth" });
    if (q.kind === "right"){ const b = document.querySelector(".opt.right"); if (b){ const r = b.getBoundingClientRect(); burst(r.left + r.width / 2, r.top + r.height / 2); } }
    else { const c = $("qcard"); if (c){ c.classList.remove("shake"); void c.offsetWidth; c.classList.add("shake"); } }
  }
  if (q.kind === "end"){ const { s, n } = roundScore(S.round); if (s === n) rain(36); }
  if (q.kind === "tend") rain(30);
}

/* ================= saving ================= */
const KEY = "coc-b2-prepositions-time-place.v1";
const store = {
  load(){ try { return JSON.parse(localStorage.getItem(KEY)); } catch(e){ return null; } },
  save(d){ try { localStorage.setItem(KEY, JSON.stringify(d)); } catch(e){} },
  clear(){ try { localStorage.removeItem(KEY); } catch(e){} }
};
let saveT;
function save(){ clearTimeout(saveT); saveT = setTimeout(() => store.save(S), 120); }
function loadState(){
  const d = store.load();
  if (!d || typeof d !== "object" || ![1, 2, 3].includes(d.v)) return;        // saves from earlier versions are still read
  if (!d.answers || typeof d.answers !== "object" || !Array.isArray(d.mistakes)) return;
  const f = freshState();
  f.learn = Number.isInteger(d.learn) && d.learn >= 0 && d.learn <= CONTENT.learn.length ? d.learn : 0;
  CONTENT.rounds.forEach(r => {
    const a = d.answers[r.id] || {};
    Object.keys(a).forEach(k => { if (!ITEM[k] || ITEM[k].round.id !== r.id) return;
      const ok = kindOf(r, ITEM[k].item) === "fix" ? ["ok", ...CONTENT.labels.opts] : CONTENT.labels.opts;
      if (ok.includes(a[k])) f.answers[r.id][k] = a[k]; });
  });
  f.mistakes = [...new Set(d.mistakes.filter(k => typeof k === "string" && ITEM[k]))];
  f.visited = Array.isArray(d.visited) ? [...new Set(d.visited.filter(id => LEARN_IDX[id]))] : [];
  if (ROUND[d.round]) f.round = d.round;
  const n = ROUND[f.round].items.length;
  f.idx = Number.isInteger(d.idx) && d.idx >= 0 && d.idx < n ? d.idx : 0;
  if (d.last && d.last.tab === "learn" && Number.isInteger(d.last.learn) && d.last.learn > 0 && d.last.learn <= CONTENT.learn.length) f.last = { tab:"learn", learn:d.last.learn };
  else if (d.last && d.last.tab === "practise" && ROUND[d.last.round]) f.last = { tab:"practise", round:d.last.round };
  f.tab = "start"; f.view = "home";          // every visit opens on the café menu
  S = f;
}
addEventListener("visibilitychange", () => { if (document.hidden){ store.save(S); saveTG(); } else if (S.view === "team"){ wake = null; keepAwake(true); } });
/* the team game and the preferences have their own keys, so "erase my progress" and a class game never mix */
const TKEY = "coc-b2-prepositions-teams.v1", PKEY = "coc-b2-prepositions.prefs";
function saveTG(){ try { if (TG) localStorage.setItem(TKEY, JSON.stringify(TG)); else localStorage.removeItem(TKEY); } catch(e){} }
function loadTG(){
  try { const d = JSON.parse(localStorage.getItem(TKEY));
    if (!d || d.v !== 1 || ![2,3,4].includes(d.n) || !Array.isArray(d.names) || !Array.isArray(d.order) || !Array.isArray(d.pts)) return;
    if (!d.order.every(k => ITEM[k]) || d.pts.length !== d.n || d.order.length % d.n) return;
    const rec = {}; Object.keys(d.rec || {}).forEach(k => { const r = d.rec[k];
      if (ITEM[k] && r && Array.isArray(r.tries) && r.tries.every(t => typeof t === "string" && t.length < 4) && [0,1,2].includes(r.pts))
        rec[k] = { tries:r.tries.slice(0, 2), done:!!r.done, pts:r.pts, late:!!r.late }; });
    TG = { v:1, n:d.n, names:d.names.slice(0, d.n).map(x => String(x).slice(0, 24)), order:d.order, idx:Math.min(Math.max(0, d.idx | 0), d.order.length - 1),
           rec, pts:d.pts.map(x => Math.max(0, x | 0)), ended:!!d.ended };

}
let PREFS = { hurry:10, sound:true, classview:false };
function loadPrefs(){ try { const p = JSON.parse(localStorage.getItem(PKEY)) || {}; if ([5,10,20].includes(p.hurry)) PREFS.hurry = p.hurry; PREFS.sound = p.sound !== false; PREFS.classview = !!p.classview; } catch(e){} }
function savePrefs(){ try { localStorage.setItem(PKEY, JSON.stringify(PREFS)); } catch(e){} }

/* ================= events ================= */
const ACT = {   // return false to skip the full redraw
  tab: b => { S.tab = b.dataset.tab; if (S.tab === "practise" && ["mistend","mist"].includes(S.view)) S.view = "home"; save(); },
  goStart: () => { S.tab = "start"; save(); },
  continue: () => continueLast(),
  goLearn: b => { S.tab = "learn"; S.learn = +b.dataset.i; save(); },
  reveal: b => { const shown = !b.classList.contains("shown");
    b.outerHTML = gapHTML(b.dataset.s, +b.dataset.j, shown);
    if (shown){ const nb = document.querySelector(`.gapbtn[data-s="${b.dataset.s}"][data-j="${b.dataset.j}"]`); if (nb && !reduced()) nb.classList.add("pop"); nb?.focus(); }
    return false; },
  revealAll: b => { const list = $("ex-" + b.dataset.id); if (!list) return false;
    const btns = [...list.querySelectorAll(".gapbtn")], all = btns.every(x => x.classList.contains("shown"));
    btns.forEach(x => { x.outerHTML = gapHTML(x.dataset.s, +x.dataset.j, !all); });
    if (!all && !reduced()) list.querySelectorAll(".gapbtn").forEach((x, k) => { x.style.animationDelay = `${k * 80}ms`; x.classList.add("pop"); });
    return false; },
  prev: () => step(-1),
  next: () => step(1),
  openRound: b => openRound(b.dataset.r),
  answer: b => answer(b.dataset.o),
  home: () => { S.tab = "practise"; S.view = "home"; S.mq = null; save(); },
  review: b => reviewRound(b.dataset.r),
  again: b => restartRound(b.dataset.r),
  startMist: () => startMistakes(),
  seeRule: b => { S.tab = "learn"; S.learn = LEARN_IDX[b.dataset.id] || 0; save(); },
  toggleRule: b => { openRuleFor = openRuleFor === b.dataset.id ? null : b.dataset.id; },
  classview: () => { PREFS.classview = !PREFS.classview; savePrefs(); },
  print: () => { buildPrint(); window.print(); return false; },
  mode: () => { readNames(); S.tab = "practise"; S.round = REV.id; S.view = "mode"; save(); },
  solo: () => openSolo(REV.id),
  teamSetup: () => { S.view = "tsetup"; },
  setN: b => { readNames(); setupN = +b.dataset.n; },
  teamStart: () => { readNames(); newTeamGame(setupN, setupNames); qt.key = null; S.view = "team"; sound(""); },
  teamResume: () => { if (TG){ TG.ended = false; S.view = "team"; qt.key = null; } },
  teamAgain: () => { newTeamGame(TG.n, TG.names); qt.key = null; S.view = "team"; },
  teamReview: () => { TG.idx = 0; S.view = "team"; saveTG(); },
  tanswer: b => teamAnswer(b.dataset.o),
  hurry: () => { qtHurry(); updateTimer(); return false; },
  hsecs: b => { PREFS.hurry = +b.dataset.s; savePrefs(); document.querySelectorAll(".secs button").forEach(x => x.setAttribute("aria-pressed", String(+x.dataset.s === PREFS.hurry))); return false; },
  pause: () => { qtPause(); updateTimer(); return false; },
  sound: b => { PREFS.sound = !PREFS.sound; savePrefs(); b.setAttribute("aria-pressed", String(PREFS.sound)); b.textContent = PREFS.sound ? "🔊" : "🔇"; return false; },
  eraseAsk: () => { eraseOpen = true; eraseDone = false; setTimeout(() => document.querySelector('[data-act="eraseNo"]')?.focus(), 0); },
  eraseNo: () => { eraseOpen = false; },
  eraseYes: () => { const tab = S.tab; store.clear(); S = freshState();
                    TG = null; saveTG(); setupNames = ["Team A", "Team B", "Team C", "Team D"]; setupN = 2;   /* team names go too (shared computers) */ S.tab = tab === "practise" ? "practise" : "start"; eraseOpen = false; eraseDone = true;
                    setTimeout(() => { eraseDone = false; if (S.tab === "start" || (S.tab === "practise" && S.view === "home")) render(); }, 5000); }
};
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b || b.disabled) return;
  const f = ACT[b.dataset.act]; if (!f) return;
  if (!/^erase/.test(b.dataset.act)){ eraseOpen = false; eraseDone = false; }
  if (["answer","tanswer","prev","next","home","mode","goLearn"].includes(b.dataset.act)) openRuleFor = null;
  if (f(b) !== false) render();
});
document.addEventListener("keydown", e => {
  if (e.target.closest("input,textarea") || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === "ArrowRight" && !$("navbar").hidden && !$("btnNext").disabled){ step(1); render(); }
  else if (e.key === "ArrowLeft" && !$("navbar").hidden && !$("btnPrev").disabled){ step(-1); render(); }
  else if (/^[1-5]$/.test(e.key)){ const b = document.querySelector(`.opt[data-k="${e.key}"]:not(:disabled)`);
    if (b){ openRuleFor = null; if (S.view === "team") teamAnswer(b.dataset.o); else answer(b.dataset.o); render(); } }
  else if (S.view === "team" && (e.key === " " || e.code === "Space")){ e.preventDefault(); qtPause(); updateTimer(); }
  else if (S.view === "team" && (e.key === "h" || e.key === "H")){ qtHurry(); updateTimer(); }
});

buildScene();
loadPrefs();
loadState();
loadTG();
if (location.hash === "#class"){        // the class link: class view, revision round, teams
  PREFS.classview = true; savePrefs(); S.tab = "practise"; S.round = REV.id;
  S.view = TG && !TG.ended ? "team" : "tsetup";
}
render();

    text.textContent = 'Original by Class of Coffee';
    var link = document.createElement('a');
    link.href = url; link.target = '_blank'; link.rel = 'noopener';
    link.textContent = 'Open the original';
    var close = document.createElement('button');
    close.type = 'button'; close.setAttribute('aria-label', 'Close this note'); close.textContent = '×';
    close.addEventListener('click', function () {
      box.remove();
      try { sessionStorage.setItem('coc-origin-closed', '1'); } catch (e) {}
    });
    box.appendChild(text); box.appendChild(link); box.appendChild(close);
    document.body.appendChild(box);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', show); else show();
})();
</script>
</body>
