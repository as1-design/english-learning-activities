<!doctype html>
<!--
  Name:     Inversion Conversion · B2.2 speaking card game
  Purpose:  Card game for groups of three (2–4) on one phone. Part 1: the reader
            reads a plain sentence and the next player says it with inversion;
            the third player can steal the card. Part 2: short speeches and
            stories with inversion, with planning and speaking timers.
            Print cards for a paper version. Goes with b22-inversion.html.
  Version:  1.0 · 2026-11-26
  Edit:     All cards and prompts are in the CONTENT section at the top of
            the script. Mini-format: [words] = inverted words (highlighted).
            Keep the number of cards in each set divisible by 3, so that
            three players always get the same number of turns.
  Storage:  localStorage "b22-inversion-conversion.v1" (game in progress,
            player names) and "b22-inversion-conversion.prefs".
  Credit:   Class of Coffee – with AI assistance
-->
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' data: blob:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inversion Conversion · B2.2</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔄</text></svg>">
<style>
/* ================= tokens ================= */
:root{
  --bg:#FFF6E3; --paper:#FFFDF7; --ink:#2A2135; --soft:#5E5468; --line:#E8D9BC; --tan:#C9A06A; --tan-soft:#F3E4C8;
  --accent:#C2255C; --accent-soft:#FBE3EC; --ok:#17706B; --ok-soft:#DDF2EE; --bad:#B3261E; --bad-soft:#FBE4E2; --gold:#F2B33D;
  --display:"Avenir Next","Segoe UI","Helvetica Neue",system-ui,-apple-system,Roboto,sans-serif;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --r-s:10px; --r-m:16px; --r-l:24px;
  --spring:cubic-bezier(.34,1.56,.64,1); --ease:cubic-bezier(.25,.46,.45,.94);
}
/* ================= base ================= */
*{box-sizing:border-box}
html{touch-action:manipulation;font-size:clamp(16px,14px + .45vw,22px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.5 var(--body);min-height:100vh;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button,input{font:inherit;color:inherit}
button{cursor:pointer;min-height:44px;border-radius:var(--r-s)}
button:disabled{cursor:default}
input{font-size:16px}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0}
#app{flex:1;width:100%;max-width:1000px;margin:0 auto;padding:1rem clamp(.8rem,3vw,2rem) 2rem}
.btn{border:2px solid var(--ink);background:var(--paper);padding:.45rem 1rem;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:.4rem;text-decoration:none;color:var(--ink);text-align:center}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn.good{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.ghost{border-color:var(--line);background:transparent}
.btn:disabled{opacity:.45}
.row{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
mark.inv{background:var(--accent-soft);color:var(--accent);font-weight:800;text-decoration:underline 3px;text-underline-offset:.22em;padding:0 .12em;border-radius:4px}
.kicker{font-size:.85rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:0 0 .4rem}
.muted{color:var(--soft)}
.card{background:var(--paper);border:2px solid var(--ink);border-radius:var(--r-l);padding:clamp(1rem,2.5vw,1.8rem);box-shadow:0 6px 0 var(--tan)}
.enter{animation:enter .35s var(--ease)}
.flip{animation:flip .5s var(--ease)}
@keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes flip{from{opacity:0;transform:perspective(900px) rotateY(-70deg)}to{opacity:1;transform:none}}
.pill{display:inline-block;font-size:.82rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase;border-radius:99px;padding:.1rem .6rem;border:2px solid currentColor;width:max-content}
.pill.inf{color:var(--ok)}
.pill.set{color:var(--accent)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ================= setup ================= */
.hero{padding:1rem 0 1rem;overflow:hidden}
.hero h1{font-size:clamp(2.2rem,1.6rem + 3.6vw,4.4rem);font-weight:800;letter-spacing:-.02em}
.hero .echo{font-family:var(--display);font-size:clamp(2.2rem,1.6rem + 3.6vw,4.4rem);font-weight:800;letter-spacing:-.02em;line-height:1.15;
  transform:scaleY(-1);color:var(--tan);opacity:.35;margin-top:-.35em;height:.55em;overflow:hidden;user-select:none}
.cando{background:var(--paper);border:2px solid var(--line);border-left:8px solid var(--accent);border-radius:var(--r-m);padding:.8rem 1rem;margin:.4rem 0 1.2rem}
.cando b{display:block;font-size:.85rem;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.section{margin:0 0 1.2rem}
.section h2{font-size:1.2rem;margin:0 0 .5rem}
.how{margin:.2rem 0 0;padding-left:1.2rem}
.how li{margin:.25rem 0}
.choice{border:2px solid var(--ink);background:var(--paper);padding:.5rem .9rem;font-weight:700;min-width:3.2rem}
.choice[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.setbtn{display:flex;flex-direction:column;align-items:flex-start;text-align:left;min-width:min(100%,15rem);flex:1 1 15rem}
.setbtn small{font-weight:600;opacity:.85}
.setbtn{position:relative;padding-right:2.2rem}
.setbtn[aria-pressed="true"]::after{content:'✓';position:absolute;right:.7rem;top:.5rem;font-weight:900}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,12rem),1fr));gap:.6rem}
.names label{display:flex;flex-direction:column;font-weight:700;font-size:.9rem;gap:.2rem}
.names input{border:2px solid var(--ink);border-radius:var(--r-s);padding:.5rem .7rem;background:var(--paper);min-height:44px}
.resume{border:2px dashed var(--accent);border-radius:var(--r-m);padding:.8rem 1rem;margin:0 0 1rem;background:var(--accent-soft)}
.note{font-size:.9rem;color:var(--soft);margin:.4rem 0 0}

/* ================= game ================= */
.topbar{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem .8rem;margin-bottom:.8rem}
.topbar .where{margin-left:auto;font-weight:700;color:var(--soft);font-variant-numeric:tabular-nums}
.scores{display:flex;flex-wrap:wrap;gap:.4rem;margin:0 0 .9rem}
.sc{border:2px solid var(--line);background:var(--paper);border-radius:99px;padding:.2rem .8rem;font-weight:700;font-variant-numeric:tabular-nums}
.sc.on{border-color:var(--ink)}
.sc b{font-weight:900}
.who{font-size:1.05rem;font-weight:700;margin:0 0 .8rem;min-height:4.5em}
.sit{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center;margin-bottom:.4rem}
.sit span.s{font-weight:700;color:var(--soft)}
.plain{font-size:clamp(1.35rem,1.05rem + 1.2vw,2.2rem);font-weight:800;line-height:1.35;margin:.3rem 0 .6rem}
.start{font-weight:700;color:var(--accent);margin:0 0 .6rem}
.answer{border-top:2px dashed var(--line);margin-top:.9rem;padding-top:.7rem}
.answer h3{font-size:.82rem;letter-spacing:.06em;text-transform:uppercase;color:var(--soft);margin-bottom:.2rem}
.answer p{font-style:italic;font-size:1.1rem;margin:.2rem 0}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin-top:1rem}
.actions .btn{width:100%;min-height:56px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;line-height:1.2;padding:.7rem .6rem}
.status{min-height:3.2rem;margin-top:.8rem;font-weight:700}
.status.won{color:var(--ok)}
.undo{margin-top:.6rem}
.endlist{list-style:none;padding:0;margin:.4rem 0}
.endlist li{display:flex;justify-content:space-between;gap:1rem;border-bottom:1px solid var(--line);padding:.45rem 0;font-weight:700;font-variant-numeric:tabular-nums}
.endlist li.top{color:var(--accent)}
.rev{border-top:1px solid var(--line);padding:.6rem 0}
.rev .p{font-weight:700}
.rev .a{font-style:italic}
.rev small{color:var(--soft)}

/* ================= speaking ================= */
.prompt{font-size:clamp(1.25rem,1rem + 1vw,2rem);font-weight:800;line-height:1.3;margin:.2rem 0 .4rem}
.starter{font-size:1.15rem;margin:.2rem 0 .8rem}
.timer{display:flex;flex-wrap:wrap;align-items:center;gap:.6rem 1rem;border:2px solid var(--line);border-radius:var(--r-m);padding:.7rem 1rem;margin:.8rem 0;background:var(--bg)}
.timer .lab{font-weight:800;min-width:7.5rem}
.timer .clock{font:800 clamp(2rem,1.6rem + 2vw,3.2rem)/1 var(--display);font-variant-numeric:tabular-nums;min-width:4.2ch}
.timer .clock.low{color:var(--bad)}
.timer .btn{width:7.5rem;white-space:nowrap}
.timer .btn.ghost{width:12rem}
.listen{font-weight:700;color:var(--ok)}

/* ================= settings / qr ================= */
.linkcard{border:2px solid var(--ink);border-radius:var(--r-m);padding:.9rem 1rem;background:var(--paper);margin:.8rem 0}
.linkcard h3{font-size:1.05rem;margin-bottom:.2rem}
.linkcard p{margin:.1rem 0 .6rem;color:var(--soft)}
.qrbox{margin-top:.8rem;display:flex;flex-direction:column;align-items:flex-start;gap:.4rem}
.qrbox svg{width:min(24rem,80vw,60vh);height:auto;background:#fff;border-radius:8px}
.url{font-size:.85rem;color:var(--soft);word-break:break-all}

/* ================= footer (Class of Coffee signature) ================= */
.coc-footer{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:4px 16px;padding:7px 20px;
  background:var(--coc-tan,#E6C496);color:var(--coc-coffee-dark,#5A2D0C);font-family:var(--coc-body,'Nunito','Segoe UI',Verdana,sans-serif);font-size:13px;line-height:1.4}
.coc-footer__brand{display:flex;align-items:center;gap:10px;font-weight:600}
.coc-footer__mark{width:30px;height:30px;flex:none}
.coc-footer a{color:inherit;text-decoration:underline;text-underline-offset:3px;display:inline-flex;align-items:center;min-height:40px;padding:0 4px}
.coc-footer a:focus-visible{outline:2px solid var(--coc-coffee-dark,#5A2D0C);outline-offset:3px;border-radius:4px}
body.ingame .coc-footer{display:none}

/* ================= print ================= */
#print{display:none}
@media print{
  @page{size:A4;margin:10mm}
  body{background:#fff;display:block;padding:0}
  #app,.coc-footer{display:none!important}
  #print{display:block;color:#000;font-family:var(--body)}
  .pp{page-break-after:always;break-after:page}
  .pp:last-child{page-break-after:auto;break-after:auto}
  .pp h2{font-size:14pt;margin:0 0 3mm}
  .pgrid{display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:58mm;border-top:1px dashed #777;border-left:1px dashed #777}
  .pgrid.sp{grid-template-columns:repeat(3,1fr);grid-auto-rows:60mm}
  .pc{border-right:1px dashed #777;border-bottom:1px dashed #777;padding:4mm;font-size:10.5pt;line-height:1.35;overflow:hidden;break-inside:avoid}
  .pc .ps{font-size:8.5pt;text-transform:uppercase;letter-spacing:.04em;color:#444;margin-bottom:1.5mm}
  .pc .pb{font-weight:700;font-size:11.5pt;margin-bottom:3mm}
  .pc .pa{font-style:italic;font-size:10pt}
  .pc .pa mark{background:none;color:#000;font-weight:700;text-decoration:underline}
  .pc .pt{font-weight:700;font-size:12pt;margin:1mm 0 2mm}
  .pfoot{font-size:8pt;color:#555;margin-top:3mm;display:flex;justify-content:space-between}
}
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<section id="print" aria-hidden="true"></section>
<footer class="coc-footer">
  <span class="coc-footer__brand">
    <svg class="coc-footer__mark" xmlns="http://www.w3.org/2000/svg" viewBox="4 4 48 48" aria-hidden="true" focusable="false"><path d="M42.57 20.25A16.5 16.5 0 1 0 42.57 35.75L38.77 33.73A12.2 12.2 0 1 1 38.77 22.27Z" fill="#EDE3D6"/><path d="M42.57 20.25A16.5 16.5 0 1 0 42.57 35.75L40.89 34.85A14.6 14.6 0 1 1 40.89 21.15Z" fill="#D9C8B2"/><path d="M48.31 17.2A23 23 0 1 0 48.31 38.8A3.25 3.25 0 0 0 42.57 35.75A16.5 16.5 0 1 1 42.57 20.25A3.25 3.25 0 0 0 48.31 17.2Z" fill="#A2521A" stroke="#5A2D0C" stroke-width="1.8" stroke-linejoin="round"/><circle cx="28" cy="28" r="12.2" fill="#744823" stroke="#5A3517" stroke-width="1"/><path d="M32.5 22.64A7.0 7.0 0 1 0 32.5 33.36L32.64 32.21A5.5 5.5 0 1 1 32.64 23.79Z" fill="#F3E2BF" stroke="#F3E2BF" stroke-width="0.7" stroke-linejoin="round"/></svg>
    <span>Class of Coffee – with AI assistance</span>
  </span>
  <a href="https://classofcoffee.com">classofcoffee.com</a>
</footer>
<script>
/* ================= CONTENT (edit here) ================= */
const CONTENT = {
  title: 'Inversion Conversion',
  subtitle: 'B2.2 · Speaking card game for groups of three',
  canDo: 'I can change sentences to use inversion, and use inversion to tell a story, give a speech or make a complaint.',
  publishedUrl: 'https://as1-design.github.io/english-learning-activities/b22-inversion-conversion.html',
  hubUrl: 'b22-inversion.html',
  credit: 'Class of Coffee – with AI assistance',
  timers: { plan: 60, speak: 45 },   // seconds
  speakRounds: 3,                    // fewer if there are not enough prompts

  how: [
    'Sit in a group of three. One phone is enough.',
    'The reader holds the phone and reads the sentence in bold to the player on their right.',
    'That player says the sentence again with inversion. The reader checks the answer on the phone.',
    'If it is right, that player wins the card. If not, the third player can steal it. If nobody gets it, the reader keeps the card.',
    'Then pass the phone to the right. The new reader reads the next card.',
  ],

  // Each card: sit = situation, plain = sentence to read, ans = accepted answers
  // ([..] = inverted words), start = "Start with" hint, inf = informal.
  sets: [
    { id: 'A', name: 'Set A · Inversion straight after the word', short: 'Never, Rarely, Little, Not only…', cards: [
      { id: 'A1', sit: 'Restaurant review', plain: 'I have never tasted such fresh fish.', ans: ['Never [have I] tasted such fresh fish.', 'Never before [have I] tasted such fresh fish.'], start: 'Never…' },
      { id: 'A2', sit: 'Hotel complaint', plain: 'Nobody told us about the extra charge at any point.', ans: ['At no point [were we] told about the extra charge.', 'At no point [did anybody] tell us about the extra charge.'], start: 'At no point…' },
      { id: 'A3', sit: 'Airport notice', plain: 'You should not leave your bags unattended under any circumstances.', ans: ['Under no circumstances [should you] leave your bags unattended.'], start: 'Under no circumstances…' },
      { id: 'A4', sit: 'Story', plain: 'We didn’t know that the storm was heading straight for us.', ans: ['Little [did we] know that the storm was heading straight for us.'], start: 'Little…' },
      { id: 'A5', sit: 'Interview with an actor', plain: 'I rarely go out to restaurants these days.', ans: ['Rarely [do I] go out to restaurants these days.', 'Seldom [do I] go out to restaurants these days.'], start: 'Rarely…' },
      { id: 'A6', sit: 'Complaint', plain: 'The manager didn’t apologise once.', ans: ['Not once [did the manager] apologise.'], start: 'Not once…' },
      { id: 'A7', sit: 'Travel blog', plain: 'The flat was tiny, and it was also very noisy.', ans: ['Not only [was the flat] tiny, but it was also very noisy.'], start: 'Not only…' },
      { id: 'A8', sit: 'Anecdote', plain: 'As soon as I closed my eyes, the fire alarm went off.', ans: ['No sooner [had I] closed my eyes than the fire alarm went off.', 'Hardly / Barely [had I] closed my eyes when the fire alarm went off.'], start: 'No sooner…' },
      { id: 'A9', sit: 'Match report', plain: 'The match had hardly started when it began to pour.', ans: ['Hardly [had the match] started when it began to pour.'], start: 'Hardly…' },
      { id: 'A10', sit: 'News report', plain: 'The wind was so strong that the ferries were cancelled.', ans: ['So strong [was the wind] that the ferries were cancelled.'], start: 'So strong…' },
      { id: 'A11', sit: 'Concert review', plain: 'The demand was so great that the tickets sold out in an hour.', ans: ['Such [was the demand] that the tickets sold out in an hour.'], start: 'Such…' },
      { id: 'A12', sit: 'Chat with a friend', inf: true, plain: 'There’s no way I’m doing karaoke tonight.', ans: ['No way [am I] doing karaoke tonight.'], start: 'No way…' },
    ]},
    { id: 'B', name: 'Set B · Inversion in the second clause', short: 'Not until, Only when, Only if…', cards: [
      { id: 'B1', sit: 'Anecdote', plain: 'I didn’t notice my phone was missing until I got home.', ans: ['Not until I got home [did I] notice my phone was missing.'], start: 'Not until…' },
      { id: 'B2', sit: 'Exam rules', plain: 'Candidates may leave the room only when the exam has finished.', ans: ['Only when the exam has finished [may candidates] leave the room.'], start: 'Only when…' },
      { id: 'B3', sit: 'Online shop', plain: 'We will give you a refund only if you return the item within 30 days.', ans: ['Only if you return the item within 30 days [will we] give you a refund.'], start: 'Only if…' },
      { id: 'B4', sit: 'Music biography', plain: 'The band became famous only after they had moved to New York.', ans: ['Only after they had moved to New York [did the band] become famous.'], start: 'Only after…' },
      { id: 'B5', sit: 'Speech', plain: 'We can solve this problem only by working together.', ans: ['Only by working together [can we] solve this problem.'], start: 'Only by…' },
      { id: 'B6', sit: 'Reunion', plain: 'I haven’t laughed so much since we were at university.', ans: ['Not since we were at university [have I] laughed so much.'], start: 'Not since…' },
      { id: 'B7', sit: 'Work email', plain: 'We won’t know the results until Friday.', ans: ['Not until Friday [will we] know the results.'], start: 'Not until…' },
      { id: 'B8', sit: 'Story', plain: 'I understood what had happened only then.', ans: ['Only then [did I] understand what had happened.'], start: 'Only then…' },
      { id: 'B9', sit: 'Business meeting', plain: 'We can start only once the contract is signed.', ans: ['Only once the contract is signed [can we] start.'], start: 'Only once…' },
    ]},
    { id: 'C', name: 'Set C · Conditionals without if', short: 'Should, Were, Had', cards: [
      { id: 'C1', sit: 'Hotel email', plain: 'If you have any questions, please contact reception.', ans: ['[Should you] have any questions, please contact reception.'], start: 'Should…' },
      { id: 'C2', sit: 'Formal letter', plain: 'If we had known about the strike, we would have changed our flights.', ans: ['[Had we] known about the strike, we would have changed our flights.'], start: 'Had…' },
      { id: 'C3', sit: 'Staff meeting', plain: 'If I were in charge, I would change the timetable.', ans: ['[Were I] in charge, I would change the timetable.'], start: 'Were…' },
      { id: 'C4', sit: 'Apology email', plain: 'If the delivery hadn’t been late, we wouldn’t have missed the event.', ans: ['[Had the delivery not] been late, we wouldn’t have missed the event.'], start: 'Had…' },
      { id: 'C5', sit: 'Job application', plain: 'If you require further information, please do not hesitate to contact me.', ans: ['[Should you] require further information, please do not hesitate to contact me.'], start: 'Should…' },
      { id: 'C6', sit: 'Speech at a wedding', plain: 'If I hadn’t taken that job, I would never have met my best friend.', ans: ['[Had I not] taken that job, I would never have met my best friend.'], start: 'Had…' },
    ]},
  ],

  // Part 2: sit = situation, starter = sentence starter(s), inf = informal.
  prompts: [
    { id: 'P1', sit: 'Give a short leaving speech for a colleague.', starter: 'Never have I worked with someone who…' },
    { id: 'P2', sit: 'Review a disastrous holiday.', starter: 'Not only was the hotel…, but… / At no point were we…' },
    { id: 'P3', sit: 'Describe the trailer for the film of your life.', starter: 'Little did they know that…' },
    { id: 'P4', sit: 'Tell the group about a moment that changed your mind.', starter: 'Not until I… did I realise…' },
    { id: 'P5', sit: 'Make a promise after a bad experience.', starter: 'Never again will I…' },
    { id: 'P6', sit: 'Give advice to a visitor to your town.', starter: 'Under no circumstances should you… / Only if you… will you…' },
    { id: 'P7', sit: 'Write a formal email to a new neighbour, offering help. Read it aloud.', starter: 'Should you need…' },
    { id: 'P8', sit: 'Talk about a small regret.', starter: 'Had I known…, I would…' },
    { id: 'P9', sit: 'A friend asks you to do something you would never do. Answer them.', starter: 'No way am I…', inf: true },
  ],
};

/* ================= state ================= */
const KEY = 'b22-inversion-conversion.v1', PKEY = 'b22-inversion-conversion.prefs';
// S is the game: phase = setup | convert | end | review | speak | speakEnd | settings
let S = freshState();
let P = { sound: true };
const V = { qr: false, last: '', resumeOffer: false };
const T = { mode: 'plan', left: 0, running: false, endAt: 0, tick: null };   // Part 2 timer (not saved)

function freshState(names){
  return { v: 1, phase: 'setup', n: 3, names: names || ['', '', '', ''], sets: ['A', 'B', 'C'], easy: false,
    deck: [], i: 0, step: 'read', won: {}, history: [], sp: { order: [], turn: 0 } };
}

/* ================= logic ================= */
const allCards = () => CONTENT.sets.flatMap(s => s.cards.map(c => ({ ...c, set: s.id })));
const cardById = id => allCards().find(c => c.id === id);
const pname = i => (S.names[i] || '').trim() || `Player ${i + 1}`;
const reader = () => S.i % S.n;
const conv = () => (reader() + 1) % S.n;
const stealer = () => S.n > 2 ? (reader() + 2) % S.n : null;
function shuffle(a){ const b = a.slice(); for (let i = b.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; }

function startGame(){
  const ids = allCards().filter(c => S.sets.includes(c.set)).map(c => c.id);
  const deck = shuffle(ids);
  deck.length = Math.floor(deck.length / S.n) * S.n;     // full rounds only
  S.deck = deck; S.i = 0; S.step = 'read'; S.won = {}; S.history = []; S.phase = 'convert';
  S.sp = { order: [], turn: 0 };
  save(); keepAwake(true);
}
// outcome: 'conv' (converter right), 'miss' (converter wrong), 'steal' (stealer right), 'keep' (reader keeps)
function judge(outcome){
  const id = S.deck[S.i];
  S.history.push({ i: S.i, step: S.step, won: S.won[id] });
  if (outcome === 'conv'){ S.won[id] = conv(); S.step = 'done'; }
  else if (outcome === 'miss'){ if (stealer() === null){ S.won[id] = reader(); S.step = 'done'; S.kept = true; } else S.step = 'steal'; }
  else if (outcome === 'steal'){ S.won[id] = stealer(); S.step = 'done'; }
  else if (outcome === 'keep'){ S.won[id] = reader(); S.step = 'done'; }
  save();
}
function undo(){
  const h = S.history.pop(); if (!h) return;
  const id = S.deck[h.i];
  S.i = h.i; S.step = h.step;
  if (h.won === undefined) delete S.won[id]; else S.won[id] = h.won;
  save();
}
function nextCard(){
  if (S.i >= S.deck.length - 1){ S.phase = 'end'; keepAwake(false); }
  else { S.i++; S.step = 'read'; }
  save();
}
function tally(){
  const t = Array.from({ length: S.n }, () => 0);
  Object.values(S.won).forEach(w => { if (Number.isInteger(w) && w < S.n) t[w]++; });
  return t;
}
// Cards that nobody converted (the reader kept them): worth looking at again.
function keptCards(){ return S.deck.filter(id => S.won[id] !== undefined && S.won[id] === readerOf(S.deck.indexOf(id))); }
function readerOf(i){ return i % S.n; }

function startSpeak(){
  const rounds = Math.max(1, Math.min(CONTENT.speakRounds, Math.floor(CONTENT.prompts.length / S.n)));
  S.sp = { order: shuffle(CONTENT.prompts.map(p => p.id)).slice(0, rounds * S.n), turn: 0 };
  S.phase = 'speak'; save(); keepAwake(true); timerReset('plan');
}
function nextSpeaker(){
  if (S.sp.turn >= S.sp.order.length - 1){ S.phase = 'speakEnd'; keepAwake(false); }
  else S.sp.turn++;
  timerReset('plan'); save();
}

/* ----- timer (Part 2) ----- */
function timerReset(mode){ clearInterval(T.tick); T.mode = mode; T.left = CONTENT.timers[mode]; T.running = false; }
function timerToggle(){
  if (T.running){ T.left = Math.max(0, (T.endAt - Date.now()) / 1000); T.running = false; clearInterval(T.tick); }
  else { if (T.left <= 0) T.left = CONTENT.timers[T.mode]; T.endAt = Date.now() + T.left * 1000; T.running = true; clearInterval(T.tick); T.tick = setInterval(timerTick, 250); }
  drawTimer();
}
function timerTick(){
  const left = Math.max(0, (T.endAt - Date.now()) / 1000);
  const shown = Math.ceil(left);
  if (shown <= 5 && shown > 0 && shown !== T.lastTick){ T.lastTick = shown; sfx.tick(); }
  T.left = left;
  if (left <= 0){ clearInterval(T.tick); T.running = false; sfx.chime();
    if (T.mode === 'plan'){ timerReset('speak'); render(); return; } }
  drawTimer();
}

/* ================= text helpers ================= */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = s => esc(s).replace(/\[([^\]]+)\]/g, '<mark class="inv">$1</mark>');

/* ================= QR code ================= */
const QR = (() => {
  const EC = [null,[10,1,16,0,0],[16,1,28,0,0],[26,1,44,0,0],[18,2,32,0,0],[24,2,43,0,0],[16,4,27,0,0],[18,4,31,0,0],[22,2,38,2,39],[22,3,36,2,37],[26,4,43,1,44]];
  const AL = [null,[],[6,18],[6,22],[6,26],[6,30],[6,34],[6,22,38],[6,24,42],[6,26,46],[6,28,50]];
  const mul = (x, y) => { let z = 0; for (let i = 7; i >= 0; i--){ z = (z << 1) ^ ((z >>> 7) * 0x11D); z ^= ((y >>> i) & 1) * x; } return z & 255; };
  const div = d => { const r = new Array(d).fill(0); r[d - 1] = 1; let root = 1; for (let i = 0; i < d; i++){ for (let j = 0; j < d; j++){ r[j] = mul(r[j], root); if (j + 1 < d) r[j] ^= r[j + 1]; } root = mul(root, 2); } return r; };
  const rem = (data, dv) => { const r = dv.map(() => 0); for (const b of data){ const f = b ^ r.shift(); r.push(0); dv.forEach((c, i) => { r[i] ^= mul(c, f); }); } return r; };
  return function make(text){
    const bytes = Array.from(new TextEncoder().encode(text));
    let ver = 0;
    for (let v = 1; v <= 10; v++){ const e = EC[v], cap = e[1] * e[2] + e[3] * e[4]; const cb = v < 10 ? 8 : 16; if (4 + cb + bytes.length * 8 <= cap * 8){ ver = v; break; } }
    if (!ver) return null;
    const [ecl, b1, d1, b2, d2] = EC[ver], cap = b1 * d1 + b2 * d2, size = ver * 4 + 17;
    const bits = []; const put = (val, n) => { for (let i = n - 1; i >= 0; i--) bits.push((val >>> i) & 1); };
    put(4, 4); put(bytes.length, ver < 10 ? 8 : 16); bytes.forEach(b => put(b, 8));
    put(0, Math.min(4, cap * 8 - bits.length)); while (bits.length % 8) bits.push(0);
    const data = []; for (let i = 0; i < bits.length; i += 8) data.push(parseInt(bits.slice(i, i + 8).join(''), 2));
    for (let p = 0xEC; data.length < cap; p ^= 0xEC ^ 0x11) data.push(p);
    const blocks = []; let k = 0; const dv = div(ecl);
    for (let i = 0; i < b1 + b2; i++){ const len = i < b1 ? d1 : d2; const d = data.slice(k, k + len); k += len; blocks.push({ d, e: rem(d, dv) }); }
    const all = []; const maxD = Math.max(d1, d2);
    for (let i = 0; i < maxD; i++) blocks.forEach(b => { if (i < b.d.length) all.push(b.d[i]); });
    for (let i = 0; i < ecl; i++) blocks.forEach(b => all.push(b.e[i]));
    const M = Array.from({ length: size }, () => new Array(size).fill(false));
    const F = Array.from({ length: size }, () => new Array(size).fill(false));
    const set = (x, y, v) => { M[y][x] = v; F[y][x] = true; };
    for (let i = 0; i < size; i++){ set(6, i, i % 2 === 0); set(i, 6, i % 2 === 0); }
    [[3, 3], [size - 4, 3], [3, size - 4]].forEach(([cx, cy]) => { for (let dy = -4; dy <= 4; dy++) for (let dx = -4; dx <= 4; dx++){ const x = cx + dx, y = cy + dy; if (x >= 0 && x < size && y >= 0 && y < size){ const d = Math.max(Math.abs(dx), Math.abs(dy)); set(x, y, d !== 2 && d !== 4); } } });
    const al = AL[ver], last = al.length - 1;
    al.forEach((ax, i) => al.forEach((ay, j) => { if ((i === 0 && j === 0) || (i === 0 && j === last) || (i === last && j === 0)) return; for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) set(ax + dx, ay + dy, Math.max(Math.abs(dx), Math.abs(dy)) !== 1); }));
    const fmtBits = mask => { const d = (0 << 3) | mask; let r = d; for (let i = 0; i < 10; i++) r = (r << 1) ^ ((r >>> 9) * 0x537); const b = ((d << 10) | r) ^ 0x5412; const g = i => ((b >>> i) & 1) === 1;
      for (let i = 0; i <= 5; i++) set(8, i, g(i)); set(8, 7, g(6)); set(8, 8, g(7)); set(7, 8, g(8));
      for (let i = 9; i < 15; i++) set(14 - i, 8, g(i));
      for (let i = 0; i < 8; i++) set(size - 1 - i, 8, g(i));
      for (let i = 8; i < 15; i++) set(8, size - 15 + i, g(i));
      set(8, size - 8, true); };
    fmtBits(0);
    if (ver >= 7){ let r = ver; for (let i = 0; i < 12; i++) r = (r << 1) ^ ((r >>> 11) * 0x1F25); const b = (ver << 12) | r;
      for (let i = 0; i < 18; i++){ const v = ((b >>> i) & 1) === 1, a = size - 11 + (i % 3), c = Math.floor(i / 3); set(a, c, v); set(c, a, v); } }
    let bi = 0;
    for (let right = size - 1; right >= 1; right -= 2){ if (right === 6) right = 5;
      for (let vert = 0; vert < size; vert++) for (let j = 0; j < 2; j++){ const x = right - j, up = ((right + 1) & 2) === 0, y = up ? size - 1 - vert : vert;
        if (!F[y][x] && bi < all.length * 8){ M[y][x] = ((all[bi >>> 3] >>> (7 - (bi & 7))) & 1) === 1; bi++; } } }
    const masks = [(x, y) => (x + y) % 2 === 0, (x, y) => y % 2 === 0, (x) => x % 3 === 0, (x, y) => (x + y) % 3 === 0, (x, y) => (Math.floor(x / 3) + Math.floor(y / 2)) % 2 === 0, (x, y) => x * y % 2 + x * y % 3 === 0, (x, y) => (x * y % 2 + x * y % 3) % 2 === 0, (x, y) => ((x + y) % 2 + x * y % 3) % 2 === 0];
    const apply = m => { for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) if (!F[y][x] && masks[m](x, y)) M[y][x] = !M[y][x]; };
    const penalty = () => { let p = 0, dark = 0;
      for (let y = 0; y < size; y++){ let run = 1, runV = 1; for (let x = 0; x < size; x++){ if (M[y][x]) dark++;
        if (x > 0){ if (M[y][x] === M[y][x - 1]){ run++; if (run === 5) p += 3; else if (run > 5) p++; } else run = 1;
                    if (M[x][y] === M[x - 1][y]){ runV++; if (runV === 5) p += 3; else if (runV > 5) p++; } else runV = 1; }
        if (x < size - 1 && y < size - 1 && M[y][x] === M[y][x + 1] && M[y][x] === M[y + 1][x] && M[y][x] === M[y + 1][x + 1]) p += 3; } }
      p += Math.floor(Math.abs(dark * 20 - size * size * 10) / (size * size)) * 10; return p; };
    let best = 0, bestP = Infinity;
    for (let m = 0; m < 8; m++){ apply(m); fmtBits(m); const p = penalty(); if (p < bestP){ bestP = p; best = m; } apply(m); }
    apply(best); fmtBits(best);
    let path = ''; for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) if (M[y][x]) path += `M${x + 4} ${y + 4}h1v1h-1z`;
    const n = size + 8;
    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${n} ${n}" shape-rendering="crispEdges" role="img" aria-label="QR code"><rect width="${n}" height="${n}" fill="#fff"/><path d="${path}" fill="#000"/></svg>`;
  };
})();
function pageUrl(){ return /^https?:/.test(location.protocol) ? location.origin + location.pathname : CONTENT.publishedUrl; }

function scoresHTML(active){

function renderConvert(){
  const c = cardById(S.deck[S.i]); if (!c){ S.phase = 'setup'; return render(); }
  const r = reader(), cv = conv(), st = stealer();
  const round = Math.floor(S.i / S.n) + 1, rounds = S.deck.length / S.n;
  let who = '', actions = '', status = '';
  if (S.step === 'read'){
    who = `<b>${esc(pname(r))}</b>, hold the phone and read the sentence in bold to <b>${esc(pname(cv))}</b>. Then tap whether ${esc(pname(cv))} got it right.`;
    actions = `<button class="btn good" data-act="j" data-o="conv">✓ Right</button><button class="btn" data-act="j" data-o="miss">✗ Not quite</button>`;
  } else if (S.step === 'steal'){
    who = `<b>${esc(pname(st))}</b>, you can steal the card: say the sentence with inversion. <b>${esc(pname(r))}</b> checks the answer.`;
    actions = `<button class="btn good" data-act="j" data-o="steal">✓ Right</button><button class="btn" data-act="j" data-o="keep">✗ Not quite</button>`;
  } else {
    const w = S.won[c.id];
    who = w === r ? `Nobody got it, so <b>${esc(pname(r))}</b> keeps the card.` : `<b>${esc(pname(w))}</b> wins the card!`;

    actions = `<button class="btn primary" data-act="next">${last ? 'See the results →' : 'Next card →'}</button><span></span>`;

  app.innerHTML = `

      <div class="sit"><span class="pill set">Set ${esc(c.set)}</span>${c.inf ? '<span class="pill inf">Informal</span>' : ''}<span class="s">${esc(c.sit)}</span></div>
      <p class="plain">${esc(c.plain)}</p>
      ${S.easy ? `<p class="start">Start with: ${esc(c.start)}</p>` : ''}

    <div class="row undo"><button class="btn ghost" data-act="undo"${S.history.length ? '' : ' disabled'}>↶ Undo</button></div>`;

      ${V.qr ? `<div class="qrbox">${QR(url) || ''}<span class="url">${esc(url)}</span></div>` : ''}</div>
    <div class="linkcard"><h3>Sound</h3><p>Short sounds for the timer.</p><button class="btn" style="min-width:8rem" data-act="sound">${P.sound ? 'Sound: on' : 'Sound: off'}</button></div>
    <div class="linkcard"><h3>Full screen</h3><p>You can also press F.</p><button class="btn" data-act="full">⛶ Full screen</button></div>`;
  V.last = 'settings';
}

/* ----- print ----- */
function buildPrint(){
  const foot = `<div class="pfoot"><span>${esc(CONTENT.title)} · B2.2</span><span>${esc(CONTENT.credit)}</span></div>`;
  const pages = [];
  for (const set of CONTENT.sets){
    const chunk = set.cards.map(c => ({ ...c, set: set.id }));
    pages.push(`<div class="pp"><h2>${esc(CONTENT.title)} · ${esc(set.name)}</h2><div class="pgrid">${chunk.map(c =>
      `<div class="pc"><div class="ps">${esc(c.id)} · ${esc(c.sit)}${c.inf ? ' · informal' : ''}</div><div class="pb">${esc(c.plain)}</div>${c.ans.map(a => `<div class="pa">${fmt(a)}</div>`).join('')}</div>`).join('')}</div>${foot}</div>`);
  }
  pages.push(`<div class="pp"><h2>${esc(CONTENT.title)} · Part 2: Say it like you mean it</h2><div class="pgrid sp">${CONTENT.prompts.map(p =>
    `<div class="pc"><div class="ps">${esc(p.id)}${p.inf ? ' · informal' : ''}</div><div class="pt">${esc(p.sit)}</div><div>Start with: <b>${esc(p.starter)}</b></div><div class="ps" style="margin-top:3mm">Plan for 1 minute. Speak for about 45 seconds. Listeners ask one follow-up question.</div></div>`).join('')}</div>${foot}</div>`);
  document.getElementById('print').innerHTML = pages.join('');
}
function doPrint(){ buildPrint(); try { window.print(); } catch(e){} }

/* ================= sound ================= */
let AC = null;
function tone(freq, dur = .12, type = 'sine', gain = .06, when = 0){
  if (!P.sound) return;
  try { AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const t = AC.currentTime + when, o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(gain, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g).connect(AC.destination); o.start(t); o.stop(t + dur + .02);
  } catch(e){}
}
const sfx = {
  win(){ [523, 659, 784].forEach((f, i) => tone(f, .16, 'triangle', .06, i * .07)); },
  tick(){ tone(880, .05, 'square', .03); },
  chime(){ [784, 988, 1175].forEach((f, i) => tone(f, .5, 'sine', .06, i * .16)); },
};

/* ================= wake lock ================= */
let lock = null;
async function keepAwake(on){ try { if (on && 'wakeLock' in navigator) lock = await navigator.wakeLock.request('screen'); else if (!on && lock){ await lock.release(); lock = null; } } catch(e){} }
document.addEventListener('visibilitychange', () => { if (!document.hidden && ['convert', 'speak'].includes(S.phase)) keepAwake(true); });

/* ================= saving ================= */
const store = {
  load(){ try { return JSON.parse(localStorage.getItem(KEY)); } catch(e){ return null; } },
  save(){ try { localStorage.setItem(KEY, JSON.stringify({ ...S, v: 1 })); } catch(e){} },
};
function save(){ store.save(); }
function savePrefs(){ try { localStorage.setItem(PKEY, JSON.stringify(P)); } catch(e){} }
// Accept saved data only in the expected shape.
function loadSaved(){
  const d = store.load(); if (!d || typeof d !== 'object' || d.v !== 1) return null;
  const ids = new Set(allCards().map(c => c.id)), pids = new Set(CONTENT.prompts.map(p => p.id));
  const n = [2, 3, 4].includes(d.n) ? d.n : 3;
  const g = freshState(Array.isArray(d.names) ? [0, 1, 2, 3].map(i => typeof d.names[i] === 'string' ? d.names[i].slice(0, 12) : '') : undefined);
  g.n = n;
  g.sets = Array.isArray(d.sets) ? d.sets.filter(s => CONTENT.sets.some(x => x.id === s)) : g.sets;
  g.easy = d.easy === true;
  if (Array.isArray(d.deck) && d.deck.length && d.deck.every(id => ids.has(id)) && d.deck.length % n === 0){
    g.deck = d.deck;
    g.i = Number.isInteger(d.i) && d.i >= 0 && d.i < d.deck.length ? d.i : 0;
    g.step = ['read', 'steal', 'done'].includes(d.step) ? d.step : 'read';
    if (d.won && typeof d.won === 'object') for (const [id, w] of Object.entries(d.won)) if (ids.has(id) && Number.isInteger(w) && w >= 0 && w < n) g.won[id] = w;
    if (['convert', 'end'].includes(d.phase)) g.phase = d.phase;
  }
  if (d.sp && Array.isArray(d.sp.order) && d.sp.order.length && d.sp.order.every(id => pids.has(id)) && d.sp.order.length % n === 0){
    g.sp = { order: d.sp.order, turn: Number.isInteger(d.sp.turn) && d.sp.turn >= 0 && d.sp.turn < d.sp.order.length ? d.sp.turn : 0 };
    if (['speak', 'speakEnd'].includes(d.phase)) g.phase = d.phase;
  }
  return g;
}
function loadPrefs(){ try { const p = JSON.parse(localStorage.getItem(PKEY)); if (p && typeof p.sound === 'boolean') P.sound = p.sound; } catch(e){} }

/* ================= events ================= */
function toggleFull(){ const d = document, el = d.documentElement; try { (d.fullscreenElement ? d.exitFullscreen() : el.requestFullscreen()).catch(() => {}); } catch(e){} }
let resumePhase = null;
document.addEventListener('input', e => {
  const i = e.target.dataset && e.target.dataset.name; if (i === undefined) return;
  S.names[+i] = e.target.value.slice(0, 12); save();
});
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act;
  if (a === 'n'){ S.n = +b.dataset.n; save(); render(); }
  else if (a === 'set'){ const id = b.dataset.id; S.sets = S.sets.includes(id) ? S.sets.filter(x => x !== id) : CONTENT.sets.map(s => s.id).filter(x => x === id || S.sets.includes(x)); save(); render(); }
  else if (a === 'easy'){ S.easy = !S.easy; save(); render(); }
  else if (a === 'start' || a === 'again'){ V.resumeOffer = false; startGame(); render(); scrollTo(0, 0); }
  else if (a === 'j'){ judge(b.dataset.o); if (['conv', 'steal'].includes(b.dataset.o)) sfx.win(); render(); }
  else if (a === 'undo'){ undo(); render(); }
  else if (a === 'next'){ nextCard(); render(); scrollTo(0, 0); }
  else if (a === 'review'){ S.phase = 'review'; render(); scrollTo(0, 0); }
  else if (a === 'backend'){ S.phase = 'end'; render(); scrollTo(0, 0); }
  else if (a === 'speakstart'){ V.resumeOffer = false; startSpeak(); render(); scrollTo(0, 0); }
  else if (a === 'nextsp'){ nextSpeaker(); render(); scrollTo(0, 0); }
  else if (a === 'tgo'){ timerToggle(); }
  else if (a === 'tswitch'){ timerReset(T.mode === 'plan' ? 'speak' : 'plan'); drawTimer(); }
  else if (a === 'setup'){ clearInterval(T.tick); T.running = false;
    if (['convert', 'speak', 'end', 'review', 'speakEnd'].includes(S.phase)){ resumePhase = S.phase === 'review' ? 'end' : S.phase; V.resumeOffer = true; }
    S.phase = 'setup'; render(); scrollTo(0, 0); }
  else if (a === 'resume'){ S.phase = resumePhase || 'setup'; V.resumeOffer = false; if (['convert', 'speak'].includes(S.phase)) keepAwake(true); render(); }
  else if (a === 'discard' || a === 'newgame'){ S = freshState(); V.resumeOffer = false; resumePhase = null; save(); render(); scrollTo(0, 0); }
  else if (a === 'print') doPrint();
  else if (a === 'settings'){ resumePhase = resumePhase || null; S.phase = 'settings'; render(); scrollTo(0, 0); }
  else if (a === 'qr'){ V.qr = !V.qr; render(); }
  else if (a === 'sound'){ P.sound = !P.sound; savePrefs(); render(); }
  else if (a === 'full') toggleFull();
});
document.addEventListener('keydown', e => {
  if (e.target.closest('input,textarea')) return;
  if (e.key === 'f' || e.key === 'F') toggleFull();
  else if (e.key === ' ' && S.phase === 'speak'){ e.preventDefault(); timerToggle(); }
});
window.addEventListener('beforeprint', buildPrint);

/* ================= start ================= */
loadPrefs();
(() => {
  const g = loadSaved();
  if (g){ const ph = g.phase; S = g;
    if (ph !== 'setup'){ resumePhase = ph; V.resumeOffer = true; S.phase = 'setup'; } }
})();
render();
</script>
