<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>Looking back: phrases for talking about the past</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,400;1,600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef3ff; --page:#ffffff; --ink:#1f2a44; --muted:#56627f; --line:#dbe3f6; --line-2:#c5d0ec;
  --blue:#3b5bdb; --blue-dark:#2742a8; --blue-soft:#e3e9ff;
  --sun:#ffd166; --coral:#ff8a7a; --sky:#7cc4ff; --lilac:#b9a4ff; --pink:#ff9ecd; --tang:#ffb26b;
  --gold:#f2b705; --gold-dark:#b88600;
  --ok:#1b8a4b; --ok-ink:#11592f; --ok-bg:#e4f6eb; --ok-line:#9ed8b6;
  --no:#d23b3b; --no-ink:#972121; --no-bg:#fdeaea;
  --f-fun:"Fredoka","Baloo 2","Trebuchet MS","Verdana",sans-serif;
  --f-body:"Nunito","Segoe UI","Helvetica Neue",Helvetica,sans-serif;
  --spring:cubic-bezier(.34,1.56,.64,1);
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px;
  color-scheme:light; --w:760px;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:90px;-webkit-text-size-adjust:100%}
body{margin:0;color:var(--ink);font-family:var(--f-body);font-size:1.0625rem;line-height:1.55;
  background-color:var(--bg);
  background-image:radial-gradient(rgba(59,91,219,.09) 1.4px, transparent 1.6px);
  background-size:22px 22px;}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:focus-visible,summary:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
em{font-style:italic}
.ipa{font-family:"Charis SIL","Doulos SIL","Lucida Sans Unicode","Segoe UI",sans-serif;font-style:normal}

/* ---------- Top bar ---------- */
.bar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-bottom:2px solid var(--line)}
.bar-in{max-width:var(--w);margin:0 auto;display:flex;align-items:center;gap:var(--s2);padding:var(--s2) var(--s3)}
.iconbtn{width:44px;height:44px;flex:none;border-radius:14px;border:2px solid var(--line);background:#fff;display:grid;place-items:center;box-shadow:0 3px 0 var(--line)}
.iconbtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.iconbtn svg{width:22px;height:22px}
.bar-title{flex:1;min-width:0;font-family:var(--f-fun);font-weight:600;font-size:1.08rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.score{flex:none;font-family:var(--f-fun);font-weight:600;font-size:.95rem;background:var(--sun);border-radius:999px;padding:6px 12px;box-shadow:0 3px 0 #e0b23e;white-space:nowrap}
.score.bump{animation:bump .45s var(--spring)}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.22)}100%{transform:scale(1)}}
.bankbtn{flex:none;font-family:var(--f-fun);font-weight:600;font-size:.98rem;background:var(--blue);color:#fff;border:0;border-radius:14px;padding:10px 12px;box-shadow:0 4px 0 var(--blue-dark);white-space:nowrap}
.bankbtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--blue-dark)}
.progress{height:6px;background:var(--blue-soft)}
.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--coral),var(--tang),var(--sun));border-radius:0 6px 6px 0;transition:width .5s var(--spring)}
@media (max-width:370px){.bankbtn .bt{display:none}}

/* ---------- Screen ---------- */
main{max-width:var(--w);margin:0 auto;padding:var(--s4) var(--s3) var(--s5)}
.enter > *{animation:rise .5s var(--spring) both}
.enter > *:nth-child(2){animation-delay:.08s}
.enter > *:nth-child(3){animation-delay:.16s}
.enter > *:nth-child(4){animation-delay:.24s}
.enter > *:nth-child(5){animation-delay:.32s}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
h1,h2,h3{font-family:var(--f-fun);font-weight:600;line-height:1.15;margin:0}
.lead{color:var(--muted);margin:var(--s2) 0 0;max-width:60ch}
.panel{background:var(--page);border:2px solid var(--line);border-radius:22px;padding:var(--s4);box-shadow:0 6px 0 var(--line)}
.stack > * + *{margin-top:var(--s4)}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);font-family:var(--f-fun);font-weight:600;font-size:1.12rem;background:var(--blue);color:#fff;border:0;border-radius:16px;padding:14px 22px;min-height:52px;box-shadow:0 5px 0 var(--blue-dark);transition:transform .08s, box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--blue-dark)}
.btn.wide{width:100%}
.btn.quiet{background:#fff;color:var(--blue-dark);border:2px solid var(--line-2);box-shadow:0 4px 0 var(--line-2);font-size:1rem;min-height:46px;padding:10px 18px}
.btn.quiet.armed{background:var(--no-bg);color:var(--no-ink);border-color:var(--no);box-shadow:0 4px 0 #f0b3b3}
.restart{display:flex;justify-content:center;margin-top:var(--s5)}

/* ---------- Stickers ---------- */
.stk{--size:56px;--r:0deg;width:var(--size);height:var(--size);border-radius:30%;display:grid;place-items:center;font-size:calc(var(--size)*.5);line-height:1;
  border:4px solid #fff;box-shadow:0 0 0 1.5px rgba(31,42,68,.12),0 4px 8px rgba(31,42,68,.18);transform:rotate(var(--r));position:relative}
.stk.shiny{border-color:var(--gold);box-shadow:0 0 0 2px #fff,0 0 0 4px var(--gold),0 4px 10px rgba(184,134,0,.35)}
.stk.shiny::after{content:"";position:absolute;inset:-4px;border-radius:30%;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.75) 50%,transparent 65%);background-size:250% 100%;animation:shine 5s ease-in-out infinite;pointer-events:none}
@keyframes shine{0%,70%{background-position:120% 0}100%{background-position:-120% 0}}
.stk.pop{animation:pop .7s var(--spring) both}
@keyframes pop{0%{transform:scale(.1) rotate(-40deg);opacity:0}60%{transform:scale(1.25) rotate(var(--r));opacity:1}100%{transform:scale(1) rotate(var(--r))}}
.c-sun{background:var(--sun)} .c-coral{background:var(--coral)} .c-sky{background:var(--sky)}
.c-lilac{background:var(--lilac)} .c-pink{background:var(--pink)} .c-tang{background:var(--tang)}
.slot{--size:56px;width:var(--size);height:var(--size);border-radius:30%;border:3px dashed var(--line-2);display:grid;place-items:center;font-family:var(--f-fun);font-weight:600;color:#93a0c2;background:rgba(255,255,255,.6)}
.slot.next{border-color:var(--blue);color:var(--blue);animation:breathe 4s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}

/* Album strip on the matching screen */
.album-strip{background:var(--page);border:2px solid var(--line);border-radius:20px;padding:var(--s3) var(--s4) var(--s4);box-shadow:0 5px 0 var(--line)}
.album-strip .lbl{display:flex;justify-content:space-between;align-items:baseline;gap:var(--s2);font-family:var(--f-fun);font-weight:600;margin-bottom:var(--s3)}
.album-strip .lbl{font-size:.98rem;line-height:1.25}
.album-strip .lbl small{font-family:var(--f-body);font-weight:700;color:var(--muted);font-size:.85rem;white-space:nowrap}
.slots{display:flex;justify-content:space-between;gap:var(--s2)}
.slots .slot,.slots .stk{--size:min(56px,15vw)}

/* Phrase card */
.phrase-card{position:relative;text-align:center;background:var(--page);border:2px solid var(--line);border-radius:26px;padding:var(--s5) var(--s4);box-shadow:0 7px 0 var(--line);overflow:hidden}
.phrase-card::before{content:"";position:absolute;width:120px;height:120px;border-radius:50%;right:-52px;top:-58px;background:var(--accent,var(--sun));opacity:.9}
.phrase-card::after{content:"";position:absolute;width:90px;height:90px;border-radius:50%;left:-42px;bottom:-50px;background:var(--accent2,var(--sky));opacity:.85}
.phrase-card > *{position:relative}
.phrase-card.fresh{animation:rise .45s var(--spring) both}
.steps{display:flex;justify-content:center;gap:var(--s2);margin-bottom:var(--s3)}
.chip{font-family:var(--f-fun);font-weight:600;font-size:.88rem;padding:4px 12px;border-radius:999px;background:#fff;border:2px solid var(--line-2);color:var(--muted)}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.chip.done{background:var(--ok-bg);border-color:var(--ok-line);color:var(--ok-ink)}
.phrase-big{font-family:var(--f-fun);font-weight:700;font-size:clamp(2rem,9vw,3rem);line-height:1.05;margin:var(--s2) 0 0;letter-spacing:-.01em}
.phrase-mean{margin:var(--s3) auto 0;max-width:36ch;font-weight:600;color:var(--muted);min-height:1.5em}
.phrase-mean.shown{color:var(--ink)}

.th{display:flex;justify-content:space-between;align-items:center;gap:var(--s2);font-family:var(--f-fun);font-weight:600;font-size:.9rem;color:var(--muted)}
.streak{color:#c2410c;background:#fff1e6;border-radius:999px;padding:2px 10px}
.tq{font-family:var(--f-fun);font-weight:600;font-size:1.15rem;margin:var(--s1) 0 var(--s3);line-height:1.25}
.opts{display:flex;flex-direction:column;gap:var(--s2)}
.opt{display:block;width:100%;text-align:left;background:#fff;border:2px solid var(--line-2);border-radius:16px;padding:12px 14px;min-height:50px;font-size:1.02rem;line-height:1.4;box-shadow:0 4px 0 var(--line-2);transition:transform .08s, box-shadow .08s}
.opt:active:not([disabled]){transform:translateY(3px);box-shadow:0 1px 0 var(--line-2)}
.opt.right{border-color:var(--ok);background:var(--ok-bg);color:var(--ok-ink);font-weight:700;box-shadow:0 4px 0 var(--ok-line)}
.opt.right::before{content:"✓";font-weight:800;margin-right:.45em}
.opt.wrong{border-color:var(--no);background:var(--no-bg);color:var(--no-ink);box-shadow:none;text-decoration:line-through;text-decoration-thickness:1.5px}
.opt.wrong::before{content:"✗";text-decoration:none;display:inline-block;margin-right:.45em}
.opt[disabled]{cursor:default}
.shake{animation:shake .32s ease}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
.tmsg{margin:var(--s3) 0 0;font-weight:700;color:var(--no-ink);min-height:0}
.tmsg:empty{display:none}
.fb{margin-top:var(--s3);border-radius:16px;padding:var(--s3) var(--s4);background:var(--ok-bg);border:2px solid var(--ok-line)}
.fb .label{font-family:var(--f-fun);font-weight:600;color:var(--ok-ink);font-size:1.08rem;display:block}
.fb p{margin:var(--s1) 0}
.fb.no{background:var(--no-bg);border-color:#f2b8b8}
.fb.no .label{color:var(--no-ink)}
.why{margin:var(--s2) 0 0;padding:0;list-style:none}
.why li{margin:var(--s2) 0 0;padding-left:1.3em;position:relative}
.why li::before{content:"✗";position:absolute;left:0;color:var(--no);font-weight:800}
.more{margin-top:var(--s3);display:grid;gap:var(--s2)}
.more div{background:#f6f8ff;border-radius:12px;padding:var(--s2) var(--s3)}
.more b{font-family:var(--f-fun);font-weight:600;display:block;font-size:.92rem;color:var(--blue-dark)}
.stk-note{display:flex;align-items:center;gap:var(--s3);margin-top:var(--s3);font-weight:700}
.stk-note .stk{--size:46px;flex:none}

/* ---------- Home ---------- */
.hero{position:relative;padding:var(--s5) var(--s1) var(--s2)}
.hero h1{font-size:clamp(2.6rem,12vw,4rem);font-weight:700;letter-spacing:-.02em;line-height:.95}
.hero h1 span{display:inline-block;transform:rotate(-3deg);background:var(--sun);padding:0 .18em;border-radius:12px;margin-top:.1em}
.hero .deco{position:absolute;right:4px;top:6px;font-size:clamp(3.2rem,15vw,5rem);transform:rotate(12deg);filter:drop-shadow(0 6px 6px rgba(31,42,68,.18))}
.album-page h2{font-size:1.25rem}
.album-page .count{color:var(--muted);font-weight:700;margin:var(--s1) 0 var(--s3)}
.grid15{display:grid;grid-template-columns:repeat(5,1fr);gap:var(--s3);justify-items:center}
.grid15 .slot,.grid15 .stk{--size:min(58px,14vw)}
.acts{display:grid;gap:var(--s3);margin-top:var(--s5)}
.album-page{margin-top:var(--s3)}
.act{display:flex;gap:var(--s4);align-items:center;text-align:left;width:100%;background:#fff;border:2px solid var(--line);border-radius:22px;padding:var(--s4);box-shadow:0 6px 0 var(--bar,var(--line));transition:transform .1s, box-shadow .1s;border-left:10px solid var(--bar,var(--line))}
.act:active{transform:translateY(4px);box-shadow:0 2px 0 var(--bar,var(--line))}
.act .em{font-size:2.3rem;flex:none;width:58px;height:58px;display:grid;place-items:center;border-radius:18px;background:var(--tint,#f3f5fb)}
.act h3{font-size:1.25rem}
.act p{margin:var(--s1) 0 0;color:var(--muted);font-size:.97rem;line-height:1.4}
.act .st{display:inline-block;margin-top:var(--s2);font-family:var(--f-fun);font-weight:600;font-size:.85rem;background:var(--tint,#f3f5fb);border-radius:999px;padding:2px 10px;color:var(--ink)}

/* ---------- Results ---------- */
.result{text-align:center}
.result h2{font-size:clamp(1.8rem,7vw,2.4rem)}
.stars{font-size:2.4rem;letter-spacing:.08em;margin:var(--s2) 0}
.stars .on{color:var(--gold);display:inline-block;animation:pop .6s var(--spring) both}
.stars .on:nth-child(2){animation-delay:.15s}.stars .on:nth-child(3){animation-delay:.3s}
.stars .off{color:#cfd7ec}
.result .big5{display:flex;justify-content:center;gap:var(--s2);margin:var(--s4) 0}
.result .big5 .stk{--size:min(64px,14vw)}
.result p{margin:var(--s2) auto;max-width:44ch}
.rows{display:grid;gap:var(--s2);margin-top:var(--s4);text-align:left}
.rows div{display:flex;justify-content:space-between;align-items:center;gap:var(--s3);background:#f6f8ff;border-radius:14px;padding:var(--s2) var(--s4);font-weight:700}
.rows .s{color:var(--gold);font-size:1.3rem;letter-spacing:.05em;white-space:nowrap}
.rows .s .off{color:#cfd7ec}

/* ---------- Situations ---------- */
.sit-head{display:flex;align-items:center;gap:var(--s3);margin-bottom:var(--s3)}
.sit-head .em{font-size:2rem;width:52px;height:52px;flex:none;display:grid;place-items:center;border-radius:16px;background:var(--tint)}
.sit-head small{display:block;font-family:var(--f-fun);font-weight:600;color:var(--muted);font-size:.85rem}
.sit-head h2{font-size:1.3rem}
.gap{display:inline-block;min-width:7.6em;text-align:center;font-family:var(--f-fun);font-weight:600;font-size:.92em;color:var(--muted);border-bottom:3px solid var(--line-2);padding:0 .2em;line-height:1.45;border-radius:6px 6px 0 0}
.gap.now{background:#fff1c2;border-bottom-color:#e8a500;color:#7a5200}
.gap.filled{min-width:0;padding:0;color:var(--ok-ink);font-family:inherit;font-size:1em;font-weight:800;border-bottom-color:var(--ok);background:none;border-radius:0}
.gap.filled.flash{animation:hilite 1.2s ease}
@keyframes hilite{0%{background:#c9f0d6}100%{background:transparent}}
.chat{display:flex;flex-direction:column;gap:var(--s2)}
.bubble{max-width:86%;padding:10px 14px;border-radius:20px;background:#f1f4fb}
.bubble.r{align-self:flex-end;background:var(--blue-soft);border-bottom-right-radius:6px}
.bubble.l{align-self:flex-start;border-bottom-left-radius:6px}
.bubble .who{display:block;font-family:var(--f-fun);font-weight:600;font-size:.82rem;color:var(--blue-dark)}
.bubble.l .who{color:#b4410b}
.bubble p{margin:0}
.email{border:2px solid var(--line);border-radius:16px;overflow:hidden}
.ehead{background:#f6f8ff;padding:var(--s2) var(--s4);font-size:.95rem;border-bottom:2px solid var(--line)}
.ehead div{display:flex;gap:var(--s2)}
.ehead span{font-family:var(--f-fun);font-weight:600;color:var(--muted);min-width:4.4rem}
.ebody{padding:var(--s1) var(--s4)}
.ebody p{margin:var(--s3) 0}
.dlg p{margin:var(--s3) 0}
.who-tag{display:inline-block;font-family:var(--f-fun);font-weight:600;font-size:.82rem;border-radius:999px;padding:1px 10px;margin-right:6px;vertical-align:1px;background:var(--tint,#eee)}
.leaflet{background:#fffaf0;border:3px dashed var(--tang);border-radius:18px;padding:var(--s4)}
.leaflet h3{font-size:1.5rem;color:#9a4b00}
.leaflet p{margin:var(--s3) 0}

/* ---------- Speaking ---------- */
.sp-grid{list-style:none;margin:0;padding:0;display:grid;gap:var(--s3)}
@media (min-width:640px){.sp-grid{grid-template-columns:1fr 1fr}}
.sp-card{background:#fff;border:2px solid var(--line);border-radius:20px;padding:var(--s4);box-shadow:0 5px 0 var(--line);border-top:8px solid var(--bar)}
.sp-card .n{font-family:var(--f-fun);font-weight:700;font-size:1.05rem;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--bar);margin-bottom:var(--s2)}
.sp-card p{margin:0;font-size:1.06rem}
.hl{background:none;border:0;padding:0;font-weight:800;color:var(--blue-dark);border-bottom:2px dotted var(--blue);font-size:inherit;line-height:inherit;text-align:inherit}
.might{margin-top:var(--s3)!important;padding-top:var(--s2);border-top:2px dashed var(--line);font-size:.97rem!important}
.might b{font-family:var(--f-fun);font-weight:600}

/* ---------- Word bank sheet ---------- */
.sheet{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center;background:rgba(31,42,68,.4)}
.sheet[hidden]{display:none}
.sheet-in{background:#fff;width:100%;max-width:var(--w);height:92vh;height:92dvh;border-radius:26px 26px 0 0;display:flex;flex-direction:column;animation:slideup .35s var(--spring)}
@keyframes slideup{from{transform:translateY(40%);opacity:.4}to{transform:none;opacity:1}}
.sheet-head{display:flex;align-items:center;gap:var(--s3);padding:var(--s3) var(--s4) var(--s2)}
.sheet-head h2{flex:1;font-size:1.45rem}
.tabs{display:flex;gap:var(--s2);overflow-x:auto;padding:var(--s1) var(--s4) var(--s3);border-bottom:2px solid var(--line);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;font-family:var(--f-fun);font-weight:600;font-size:.92rem;border:2px solid var(--line-2);background:#fff;border-radius:999px;padding:6px 11px}
.tab[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.sheet-body{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:var(--s3) var(--s4) calc(var(--s6) + env(safe-area-inset-bottom,0px))}
.sheet-body h3{font-size:1.15rem;margin:var(--s4) 0 var(--s2)}
.sheet-body > p{margin:var(--s2) 0;color:var(--muted)}
details.wb{border:2px solid var(--line);border-radius:16px;margin:var(--s2) 0;background:#fff}
details.wb[open]{border-color:var(--line-2);box-shadow:0 4px 0 var(--line)}
details.wb.hi{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
details.wb summary{display:flex;align-items:center;gap:var(--s3);padding:var(--s2) var(--s3);list-style:none;cursor:pointer}
details.wb summary::-webkit-details-marker{display:none}
details.wb summary .stk{--size:40px;border-width:3px;flex:none}
details.wb summary .t{flex:1;min-width:0}
details.wb summary .t b{font-family:var(--f-fun);font-weight:600;font-size:1.08rem;display:block;line-height:1.2}
details.wb summary .t span{color:var(--muted);font-size:.93rem;line-height:1.3;display:block}
details.wb summary::after{content:"+";font-family:var(--f-fun);font-weight:700;font-size:1.4rem;color:var(--blue)}
details.wb[open] summary::after{content:"–"}
.wb-body{padding:0 var(--s3) var(--s3);display:grid;gap:var(--s2)}
.wb-body div{background:#f6f8ff;border-radius:12px;padding:var(--s2) var(--s3)}
.wb-body b{font-family:var(--f-fun);font-weight:600;display:block;font-size:.9rem;color:var(--blue-dark)}
.frame{border:2px solid var(--line);border-radius:18px;padding:var(--s3) var(--s4);margin:var(--s3) 0;border-left:8px solid var(--bar,var(--sky))}
.frame h3{margin:0 0 var(--s1)!important}
.frame p{margin:var(--s1) 0}
.ex{list-style:none;margin:var(--s2) 0 0;padding:0}
.ex li{padding:3px 0 3px 1.6em;position:relative}

footer.credit{max-width:var(--w);margin:0 auto;padding:var(--s3) var(--s4) var(--s5);font-size:.85rem;color:var(--muted);font-weight:600;text-align:center}

@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(var(--rot));opacity:.9}}

.fresh{animation:rise .45s var(--spring) both}
.album-group + .album-group{margin-top:var(--s4)}

.post{border:2px solid var(--line);border-radius:18px;padding:var(--s3) var(--s4);background:#fff}

.rv-count{font-family:var(--f-fun);font-weight:600;color:var(--muted);font-size:.9rem}
.rv-label{font-family:var(--f-fun);font-weight:600;color:var(--muted);margin:0 0 var(--s1)}

.rv-score{font-family:var(--f-fun);font-weight:600;font-size:1.3rem}
.sec-h3{font-size:1.1rem;margin:var(--s4) 0 var(--s2);text-align:left}
.again{list-style:none;margin:0;padding:0;text-align:left;display:grid;gap:var(--s2)}

.a-col{min-width:0}
.ans{background:#fff;border:2px solid var(--line);border-radius:22px;padding:var(--s3) var(--s4) var(--s4);box-shadow:0 6px 0 var(--line)}
.fade{animation:fadein .3s ease both}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.opt.right::before{animation:tick .45s var(--spring) both}
@keyframes tick{0%{transform:scale(0)}100%{transform:scale(1)}}
.opt.static{cursor:default}
.next-row{margin-top:var(--s3)}
details.more-d{margin-top:var(--s3);border:2px solid var(--line);border-radius:14px;background:#fff}

details.more-d summary::-webkit-details-marker{display:none}

details.more-d .why{margin-top:0}
.sit-scroll{max-height:40vh;max-height:40dvh;overflow-y:auto;overscroll-behavior:contain;padding:2px 6px 2px 2px;margin:0 -6px 0 -2px;scrollbar-width:thin}

  .stage{gap:var(--s3)}

}
@media (max-width:899px) and (max-height:740px){
  .album-strip{display:none}

  .steps{margin-bottom:var(--s1)}
  .opt{padding:9px 12px;min-height:44px;font-size:.97rem}
  .tq{font-size:1.05rem;margin-bottom:var(--s2)}
  .sit-scroll{max-height:33vh;max-height:33dvh}
  .sit-head{margin-bottom:var(--s2)}
  .sit-head .em{width:40px;height:40px;font-size:1.5rem}

}

  :root{--w:1180px}
  body{font-size:1.1rem}
  .stage{grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:var(--s5);align-items:start}

  .opt{font-size:1.08rem}
  .sp-grid{grid-template-columns:1fr 1fr 1fr}
}

  .a-col{top:100px}
  .slots .slot,.slots .stk{--size:62px}

}

  *,*::before,*::after{animation:none!important;transition:none!important}
}

<script>

/* =========================================================
   Sessions and phrases
   ========================================================= */
const SESS = [
  {name:"Remembering and forgetting", ids:["bell","slip","stick","flooding","memories","lane","lookback","thinkback"]},
  {name:"People, places and time", ids:["brought","across","runinto","touch","endup","date","hindsight"]}
];

const P = [
 {id:"bell", phrase:"ring a bell",
  meaning:"to seem familiar, although you cannot remember exactly why",
  pattern:"The thing that seems familiar is the subject, and no person follows the verb: <em>That name rings a bell.</em> It is common in questions and negatives: <em>Does this place ring a bell? It doesn’t ring a bell.</em>",
  opts:["Her name rings a bell, but I can’t remember why.","Her name rings me a bell, but I can’t remember why.","I ring a bell with her name, but I can’t remember why."],
  why:"The name is the subject, and no person follows the verb. Spanish and Catalan speakers often add <em>me</em> because of <em>me suena</em> and <em>em sona</em>, but English does not."},
 {id:"slip", phrase:"slip your mind",
  meaning:"to be forgotten, usually something that you intended to do",
  pattern:"The thing you forgot is the subject: <em>Sorry, it completely slipped my mind.</em> It is a common and polite way of admitting that you forgot something.",
  opts:["Sorry, your birthday completely slipped my mind.","Sorry, I completely slipped my mind about your birthday.","Sorry, I completely slipped your birthday."],
  why:"The birthday is what slipped, so it is the subject. The person who forgot only appears in <em>my mind</em>."},
 {id:"stick", phrase:"stick in your mind",
  meaning:"to stay in your memory for a long time, usually because it was unusual or important",
  pattern:"The memory is the subject: <em>One thing that stuck in my mind was her laugh.</em> The verb is irregular: <em>stick, stuck, stuck</em>.",
  opts:["One thing that has always stuck in my mind is her laugh.","One thing that has always sticked in my mind is her laugh.","One thing that I have always stuck in my mind is her laugh."],
  why:"The past participle of <em>stick</em> is <em>stuck</em>, and the thing you remember is the subject of the verb, not the person who remembers it."},
 {id:"flooding", phrase:"come flooding back",
  meaning:"to return suddenly and very strongly, used about memories or feelings",
  pattern:"The memories are the subject, often <em>it all</em> or <em>everything</em>: <em>When I saw the house, it all came flooding back.</em> The word order is fixed.",
  opts:["When I walked into the classroom, it all came flooding back.","When I walked into the classroom, I came flooding back.","When I walked into the classroom, it all came back flooding."],
  why:"The memories come back, not the person, and <em>flooding</em> always goes between <em>come</em> and <em>back</em>.",
  say:'<em>flooding</em> <span class="ipa">/ˈflʌdɪŋ/</span>. The <em>oo</em> sounds like the <em>u</em> in <em>cup</em>.'},
 {id:"memories", phrase:"bring back memories",
  meaning:"to make you remember your past, used about a song, a smell, a place or an object",
  pattern:"The subject is the thing that causes the memories, such as a song, a smell or a place. The preposition is <em>of</em>: <em>This song brings back memories of our first holiday.</em>",
  opts:["This song brings back memories of our first holiday.","This song brings me back memories of our first holiday.","I bring back memories of our first holiday with this song."],
  why:"The song is what brings the memories back, so it is the subject. You can add <em>for me</em> at the end of the sentence, but you cannot put <em>me</em> after <em>brings</em>.",
  say:'<em>memories</em> <span class="ipa">/ˈmeməriz/</span>'},
 {id:"lane", phrase:"take a trip down memory lane",
  meaning:"to spend time enjoying memories of the past, for example by looking at old photos with other people",
  pattern:"<em>Take</em> or <em>go on</em> + <em>a trip down memory lane</em>. People are the subject. It is often used in a light, friendly way.",
  opts:["We looked at old photos and took a trip down memory lane.","We looked at old photos and made a trip down memory lane.","We looked at old photos and took a trip down the memory lane."],
  why:"The verb is <em>take</em> or <em>go on</em>, not <em>make</em>, and there is no article before <em>memory lane</em>, in the same way as with a street name."},
 {id:"lookback", phrase:"look back on",
  meaning:"to think about a period of your past and how you feel about it now",
  pattern:"<em>Look back on</em> + noun or <em>-ing</em> form, often with <em>with</em> + a feeling: <em>I look back on those years with affection.</em> When there is no object, start the sentence with <em>Looking back,</em>.",
  opts:["I look back on my school years with real affection.","I look back my school years with real affection.","I look back of my school years with real affection."],
  why:"You need <em>on</em> before the object, so all three words are necessary. If there is no object, use <em>Looking back,</em> at the start of the sentence."},
 {id:"thinkback", phrase:"think back to",
  meaning:"to try hard to remember one particular moment or event",
  pattern:"<em>Think back to</em> + a time or an event. It is often used as an instruction: <em>Think back to your first day at work.</em>",
  opts:["When I think back to my first job, I remember being terrified.","When I think back at my first job, I remember being terrified.","When I think my first job back, I remember being terrified."],
  why:"The usual particle before the time or event is <em>to</em>, and the object goes after it, never in the middle. Compare <em>look back on</em>, which has a similar meaning but different particles."},

 {id:"brought", phrase:"be brought up",
  meaning:"to be looked after and educated as a child by particular people or in a particular place",
  pattern:"<em>Be brought up</em> + <em>in</em> + a place, <em>by</em> + a person, or <em>to</em> + a verb: <em>I was brought up to say please.</em> In the active, the parents are the subject: <em>My grandparents brought me up.</em>",
  opts:["I was brought up by my grandparents in a small village.","I was grown up by my grandparents in a small village.","I brought up by my grandparents in a small village."],
  why:"<em>Grow up</em> has no passive: you grow up, but other people bring you up. The passive needs the verb <em>be</em>, so <em>was</em> cannot be left out.",
  say:'<em>brought</em> <span class="ipa">/brɔːt/</span>, which rhymes with <em>caught</em>',
  us:"Americans more often say <em>be raised</em>: <em>I was raised by my grandparents.</em> Both are understood everywhere."},
 {id:"across", phrase:"come across",
  meaning:"to find something by chance, especially an object or a piece of information",
  pattern:"<em>Come across</em> + object. The object always goes after <em>across</em>: <em>I came across it</em>, not <em>I came it across</em>. <em>Come across as</em> has a different meaning: to seem.",
  opts:["I came across some old letters while I was tidying the attic.","I came some old letters across while I was tidying the attic.","I came across with some old letters while I was tidying the attic."],
  why:"The object goes straight after <em>across</em>, with no extra preposition.",
  say:'<em>across</em> <span class="ipa">/əˈkrɒs/</span> in British English and <span class="ipa">/əˈkrɔːs/</span> in American English'},
 {id:"runinto", phrase:"run into",
  meaning:"to meet someone you know by chance",
  pattern:"<em>Run into</em> + a person, with the person after <em>into</em>. It describes one short event, so in a story it is usually in the past simple, with the past continuous for the background: <em>I was waiting for the train when I ran into my old teacher.</em>",
  opts:["I ran into an old classmate at the station last week.","I ran an old classmate into at the station last week.","I was running into an old classmate at the station last week."],
  why:"The person goes after <em>into</em>. Meeting someone is a short, complete event, so the past simple is used, not the past continuous.",
  us:"<em>Run into</em> is used in both varieties. British speakers also often say <em>bump into</em>, which has the same meaning."},
 {id:"touch", phrase:"lose touch with",
  meaning:"to stop being in contact with someone",
  pattern:"<em>Lose touch</em> (<em>with</em> + a person), with no article: <em>We lost touch after university.</em> The opposite is <em>keep in touch</em> or <em>stay in touch</em>.",
  opts:["We lost touch after she moved to Canada.","We lost the touch after she moved to Canada.","We lost in touch after she moved to Canada."],
  why:"There is no article before <em>touch</em>. <em>In</em> belongs to <em>keep in touch</em> and <em>get in touch</em>, not to <em>lose touch</em>.",
  say:'<em>touch</em> <span class="ipa">/tʌtʃ/</span>'},
 {id:"endup", phrase:"end up",
  meaning:"to be in a place or situation at the end of a process, usually without planning it",
  pattern:"<em>End up</em> + <em>-ing</em> form, <em>in</em> or <em>at</em> + a place, or <em>with</em> + a noun: <em>We ended up sleeping in the car.</em>",
  opts:["We got lost and ended up sleeping in the car.","We got lost and ended up to sleep in the car.","We got lost and ended up sleep in the car."],
  why:"When a verb follows <em>end up</em>, it is in the <em>-ing</em> form."},
 {id:"date", phrase:"date back to",
  meaning:"to have existed since a particular time in the past",
  pattern:"A building, tradition or object + <em>dates back to</em> + a date or period. It describes a state, so it is not used in the continuous. <em>Date from</em> has the same meaning.",
  opts:["The castle dates back to the twelfth century.","The castle is dating back to the twelfth century.","The castle dates back from the twelfth century."],
  why:"It describes a state, so the present simple is used. You can say <em>dates back to</em> or <em>dates from</em>, but not a mixture of the two."},
 {id:"hindsight", phrase:"in hindsight",
  meaning:"when you think about a past event later, knowing things that you did not know at the time",
  pattern:"Usually at the start of the sentence, often with <em>should have</em> or <em>could have</em> + past participle: <em>In hindsight, I should have accepted the job.</em>",

function streakHTML(){ return G.streak >= 3 ? '<span class="streak">🔥 '+G.streak+' in a row</span>' : ''; }
function setProgress(f){ $('#prog').style.width = Math.round(f*100) + '%'; }
function confetti(small){
  if(reduce) return;
  const box = document.createElement('div'); box.className = 'confetti';
  const cols = small ? ['#f2b705','#ffd166','#ffffff','#ffb26b'] : ['#ffd166','#ff8a7a','#7cc4ff','#b9a4ff','#ff9ecd','#ffb26b'];
  const n = small ? 18 : 46;
  for(let i=0;i<n;i++){
    const c = document.createElement('i');
    c.style.left = (small ? 35 + Math.random()*30 : Math.random()*100) + 'vw';
    c.style.background = cols[i % cols.length];
    c.style.setProperty('--dx', (Math.random()*180-90) + 'px');
    c.style.setProperty('--rot', (Math.random()*720-360) + 'deg');
    c.style.animationDelay = (Math.random()*0.3) + 's';
    box.appendChild(c);
  }
  document.body.appendChild(box);
  setTimeout(() => box.remove(), 2300);
}

/* =========================================================
   Answer panel: sits directly under the question (phones)
   or beside it (wide screens)
   ========================================================= */
function stage(qHTML){ return '<div class="stage"><div class="q-col">'+qHTML+'</div><div class="a-col"><div class="ans" id="ans"></div></div></div>'; }
function ansSet(html){ $('#ans').innerHTML = '<div class="fade">'+html+'</div>'; }
function head(left){ return '<div class="th"><span>'+left+'</span>'+streakHTML()+'</div>'; }
function nextBtn(label){ return '<div class="next-row"><button class="btn wide" id="go">'+label+'</button></div>'; }
function wireNext(fn){
  const b = $('#go'); if(!b) return;
  b.onclick = fn;
  requestAnimationFrame(() => {
    b.focus({preventScroll:true});
    const r = b.getBoundingClientRect();
    if(r.bottom > window.innerHeight - 8) b.scrollIntoView({block:'end', behavior: reduce ? 'auto' : 'smooth'});
  });
}
function markWrong(btn){
  btn.classList.add('wrong','shake'); btn.disabled = true;
  btn.addEventListener('animationend', () => btn.classList.remove('shake'), {once:true});
}
function more(summary, inner){ return '<details class="more-d"><summary>'+summary+'</summary><div class="md">'+inner+'</div></details>'; }

/* Keep the current gap visible inside the scrolling text box */
function keepGap(){
  const box = document.querySelector('.sit-scroll'), el = document.querySelector('[data-keep]');
  if(!box || !el) return;
  const br = box.getBoundingClientRect(), r = el.getBoundingClientRect();
  if(r.top >= br.top + 4 && r.bottom <= br.bottom - 4) return;
  box.scrollTo({top: box.scrollTop + (r.top - br.top) - br.height * 0.3, behavior: reduce ? 'auto' : 'smooth'});
}

/* Fade the bottom edge of the text box while there is more text below */
function scrollCue(){
  const box = document.querySelector('.sit-scroll'); if(!box) return;
  const upd = () => box.classList.toggle('more-below', box.scrollTop + box.clientHeight < box.scrollHeight - 4);
  box.onscroll = upd; upd();
}

/* Two-tap button */
function twoTap(btn, label, confirmLabel, fn){
  let armed = false, t;
  btn.onclick = e => {
    e.stopPropagation();
    if(armed){ clearTimeout(t); fn(); return; }
    armed = true; btn.classList.add('armed'); btn.textContent = confirmLabel;
    t = setTimeout(() => { armed = false; btn.classList.remove('armed'); btn.textContent = label; }, 3500);
  };
}

/* Results screen actions: the main next step and Play again */
function resultActions(mainLabel, mainFn){
  return '<div class="result-actions"><button class="btn" id="go">'+mainLabel+'</button><button class="btn quiet" id="again">Play this activity again</button></div>';
}
function wireResults(mainFn, againFn){
  $('#go').onclick = mainFn; $('#again').onclick = againFn;
  requestAnimationFrame(() => $('#go').focus({preventScroll:true}));
}

/* =========================================================
   Navigation
   ========================================================= */
const TITLES = {home:'Home', match:'Matching', ctx:'In context', speak:'Speaking', review:'Review', spot:'Mistakes'};
const MAKERS = {match:makeMatch, ctx:makeCtx, review:makeReview, spot:makeSpot};
const RENDER = {match:renderMatch, ctx:renderCtx, review:renderReview, spot:renderSpot};
function stKey(view, sess){ return (view === 'match' || view === 'ctx') ? view + sess : view; }
function go(view, sess, fresh){
  if(sess !== undefined) G.sess = sess;
  G.view = view; G.busy = false;
  $('#barTitle').textContent = TITLES[view];
  const scr = $('#screen');
  scr.classList.remove('enter'); void scr.offsetWidth; scr.classList.add('enter');
  if(view === 'home') renderHome();
  else if(view === 'speak') renderSpeak();
  else {
    const k = stKey(view, G.sess);
    if(fresh || !ST[k] || ST[k].done) ST[k] = MAKERS[view]();
    RENDER[view]();
  }
  clearTimeout(G.enterT); G.enterT = setTimeout(() => scr.classList.remove('enter'), 900);
  window.scrollTo(0, 0);
  requestAnimationFrame(keepGap);
}
function credit(show){ $('#credit').hidden = !show; }
$('#homeBtn').onclick = () => go('home');

  document.querySelectorAll('.act').forEach(b => b.onclick = () => go(b.dataset.view, +b.dataset.sess));

/* =========================================================
   Match and collect
   ========================================================= */
let M;
function makeMatch(){
  const ids = SESS[G.sess].ids;
  const m = {ids, queue:shuffle(ids), idx:0, mistTotal:0, shiny:0, done:false, started:false};
  matchPhrase(m); return m;
}
function matchPhrase(m){
  const cur = m.queue[m.idx];
  const pool = shuffle(m.ids.filter(id => id !== cur && !excluded(cur, id))).slice(0, 3);
  m.step = 'meaning'; m.mist = 0; m.usageMist = 0;
  m.opts = shuffle([cur, ...pool]);
  m.usageOrder = shuffle([0,1,2]);
}
function mCur(){ return M.queue[M.idx]; }
function matchStrip(popId){
  const got = M.ids.filter(id => SAVE.stickers[id]).length;
  return '<div class="album-strip" id="strip"><div class="lbl"><span>Session '+(G.sess+1)+' album</span><small>'+got+' of '+M.ids.length+' stickers</small></div><div class="slots" style="--n:'+M.ids.length+'">'+
    M.ids.map(id => SAVE.stickers[id] ? sticker(id, SAVE.stickers[id]==='shiny', id===popId?'pop':'') : '<span class="slot'+(id===mCur() && !M.done?' next':'')+'">?</span>').join('')+'</div></div>';
}
function matchCard(fresh){
  const p = byId(mCur()), col = G.sess === 0 ? ['sun','sky'] : ['lilac','tang'];
  const s1 = M.step === 'meaning' ? 'on' : 'done', s2 = M.step === 'usage' ? 'on' : M.step === 'done' ? 'done' : '';
  return '<div class="phrase-card'+(fresh?' fresh':'')+'" id="pcard" style="--accent:var(--'+col[0]+');--accent2:var(--'+col[1]+')">'+
    '<div class="steps"><span class="chip '+s1+'">1 Meaning</span><span class="chip '+s2+'">2 Usage</span><span class="chip count">'+(M.idx+1)+' of '+M.ids.length+'</span></div>'+
    '<p class="phrase-big">'+p.phrase+'</p>'+
    (M.step!=='meaning' ? '<p class="phrase-mean shown">'+cap(p.meaning)+'.</p>' : '')+'</div>';
}
function matchProgress(){ setProgress((M.idx + (M.step==='done'?1:0)) / M.ids.length); }
function renderMatch(fresh){
  M = ST[stKey('match', G.sess)];
  matchProgress();
  if(M.done){
    credit(true);
    const st = M.mistTotal === 0 ? 3 : M.mistTotal <= 3 ? 2 : 1;
    $('#screen').innerHTML = '<div class="home-wrap"><div class="panel result"><h2>Session '+(G.sess+1)+' page complete</h2>'+
      '<div class="stars" aria-label="'+st+' of 3 stars">'+stars(st)+'</div>'+
      '<div class="big8">'+M.ids.map(id => sticker(id, SAVE.stickers[id]==='shiny')).join('')+'</div>'+
      '<p>Stickers with a gold edge in this round: '+M.shiny+' of '+M.ids.length+'. A sticker has a gold edge when both steps were right at the first attempt. A gold edge stays in your album even if you play again.</p>'+
      resultActions('Go to In context')+'</div></div>';
    wireResults(() => go('ctx'), () => go('match', G.sess, true));
    if(st === 3) confetti();
    return;
  }
  credit(false);
  $('#screen').innerHTML = stage(matchStrip() + '<div style="height:var(--s3)"></div>' + matchCard(fresh));
  if(M.step === 'done') matchDoneAns(false); else matchAns();
}
function matchAns(){
  const p = byId(mCur()), h = streakHTML() ? '<div class="th"><span></span>'+streakHTML()+'</div>' : '';
  if(M.step === 'meaning'){
    ansSet(h + '<p class="tq">Which meaning matches <em>'+p.phrase+'</em>?</p><div class="opts">'+
      M.opts.map(id => '<button class="opt" data-id="'+id+'">'+cap(byId(id).meaning)+'.</button>').join('')+
      '</div><p class="tmsg" aria-live="polite"></p>');
    document.querySelectorAll('#ans .opt').forEach(b => b.onclick = () => matchMeaning(b));
  } else {
    ansSet(h + '<p class="tq">Which sentence uses <em>'+p.phrase+'</em> correctly?</p><div class="opts">'+
      M.usageOrder.map(i => '<button class="opt" data-i="'+i+'">'+p.opts[i]+'</button>').join('')+
      '</div><p class="tmsg" aria-live="polite"></p>');
    document.querySelectorAll('#ans .opt').forEach(b => b.onclick = () => matchUsage(b));
  }
}
function matchMeaning(btn){
  if(G.busy || btn.disabled) return;
  M.started = true;
  if(btn.dataset.id === mCur()){
    G.busy = true;
    addPoints(M.mist === 0);
    btn.classList.add('right');
    document.querySelectorAll('#ans .opt').forEach(b => b.disabled = true);
    $('#ans .tmsg').textContent = '';
    setTimeout(() => { M.step = 'usage'; $('#pcard').outerHTML = matchCard(); matchAns(); G.busy = false; }, 650);
  } else {
    M.mist++; M.mistTotal++; missed(); markWrong(btn);
    $('#ans .tmsg').textContent = 'Not correct here. Try another meaning.';
  }
}
function matchUsage(btn){
  if(G.busy || btn.disabled) return;
  const p = byId(mCur());
  if(btn.dataset.i !== '0'){
    M.usageMist++; M.mist++; M.mistTotal++; missed(); markWrong(btn);
    $('#ans .tmsg').textContent = 'Not correct here. Read the sentences again and try another one.';
    return;
  }
  addPoints(M.usageMist === 0);
  const shiny = M.mist === 0;
  if(shiny) M.shiny++;
  giveSticker(p.id, shiny);
  M.step = 'done'; M.lastShiny = shiny;
  matchProgress();
  $('#strip').outerHTML = matchStrip(p.id);
  $('#pcard').outerHTML = matchCard();
  matchDoneAns(true);
  if(shiny) setTimeout(() => confetti(true), 150);
}
function matchDoneAns(pop){
  const p = byId(mCur()), shiny = M.lastShiny;
  let extra = '<div class="more"><div><b>How it is used</b>'+p.pattern+'</div>';
  if(p.say) extra += '<div><b>Pronunciation</b>'+p.say+'</div>';
  if(p.us) extra += '<div><b>UK and US</b>'+p.us+'</div>';
  extra += '</div>';
  const last = M.idx === M.ids.length - 1;
  ansSet('<div class="opt right static">'+p.opts[0]+'</div>'+
    '<div class="fb" aria-live="polite"><span class="label">Correct</span><p>'+p.why+'</p>'+
    '<div class="stk-note">'+sticker(p.id, shiny, pop?'pop':'')+'<span>'+(shiny ? 'Both steps were right at the first attempt, so this sticker has a gold edge.' : 'This sticker is now in your album.')+'</span></div></div>'+
    nextBtn(last ? 'Finish the page' : 'Next phrase')+
    more('More about this phrase', extra));
  wireNext(() => {
    if(!last){ M.idx++; matchPhrase(M); renderMatch(true); window.scrollTo({top:0}); }
    else { M.done = true; markDone('s'+(G.sess+1)+'match'); renderMatch(); window.scrollTo(0,0); }
  });
}

/* =========================================================
   In context
   ========================================================= */
let C;
function makeCtx(){
  const sits = SIT[G.sess];
  const c = {sits, s:0, g:0, mist:sits.map(() => 0), first:0, total:sits.reduce((n,s) => n + s.gaps.length, 0), doneGaps:0, done:false, started:false};
  ctxGap(c); return c;
}
function ctxGap(c){
  const gap = c.sits[c.s].gaps[c.g];
  c.opts = shuffle([gap.ans, gap.wrong[0][0], gap.wrong[1][0]]);
  c.solved = false; c.miss = false;
}
function gapText(t, sit){
  return t.replace(/\{(\d)\}/g, (m, n) => {
    n = +n;
    const keep = n === C.g ? ' data-keep="1"' : '';
    if(n < C.g || (n === C.g && C.solved)) return '<span class="gap filled" data-g="'+n+'"'+keep+'>'+sit.gaps[n].ans+'</span>';
    return '<span class="gap'+(n===C.g?' now':'')+'" data-g="'+n+'"'+keep+'>'+(n+1)+'</span>';
  });
}
function sitHTML(fresh){
  const sit = C.sits[C.s];
  let body = '';
  if(sit.type === 'chat'){
    body = '<div class="chat">'+sit.blocks.map(b => '<div class="bubble '+b.side+'"><span class="who">'+b.who+'</span><p>'+gapText(b.t, sit)+'</p></div>').join('')+'</div>';
  } else if(sit.type === 'email'){
    body = '<div class="email"><div class="ehead"><div><span>From</span>'+sit.head.from+'</div><div><span>To</span>'+sit.head.to+'</div><div><span>Subject</span>'+sit.head.subject+'</div></div><div class="ebody">'+
      sit.blocks.map(b => '<p>'+gapText(b.t, sit)+'</p>').join('')+'</div></div>';
  } else if(sit.type === 'post'){
    body = '<div class="post"><div class="post-head"><span class="avatar" aria-hidden="true">'+sit.head.author.charAt(0)+'</span><div><b>'+sit.head.author+'</b><small>posted in '+sit.head.group+'</small></div></div>'+
      sit.blocks.map(b => '<p>'+gapText(b.t, sit)+'</p>').join('')+'<div class="post-foot" aria-hidden="true">❤️ 24 &nbsp; 💬 9 comments</div></div>';
  } else if(sit.type === 'leaflet'){
    body = '<div class="leaflet"><h3>'+sit.title+'</h3>'+sit.blocks.map(b => '<p>'+gapText(b.t, sit)+'</p>').join('')+'</div>';
  } else {
    const who = [...new Set(sit.blocks.map(b => b.who))], tints = ['#fff1c2','#e3f1ff'];
    body = '<div class="dlg">'+sit.blocks.map(b => '<p><span class="who-tag" style="--tint:'+tints[who.indexOf(b.who)]+'">'+b.who+'</span>'+gapText(b.t, sit)+'</p>').join('')+'</div>';
  }
  return '<div class="panel'+(fresh?' fresh':'')+'" id="sit"><div class="sit-head"><span class="em" style="--tint:'+sit.tint+'" aria-hidden="true">'+sit.emoji+'</span><div><small>Situation '+(C.s+1)+' of '+C.sits.length+'</small><h2>'+sit.kind+'</h2></div></div><div class="sit-scroll">'+body+'</div></div>';
}
function ctxProgress(){ setProgress(C.done ? 1 : (C.doneGaps + (C.solved?1:0)) / C.total); }
function starsCtx(m){ return m === 0 ? 3 : m === 1 ? 2 : 1; }
function renderCtx(fresh){
  C = ST[stKey('ctx', G.sess)];
  ctxProgress();
  if(C.done){
    credit(true);
    $('#screen').innerHTML = '<div class="home-wrap"><div class="panel result"><h2>All three situations complete</h2>'+
      '<div class="rows">'+C.sits.map((s,i) => '<div><span>'+s.emoji+' '+s.kind+'</span><span class="s" aria-label="'+starsCtx(C.mist[i])+' of 3 stars">'+stars(starsCtx(C.mist[i]))+'</span></div>').join('')+'</div>'+
      '<p>Gaps right at the first attempt: '+C.first+' of '+C.total+'.</p>'+resultActions('Go to Speaking')+'</div></div>';
    wireResults(() => go('speak'), () => go('ctx', G.sess, true));
    confetti();
    return;
  }
  credit(false);
  $('#screen').innerHTML = stage(sitHTML(fresh));
  if(C.solved) ctxSolvedAns(); else ctxAns();
  requestAnimationFrame(() => { keepGap(); scrollCue(); });
}
function ctxAns(){
  const n = C.sits[C.s].gaps.length;
  ansSet(head('Gap '+(C.g+1)+' of '+n)+'<p class="tq">Which phrase fits gap '+(C.g+1)+'?</p><div class="opts">'+
    C.opts.map(o => '<button class="opt" data-o="'+escAttr(o)+'">'+o+'</button>').join('')+
    '</div><div class="tmsg-wrap" aria-live="polite"></div>');
  document.querySelectorAll('#ans .opt').forEach(b => b.onclick = () => ctxPick(b));
}
function ctxSolvedAns(){
  const gap = C.sits[C.s].gaps[C.g], n = C.sits[C.s].gaps.length;
  const lastGap = C.g === n - 1, lastSit = C.s === C.sits.length - 1;
  ansSet(head('Gap '+(C.g+1)+' of '+n)+
    '<div class="opt right static">'+gap.ans+'</div>'+
    '<div class="fb" aria-live="polite"><span class="label">Correct</span><p>'+gap.note+'</p></div>'+
    nextBtn(!lastGap ? 'Next gap' : (!lastSit ? 'Next situation' : 'See your results'))+
    more('Why not the other options?', '<ul class="why">'+gap.wrong.map(w => '<li>'+w[1]+'</li>').join('')+'</ul>'));
  wireNext(ctxNext);
}
function ctxPick(btn){
  if(G.busy || btn.disabled || C.solved) return;
  C.started = true;
  const gap = C.sits[C.s].gaps[C.g], o = btn.dataset.o;
  if(o === gap.ans){
    C.solved = true;
    addPoints(!C.miss);
    if(!C.miss) C.first++;
    ctxProgress();
    const el = document.querySelector('#sit .gap[data-g="'+C.g+'"]');
    el.className = 'gap filled flash'; el.textContent = gap.ans;
    ctxSolvedAns();
    requestAnimationFrame(keepGap);
  } else {
    C.miss = true; C.mist[C.s]++; missed(); markWrong(btn);
    const w = gap.wrong.find(x => x[0] === o);
    $('#ans .tmsg-wrap').innerHTML = '<div class="fb no"><span class="label">Not correct here</span><p>'+w[1]+'</p></div>';
  }
}
function ctxNext(){
  const n = C.sits[C.s].gaps.length;
  C.doneGaps++;
  if(C.g < n - 1){
    const old = document.querySelector('#sit [data-keep]'); if(old) old.removeAttribute('data-keep');
    C.g++; ctxGap(C);
    const el = document.querySelector('#sit .gap[data-g="'+C.g+'"]');
    el.className = 'gap now'; el.setAttribute('data-keep', '1');
    ctxProgress(); ctxAns();
    if(!wide()) $('#sit').scrollIntoView({block:'start', behavior: reduce ? 'auto' : 'smooth'});
    requestAnimationFrame(keepGap);
  } else if(C.s < C.sits.length - 1){
    C.s++; C.g = 0; ctxGap(C); renderCtx(true); window.scrollTo(0, 0);
  } else {
    C.done = true; markDone('s'+(G.sess+1)+'ctx'); renderCtx(); window.scrollTo(0, 0);
  }
}

/* =========================================================
   Quick review (Session 1 phrases, start of Session 2)
   ========================================================= */
let R;
function makeReview(){ const r = {items:shuffle(REVIEW), i:0, first:0, done:false, started:false}; reviewItem(r); return r; }
function reviewItem(r){ const it = r.items[r.i]; r.order = shuffle(it.opts.map((_,k) => k)); r.solved = false; r.miss = false; }
function renderReview(fresh){
  R = ST.review;
  if(R.solved && !R.done){ R.i++; if(R.i >= R.items.length){ R.done = true; markDone('s2review'); } else reviewItem(R); }
  setProgress(R.done ? 1 : R.i / R.items.length);
  if(R.done){
    credit(true);
    const ids = SESS[0].ids;
    $('#screen').innerHTML = '<div class="home-wrap"><div class="panel result"><h2>Review complete</h2>'+
      '<p class="rv-score">Right at the first attempt: '+R.first+' of '+R.items.length+'</p>'+
      '<div class="big8">'+ids.map(id => SAVE.stickers[id] ? sticker(id, SAVE.stickers[id]==='shiny') : '<span class="slot">?</span>').join('')+'</div>'+
      '<p>These are the phrases from Session 1. Now you are ready for the new ones.</p>'+resultActions('Go to Match and collect')+'</div></div>';
    wireResults(() => go('match', 1), () => go('review', 1, true));
    if(R.first === R.items.length) confetti();
    return;
  }
  credit(false);
  const it = R.items[R.i];
  let prompt = '';
  if(it.type === 'gap') prompt = '<p class="rv-label">Complete the sentence.</p><p class="rv-text">'+it.text.replace('{0}', '<span class="gap now">…</span>')+'</p>';
  if(it.type === 'meaning') prompt = '<p class="rv-label">Which phrase has this meaning?</p><p class="rv-text">'+cap(it.text)+'.</p>';
  if(it.type === 'sentence') prompt = '<p class="rv-label">Which sentence is correct?</p><p class="rv-text rv-small">Read all three sentences carefully before you choose.</p>';
  $('#screen').innerHTML = stage('<div class="panel review-card'+(fresh?' fresh':'')+'" id="rcard"><div class="rv-top"><span class="rv-badge">🔁 Session 1 review</span><span class="rv-count">Question '+(R.i+1)+' of '+R.items.length+'</span></div>'+prompt+'</div>');
  ansSet(head('Question '+(R.i+1)+' of '+R.items.length)+'<p class="tq">Choose the answer.</p><div class="opts">'+
    R.order.map(k => '<button class="opt" data-k="'+k+'">'+it.opts[k]+'</button>').join('')+'</div><p class="tmsg" aria-live="polite"></p>');
  document.querySelectorAll('#ans .opt').forEach(b => b.onclick = () => reviewPick(b));
}
function reviewPick(btn){
  if(btn.disabled || R.solved) return;
  R.started = true;
  const it = R.items[R.i];
  if(+btn.dataset.k === it.ans){
    R.solved = true; addPoints(!R.miss); if(!R.miss) R.first++;
    const g = document.querySelector('#rcard .gap');
    if(g){ g.className = 'gap filled flash'; g.textContent = it.opts[it.ans]; }
    const last = R.i === R.items.length - 1;
    ansSet(head('Question '+(R.i+1)+' of '+R.items.length)+
      '<div class="opt right static">'+it.opts[it.ans]+'</div>'+
      '<div class="fb" aria-live="polite"><span class="label">Correct</span><p>'+it.why+'</p></div>'+nextBtn(last ? 'See your results' : 'Next question'));
    wireNext(() => {
      if(!last){ renderReview(true); window.scrollTo(0,0); }
      else { R.done = true; markDone('s2review'); renderReview(); window.scrollTo(0,0); }
    });
  } else {
    R.miss = true; missed(); markWrong(btn);
    $('#ans .tmsg').textContent = 'Not correct here. Try another answer.';
  }
}

/* =========================================================
   Spot the mistake (all fifteen phrases)
   ========================================================= */
let S;
function makeSpot(){ return {items:shuffle(SPOT), i:0, right:0, missed:[], answered:false, done:false, started:false}; }
function renderSpot(fresh){
  S = ST.spot;
  if(S.answered && !S.done){ S.i++; S.answered = false; if(S.i >= S.items.length){ S.done = true; markDone('spot'); } }
  setProgress(S.done ? 1 : S.i / S.items.length);
  if(S.done){
    credit(true);
    $('#screen').innerHTML = '<div class="home-wrap"><div class="panel result"><h2>All eighteen sentences checked</h2>'+
      '<p class="rv-score">Right decisions: '+S.right+' of '+S.items.length+'</p>'+
      (S.missed.length ? '<h3 class="sec-h3">Sentences to look at again</h3><ul class="again">'+S.missed.map(it =>
        '<li><span class="'+(it.ok?'y':'n')+'">'+it.s+'</span>'+(it.ok ? '<small>This sentence is correct.</small>' : '<small>Correct version: <b>'+it.fix+'</b></small>')+'</li>').join('')+'</ul>'
        : '<p>You made the right decision about every sentence.</p>')+resultActions('Back to the start screen')+'</div></div>';
    wireResults(() => go('home'), () => go('spot', 0, true));
    if(!S.missed.length) confetti();
    return;
  }
  credit(false);
  const it = S.items[S.i];
  $('#screen').innerHTML = stage('<div class="panel spot-card'+(fresh?' fresh':'')+'" id="scard"><div class="rv-top"><span class="rv-badge spot">🔎 Spot the mistake</span><span class="rv-count">Sentence '+(S.i+1)+' of '+S.items.length+'</span></div>'+
    '<p class="spot-s" id="spotS">'+it.s+'</p></div>');
  S.answered = false;
  ansSet(head('Sentence '+(S.i+1)+' of '+S.items.length)+'<p class="tq">Is this sentence correct?</p><div class="opts">'+
    '<button class="opt big" data-a="1">The sentence is correct</button><button class="opt big" data-a="0">The sentence has a mistake</button></div>');
  document.querySelectorAll('#ans .opt').forEach(b => b.onclick = () => spotPick(b));
}
function spotPick(btn){
  if(S.answered) return;
  S.answered = true; S.started = true;
  const it = S.items[S.i], said = btn.dataset.a === '1', good = said === it.ok;
  if(good){ S.right++; addPoints(true); } else { S.missed.push(it); missed(); }
  if(!it.ok) $('#spotS').innerHTML = '<span class="was">'+it.s+'</span><span class="fixed">'+it.fix+'</span>';
  else $('#spotS').classList.add('ok');
  const last = S.i === S.items.length - 1;
  ansSet(head('Sentence '+(S.i+1)+' of '+S.items.length)+
    '<div class="opt static '+(good?'right':'wrong')+'">'+btn.textContent+'</div>'+
    '<div class="fb'+(good?'':' no')+'" aria-live="polite"><span class="label">'+(good?'Your answer is correct':'Your answer is not correct')+'</span>'+
    '<p>'+(it.ok ? 'This sentence is correct. ' : 'This sentence has a mistake. ')+it.why+'</p></div>'+nextBtn(last ? 'See your results' : 'Next sentence'));
  wireNext(() => {
    if(!last){ renderSpot(true); window.scrollTo(0,0); }
    else { S.done = true; markDone('spot'); renderSpot(); window.scrollTo(0,0); }
  });
}

/* =========================================================
   Speaking
   ========================================================= */
const SP_COL = ['var(--sun)','var(--sky)','var(--pink)','var(--lilac)','var(--tang)','var(--coral)'];
function linkify(t){
  return t.replace(/\[\[([^|\]]+)\|([^\]]+)\]\]/g, (m, id, txt) =>
    id.startsWith('g:') ? '<button class="hl" data-g="'+id.slice(2)+'">'+txt+'</button>' : '<button class="hl" data-ph="'+id+'">'+txt+'</button>');
}
function renderSpeak(){
  setProgress(0); credit(true);
  const list = SPEAK[G.sess];
  $('#screen').innerHTML =
    '<div><p class="rv-badge" style="display:inline-block;margin:0 0 var(--s2)">Session '+(G.sess+1)+': '+SESS[G.sess].name+'</p><h2 style="font-size:clamp(1.7rem,7vw,2.3rem)">Talk about your past</h2>'+
    '<p class="lead">Work in pairs or small groups and choose questions to ask each other. Try to use the phrases from this session in your answers, as well as <em>used to</em> and <em>would</em> for past habits. Tap an underlined phrase to see it in the word bank.</p></div>'+
    '<ol class="sp-grid" style="margin-top:var(--s4)">'+list.map((s,i) =>
      '<li class="sp-card" style="--bar:'+SP_COL[i % SP_COL.length]+'"><span class="n">'+(i+1)+'</span><p>'+linkify(s.q)+'</p>'+
      (s.might ? '<p class="might"><b>You might use:</b> <em>'+s.might+'</em></p>' : '')+'</li>').join('')+'</ol>'+
    '<div class="result-actions"><button class="btn" id="spHome">Back to the start screen</button></div>';
  document.querySelectorAll('.hl').forEach(b => b.onclick = () => b.dataset.ph ? openBank('phrases', b.dataset.ph) : openBank('grammar', null, b.dataset.g));
  $('#spHome').onclick = () => go('home');
}

/* =========================================================
   Word bank
   ========================================================= */
const bank = $('#bank'), bankBody = $('#bankBody');
let bankTab = 'phrases', bankReturn = null;
const BANK_CREDIT = '<p class="bank-credit">Class of Coffee – with AI assistance</p>';
function bankHTML(tab){
  if(tab === 'phrases'){
    return '<p>All fifteen phrases from both sessions. Tap a phrase to see how it is used.</p>' + SESS.map((s, si) =>
      '<h3>Session '+(si+1)+': '+s.name+'</h3>' + s.ids.map(id => {
        const p = byId(id);
        let body = '<div><b>How it is used</b>'+p.pattern+'</div><div><b>Example</b><em>'+p.opts[0]+'</em></div>';
        if(p.say) body += '<div><b>Pronunciation</b>'+p.say+'</div>';
        if(p.us) body += '<div><b>UK and US</b>'+p.us+'</div>';
        return '<details class="wb" id="wb-'+p.id+'"><summary>'+sticker(p.id, false)+'<span class="t"><b>'+p.phrase+'</b><span>'+cap(p.meaning)+'.</span></span></summary><div class="wb-body">'+body+'</div></details>';
      }).join('')).join('') + BANK_CREDIT;
  }
  if(tab === 'grammar'){
    return '<p>The patterns that cause most mistakes with these phrases.</p>' + GRAMMAR.map(g =>
      '<div class="frame" id="gr-'+g.id+'" style="--bar:'+g.bar+'"><h3>'+g.title+'</h3><p>'+g.text+'</p><ul class="ex">'+
      g.ex.map(e => '<li class="'+e[0]+'">'+e[1]+'</li>').join('')+'</ul></div>').join('') + BANK_CREDIT;
  }
  if(tab === 'talk'){
    return '<p>Phrases that help you to talk about memories and keep a conversation going.</p><ul class="say-list">'+
      TALK.map(t => '<li><b>'+t[0]+'</b><span>'+t[1]+'</span></li>').join('')+'</ul>' + BANK_CREDIT;
  }
  return '<p>Your coursebook uses British English. These are the differences you will meet in these sessions.</p><div class="ukus">'+
    UKUS.map(r => '<div class="row"><div class="pair"><div><small>British English</small><b>'+r[0]+'</b></div><div><small>American English</small><b>'+r[1]+'</b></div></div>'+(r[2]?'<div class="note">'+r[2]+'</div>':'')+'</div>').join('')+'</div>' + BANK_CREDIT;
}
function setTab(tab){
  bankTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', t.dataset.tab === tab ? 'true' : 'false'));
  bankBody.innerHTML = bankHTML(tab);
  bankBody.scrollTop = 0;
}
function openBank(tab, phraseId, gramId){
  bankReturn = document.activeElement;
  bank.hidden = false;
  document.body.style.overflow = 'hidden';
  setTab(tab || bankTab);
  const target = phraseId ? $('#wb-'+phraseId) : gramId ? $('#gr-'+gramId) : null;
  if(target){
    if(phraseId){ target.open = true; target.classList.add('hi'); }
    requestAnimationFrame(() => target.scrollIntoView({block:'start'}));
  }
  $('#bankClose').focus({preventScroll:true});
}
function closeBank(){
  bank.hidden = true;
  document.body.style.overflow = '';
  if(bankReturn && document.contains(bankReturn)) bankReturn.focus({preventScroll:true});
}
$('#bankBtn').onclick = () => openBank();
$('#bankClose').onclick = closeBank;
bank.addEventListener('click', e => { if(e.target === bank) closeBank(); });
document.addEventListener('keydown', e => { if(e.key === 'Escape' && !bank.hidden) closeBank(); });
document.querySelectorAll('.tab').forEach(t => t.onclick = () => setTab(t.dataset.tab));

/* =========================================================
   Start
   ========================================================= */
showScore();
if(SESS[0].ids.every(id => SAVE.stickers[id])) G.homeTab = 1;
go('home');
</script>
</body>
</html>
