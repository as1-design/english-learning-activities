<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Escape from Wraithmoor Manor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0a10; --bg2:#15121d; --panel:#1d1826; --panel2:#262033; --line:#3a3148;
  --ink:#ece4d4; --muted:#a99fb5; --gold:#e8b04b; --gold2:#f6d48a; --blood:#c8433b;
  --ok:#7fc77a; --ghost:#9fd3e6; --paper:#efe3c6; --paperInk:#2b2116;
  --manner:#e8b04b; --time:#9fd3e6; --place:#c39be8; --freq:#7fc77a; --degree:#e98a7d;
  --serif:"IM Fell English", Georgia, serif; --title:"Cinzel", Georgia, serif;
  --sans:system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.5;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-2;
  background:radial-gradient(circle at 78% 12%,rgba(240,235,220,.22) 0 70px,rgba(240,235,220,.07) 120px,transparent 260px),
             radial-gradient(ellipse at 50% 120%,#2a1d3a 0,transparent 60%),linear-gradient(#0d0c16,#0b0a10 60%,#120d14)}
.fog{position:fixed;inset:auto 0 0 0;height:45vh;z-index:-1;pointer-events:none;opacity:.35;
  background:radial-gradient(ellipse at 20% 100%,rgba(180,170,200,.35),transparent 60%),radial-gradient(ellipse at 80% 100%,rgba(180,170,200,.3),transparent 60%);
  animation:fog 18s ease-in-out infinite alternate}
@keyframes fog{to{transform:translateX(6%)}}
button{font:inherit;cursor:pointer}
h1,h2,h3{font-family:var(--title);font-weight:700;letter-spacing:.04em;margin:.2em 0 .5em;line-height:1.2}
h1{font-size:clamp(2rem,6vw,3.6rem);color:var(--gold2);text-shadow:0 0 24px rgba(232,176,75,.35)}
h2{font-size:clamp(1.4rem,4vw,2rem);color:var(--gold2)}
h3{font-size:1.1rem;color:var(--gold)}
p{margin:.4em 0 .9em}
.wrap{max-width:980px;margin:0 auto;padding:16px 16px 120px}
.hidden{display:none!important}

/* top bar */
.bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:8px 16px;background:rgba(11,10,16,.88);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.bar .team{font-family:var(--title);color:var(--gold);font-size:.95rem;flex:1;min-width:120px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:1.15rem;padding:4px 10px;border-radius:8px;background:var(--panel);border:1px solid var(--line)}
.timer.low{color:var(--blood);animation:pulse 1s infinite}
.timer.over{color:var(--blood)}
@keyframes pulse{50%{opacity:.5}}
.keys{display:flex;gap:6px}
.keyslot{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;border:1px dashed var(--line);color:var(--muted);font-family:var(--title);font-weight:700}
.keyslot.got{border:1px solid var(--gold);background:radial-gradient(circle,#4a3613,#241a0a);color:var(--gold2);box-shadow:0 0 12px rgba(232,176,75,.4)}
.iconbtn{background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:5px 10px;font-size:.9rem}
.iconbtn:hover{border-color:var(--gold)}

/* generic */
.btn{background:linear-gradient(#f0c063,#c98f2c);color:#1d1306;border:0;border-radius:10px;padding:11px 20px;font-weight:700;letter-spacing:.02em;box-shadow:0 4px 18px rgba(232,176,75,.25)}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.ghost:hover{border-color:var(--gold)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.card{background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line);border-radius:16px;padding:20px;margin:16px 0;box-shadow:0 10px 40px rgba(0,0,0,.4)}
.narr{font-family:var(--serif);font-size:1.18rem;line-height:1.6;color:#e9dfcc}
.narr em{color:var(--gold2)}
.step{font-family:var(--title);font-size:.8rem;color:var(--muted);letter-spacing:.15em;text-transform:uppercase}
.fb{min-height:1.5em;margin-top:10px;font-weight:600}
.fb.ok{color:var(--ok)} .fb.bad{color:var(--blood)} .fb.info{color:var(--ghost)}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
input[type=text],input[type=number],select,textarea{font:inherit;color:var(--ink);background:#120f18;border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:1px}
label{font-size:.9rem;color:var(--muted)}
.hintbox{margin-top:12px;padding:12px 14px;border-left:3px solid var(--ghost);background:rgba(159,211,230,.07);border-radius:6px;font-size:.95rem}

/* intro */
.hero{text-align:center;padding:30px 0 10px}
.manor{width:min(520px,100%);height:auto;display:block;margin:0 auto 10px;filter:drop-shadow(0 0 30px rgba(232,176,75,.15))}
.win{animation:flick 3s infinite}
.win:nth-child(3n){animation-delay:-1.2s}.win:nth-child(4n){animation-delay:-2.1s}
@keyframes flick{0%,100%{opacity:1}45%{opacity:.85}50%{opacity:.4}55%{opacity:.9}}
.setup{display:grid;grid-template-columns:1fr 160px;gap:12px;text-align:left;max-width:520px;margin:18px auto}
@media (max-width:520px){.setup{grid-template-columns:1fr}}

/* hall */
.doors{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-top:10px}
.door{position:relative;text-align:left;border-radius:90px 90px 14px 14px;padding:56px 18px 20px;min-height:250px;color:var(--ink);
  background:linear-gradient(180deg,#3b2a1c,#21170f);border:2px solid #5a412a;box-shadow:inset 0 0 0 6px rgba(0,0,0,.25),0 10px 30px rgba(0,0,0,.5);transition:transform .2s}
.door:hover:not(:disabled){transform:translateY(-4px)}
.door .num{position:absolute;top:16px;left:0;right:0;text-align:center;font-family:var(--title);color:var(--gold);font-size:1.4rem}
.door .dt{font-family:var(--title);font-size:1.05rem;color:var(--gold2);margin-bottom:6px}
.door .dd{font-size:.88rem;color:#cbbfa9}
.door .st{position:absolute;bottom:14px;left:18px;right:18px;font-size:.85rem;font-weight:700}
.door:disabled{filter:grayscale(.8) brightness(.55);cursor:not-allowed}
.door.done{border-color:var(--gold);box-shadow:0 0 24px rgba(232,176,75,.3),inset 0 0 0 6px rgba(0,0,0,.25)}
.door.final{background:linear-gradient(180deg,#3a1414,#1a0909);border-color:#7a2b2b}

/* room header */
.roomhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.backlink{background:none;border:0;color:var(--muted);padding:6px 0}
.backlink:hover{color:var(--gold)}

/* room1 classify */
.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:54px;padding:10px;border:1px dashed var(--line);border-radius:12px;background:rgba(0,0,0,.2)}
.chip{background:var(--paper);color:var(--paperInk);border:0;border-radius:999px;padding:6px 14px;font-family:var(--serif);font-size:1.08rem;box-shadow:0 2px 0 #b7a37a;transition:transform .12s}
.chip:hover{transform:translateY(-2px)}
.chip.sel{outline:3px solid var(--gold);transform:translateY(-3px)}
.chip.right{background:#cfe9c6}
.chip.wrong{background:#f1b9b2}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:12px}
.bin{border:2px solid var(--line);border-radius:12px;padding:10px;min-height:110px;background:rgba(0,0,0,.25);text-align:left;color:var(--ink)}
.bin h4{margin:0 0 2px;font-family:var(--title);font-size:.95rem}
.bin small{display:block;color:var(--muted);font-size:.78rem;margin-bottom:6px}
.bin .in{display:flex;flex-wrap:wrap;gap:6px}
.bin.armed{border-color:var(--gold);background:rgba(232,176,75,.08)}

/* room1 sentences */
.sent{border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0;background:rgba(0,0,0,.18)}
.sent .orig{font-family:var(--serif);font-size:1.12rem;color:#d9cdb6}
.sent .orig s{color:var(--blood);text-decoration:none}
.build{display:flex;flex-wrap:wrap;gap:6px;min-height:46px;padding:8px;border-radius:10px;border:1px dashed #5a4c6c;margin:8px 0}
.tiles{display:flex;flex-wrap:wrap;gap:6px}
.tile{background:#2f2840;color:var(--ink);border:1px solid #4c4060;border-radius:8px;padding:5px 10px;font-family:var(--serif);font-size:1.05rem}
.build .tile{background:var(--paper);color:var(--paperInk);border-color:#b7a37a}
.sent.ok{border-color:var(--ok)} .sent.bad{border-color:var(--blood)}
.choice{display:flex;flex-direction:column;gap:6px}
.opt{text-align:left;background:#17131f;border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:10px 12px;font-family:var(--serif);font-size:1.05rem}
.opt.sel{border-color:var(--gold);background:rgba(232,176,75,.1)}

/* room2 order */
.olist{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.oitem{display:flex;gap:10px;align-items:center;background:var(--paper);color:var(--paperInk);border-radius:10px;padding:10px 10px 10px 14px;font-family:var(--serif);font-size:1.08rem;box-shadow:0 3px 0 #b7a37a;cursor:grab;user-select:none;border:2px solid transparent;transition:transform .15s}
.oitem.sel{border-color:var(--gold);transform:scale(1.01)}
.oitem.dragging{opacity:.4}
.oitem.ok{border-color:#4f9b4a;background:#e3f1dc}
.oitem .txt{flex:1}
.oitem mark{background:rgba(159,90,10,.18);color:inherit;padding:0 2px;border-radius:3px}
.arrows{display:flex;flex-direction:column;gap:4px}
.arrows button{border:0;background:#d8c9a6;color:#3a2c16;border-radius:6px;width:34px;height:26px;font-size:.9rem}
.arrows button:hover{background:#c8b78f}

/* room3 stories */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tab{background:#17131f;border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:6px 14px;font-family:var(--title);font-size:.85rem}
.tab.on{background:var(--gold);color:#1d1306;border-color:var(--gold)}
.paper{background:var(--paper);color:var(--paperInk);border-radius:6px;padding:20px 22px;font-family:var(--serif);font-size:1.15rem;line-height:1.7;box-shadow:0 8px 30px rgba(0,0,0,.5);background-image:radial-gradient(ellipse at 10% 0%,rgba(140,100,40,.12),transparent 40%),radial-gradient(ellipse at 100% 100%,rgba(140,100,40,.15),transparent 40%)}
.paper h3{color:#5a3a12;font-family:var(--title);margin-top:0}
.w{cursor:pointer;border-radius:3px;padding:0 1px}
.w:hover{background:rgba(120,80,20,.15)}
.w.nope{background:rgba(120,120,120,.25);transition:background 1s}
.w.found{background:#f3b6ad;color:#5a0f0a;box-shadow:0 0 0 2px #c8433b}
.fixrow{display:grid;grid-template-columns:1fr 1.2fr;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.fixrow .bad{font-family:var(--serif);color:#f3b6ad;font-size:1.1rem}
@media (max-width:560px){.fixrow{grid-template-columns:1fr}}

/* room4 */
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.85rem}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;background:currentColor}
.preview{margin-top:10px;white-space:pre-wrap}
.hl-manner{background:rgba(232,176,75,.35);border-bottom:2px solid var(--manner)}
.hl-time{background:rgba(159,211,230,.35);border-bottom:2px solid #3b8eab}
.hl-place{background:rgba(195,155,232,.35);border-bottom:2px solid #8a55c0}
.checks{list-style:none;padding:0;margin:10px 0;display:grid;gap:4px}
.checks li::before{content:"○ ";color:var(--muted)}
.checks li.ok{color:var(--ok)} .checks li.ok::before{content:"✓ ";color:var(--ok)}
table.bank{width:100%;border-collapse:collapse;font-size:.95rem}
table.bank td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
table.bank td:first-child{color:var(--gold);white-space:nowrap;font-weight:600}
textarea{min-height:200px;font-family:var(--serif);font-size:1.12rem;line-height:1.6}

/* room4 bell tower */
.arena{position:relative;height:min(62vh,520px);min-height:340px;margin-top:14px;border-radius:16px;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;
  border:2px solid var(--line);box-shadow:inset 0 0 80px rgba(0,0,0,.6);
  background:radial-gradient(circle at 50% 38%,rgba(255,200,87,.16),transparent 45%),linear-gradient(180deg,#140c24,#25163d 60%,#1a1030)}
.arena::before{content:"🔔";position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);font-size:min(30vh,240px);opacity:.14;filter:grayscale(.3)}
.arena::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,#0b0614 0 6%,transparent 6% 94%,#0b0614 94%),repeating-linear-gradient(0deg,transparent 0 60px,rgba(0,0,0,.18) 60px 64px)}
.hud{position:absolute;top:10px;left:0;right:0;display:flex;justify-content:center;gap:12px;z-index:5;font-weight:800;font-size:1.1rem;pointer-events:none}
.hud span{background:rgba(13,8,24,.75);padding:5px 14px;border-radius:999px;border:1px solid rgba(243,233,210,.25)}
.count{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--title);font-size:min(22vh,180px);color:var(--gold2);text-shadow:0 0 40px rgba(232,176,75,.7);z-index:6}
.ent{position:absolute;left:0;top:0;line-height:1;cursor:crosshair;will-change:transform;padding:10px;z-index:3}
.batE{font-size:clamp(40px,7vh,72px)}
.batE .flap{display:inline-block;animation:flap .22s ease-in-out infinite alternate}
@keyframes flap{from{transform:scaleY(1) rotate(-6deg)}to{transform:scaleY(.7) rotate(6deg)}}
.batE.gold .flap{filter:sepia(1) saturate(6) hue-rotate(-12deg) brightness(1.25) drop-shadow(0 0 12px #ffc857)}
.batE.caught .flap{animation:none;transition:transform .35s ease-in,opacity .35s;transform:scale(.2) rotate(180deg);opacity:0}
.plus{position:absolute;left:0;top:0;font-family:var(--title);font-size:2rem;font-weight:700;color:var(--gold2);pointer-events:none;z-index:5;text-shadow:0 0 14px rgba(232,176,75,.8)}
.timeup{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:rgba(13,8,24,.72);z-index:8}
.timeup b{font-family:var(--title);font-size:clamp(3rem,10vw,5.5rem);color:var(--gold2);line-height:1}
.timeup span{font-size:1.5rem;font-weight:800}

/* final */
.lock{max-width:340px;margin:10px auto;text-align:center}
.dials{display:flex;justify-content:center;gap:10px;margin:16px 0}
.dial{width:62px;height:80px;border-radius:12px;background:linear-gradient(#2c2436,#141019);border:2px solid #5a4c6c;font-family:var(--title);font-size:2.2rem;color:var(--gold2);display:grid;place-items:center}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pad button{padding:14px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);color:var(--ink);font-size:1.2rem;font-weight:700}
.pad button:hover{border-color:var(--gold)}

/* overlays */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(5,4,8,.88);display:grid;place-items:center;padding:16px;overflow:auto}
.modal{max-width:620px;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;max-height:90vh;overflow:auto}
.keyreveal{text-align:center}
.bigkey{font-size:4rem;line-height:1;margin:10px 0;filter:drop-shadow(0 0 20px rgba(232,176,75,.6));animation:float 2s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px) rotate(-6deg)}}
.digit{font-family:var(--title);font-size:3rem;color:var(--gold2)}
.present{position:fixed;inset:0;z-index:60;background:#0b0a10;overflow:auto;padding:5vh 6vw}
.present .ptext{font-family:var(--serif);font-size:clamp(1.3rem,3vw,2.2rem);line-height:1.6;max-width:1000px;margin:0 auto;white-space:pre-wrap}
.present .ptext .prompt{color:var(--muted);font-style:italic}
.teacher table{width:100%;border-collapse:collapse;font-size:.92rem}
.teacher td{border-bottom:1px solid var(--line);padding:6px;vertical-align:top}
.ghostfly{position:fixed;font-size:3rem;z-index:70;pointer-events:none;animation:fly 2.4s ease-in forwards}
@keyframes fly{from{opacity:0;transform:translate(0,30px) scale(.6)}20%{opacity:1}to{opacity:0;transform:translate(var(--dx),-60vh) scale(1.4)}}
@media print{.bar,.fog,.btn,.iconbtn{display:none!important}body{background:#fff;color:#000}}
</style>
</head>
<body>
<div class="fog"></div>

<header class="bar hidden" id="bar">
  <div class="team" id="teamName">Team</div>
  <div class="keys" id="keys" title="Keys collected"></div>
  <div class="timer" id="timer">50:00</div>
  <button class="iconbtn" id="soundBtn" title="Sound on/off">🔊</button>
  <button class="iconbtn" id="menuBtn" title="Menu">☰</button>
</header>

<main class="wrap" id="app"></main>

<script>
/* ============ DATA ============ */
const ROOMS = [
  {id:1, name:"The Library of Adverbs", short:"Classify adverbs & fix the haunted sentences", digit:"1"},
  {id:2, name:"The Living Room of Time", short:"Put the scattered story back in order", digit:"0"},
  {id:3, name:"The Ghostly Truth", short:"Unmask the ghost-written story", digit:"3"},
  {id:4, name:"The Bell Tower", short:"Catch the bats before the clock strikes", digit:"1"}
];
const BAT_SECS = 30, BAT_TARGET = 15;
const FINAL_CODE = "1031";

const CLASSIFY = {
  bins:[
    {k:"manner", t:"Manner", s:"How?"},
    {k:"time", t:"Time", s:"When?"},
    {k:"place", t:"Place", s:"Where?"},
    {k:"freq", t:"Frequency", s:"How often?"},
    {k:"degree", t:"Degree", s:"How much?"}
  ],
  words:{
    slowly:"manner", silently:"manner", nervously:"manner",
    yesterday:"time", tonight:"time", soon:"time",
    upstairs:"place", outside:"place", everywhere:"place",
    always:"freq", never:"freq", often:"freq",
    very:"degree", extremely:"degree", almost:"degree"
  }
};

const SENTENCES = [
  {wrong:"She rarely is late to the séance", ok:["she is rarely late to the séance"], cursed:true},
  {wrong:"They opened slowly the creaking door", ok:["they slowly opened the creaking door","they opened the creaking door slowly","slowly they opened the creaking door"], cursed:true},
  {wrong:"We last night saw the witch in the garden", ok:["we saw the witch in the garden last night","last night we saw the witch in the garden"], cursed:true},
  {wrong:"He quite was frightened by the noise", ok:["he was quite frightened by the noise"], cursed:true},
  {wrong:"I usually walk through the graveyard after dark", ok:["i usually walk through the graveyard after dark","after dark i usually walk through the graveyard"], cursed:false}
];

const STORY = [
  "<mark>Just before midnight</mark>, three students crept into Wraithmoor Manor on a dare. They laughed nervously as the front door creaked open.",
  "<mark>A few minutes later</mark>, one of them noticed a candle flickering on the mantelpiece, although there was no wind. They exchanged a worried look.",
  "<mark>Shortly afterwards</mark>, they heard footsteps upstairs and decided to follow them. Slowly, they climbed the creaking staircase.",
  "<mark>Eventually</mark>, they reached the attic. The door groaned as they pushed it, revealing nothing but dust — until they heard a whisper behind them.",
  "<mark>All of a sudden</mark>, the whisper became a wail. The attic door slammed shut, trapping them inside.",
  "<mark>At that very moment</mark>, the wind howled and every window in the house shattered. Now they knew the stories were true.",
  "<mark>In the end</mark>, the students were never found — but <mark>to this day</mark>, the candle on the mantelpiece is still burning."
];

const STORIES = {
  A:{t:"The Vanishing Guest", p:["The party had finished hours earlier, and the house was completely silent. Sarah walked slowly through the corridor, trying not to make a sound. The candles flickered gently as she passed, and suddenly, she realised that one room was still lit.","She opened the door cautiously. Inside, everything was perfectly still, except for the rocking chair, which moved softly back and forth as if someone invisible were sitting in it. A cold breeze touched her cheek, even though the window was closed.","Just then, she remembered her grandmother had died in that room exactly a year before. Trembling slightly, she switched off the light — and immediately, the rocking stopped."]},
  B:{t:"A Cold Visit", p:["I spent a week alone in a mountain house far from any village. Every night it was very cold and quiet, and I could hardly sleep. One evening, I was reading relaxedly by the fire when, suddenly, the door opened by itself.","A tall, thin man was standing there and looking me fixedly. I called him, but he didn't answer. The fire moved a lot, and I saw his shadow go backwards slowly until it disappeared completely.","Next morning, I went out to see if there were footprints, but there weren't any. Only a handprint in the snow — exactly in front of the door."]},
  C:{t:"The Disturbed Room", p:["The rain was falling heavily when Maria entered the old hotel. She walked quickly to her room and locked the door behind her. At first, everything seemed perfectly normal, until the wardrobe creaked loudly.","She opened it slowly, but there was nothing inside except a single shoe. Then, the lights went out suddenly, and she froze completely. The silence was terrifying.","When she finally dared to move, the shoe was gone. She ran down the corridor as fast as she could, and she swore she heard someone whisper her name softly from the darkness."]},

let AC;
function tone(freqs, dur=.18, type="sine", gap=.12){
  if(!S.sound) return;
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    freqs.forEach((f,i)=>{
      const o=AC.createOscillator(), g=AC.createGain(), t=AC.currentTime+i*gap;
      o.type=type; o.frequency.value=f; g.gain.setValueAtTime(.0001,t);
      g.gain.exponentialRampToValueAtTime(.18,t+.02); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
      o.connect(g).connect(AC.destination); o.start(t); o.stop(t+dur+.05);
    });
  }catch(e){}
}

  /* part A */
  let sel=null; const placed={};
  const pool=$("#pool"), bins=$("#bins");
  CLASSIFY.bins.forEach(b=>{
    const el=h(`<div class="bin" data-k="${b.k}" role="button" tabindex="0"><h4 style="color:var(--${b.k})">${b.t}</h4><small>${b.s}</small><div class="in"></div></div>`);

function detect(text){
  const lower=text.toLowerCase(); const taken=new Array(text.length).fill(false); const hits=[];
  const add=(i,len,cat)=>{ for(let k=i;k<i+len;k++) if(taken[k]) return; for(let k=i;k<i+len;k++) taken[k]=true; hits.push({i,len,cat}); };
  const phrases=[];
  Object.entries(LEX).forEach(([cat,list])=>list.forEach(p=>phrases.push([p,cat])));
  phrases.sort((a,b)=>b[0].length-a[0].length);
  phrases.forEach(([p,cat])=>{
    const re=new RegExp("\\b"+p.replace(/ /g,"\\s+")+"\\b","g"); let m;
    while((m=re.exec(lower))) add(m.index,m[0].length,cat);
  });
  const re=/\b[a-z]{3,}ly\b/g; let m;
  while((m=re.exec(lower))) if(!NOT_LY.has(m[0])) add(m.index,m[0].length,"manner");
  return hits.sort((a,b)=>a.i-b.i);
}

function bellTower(){
  app.appendChild(roomHead(4,"The Bell Tower","The last key hangs from the great bell — but a swarm of bats guards it. When the bell starts to toll, catch as many bats as you can before the clock strikes. Tap a bat to catch it. A <em>golden bat</em> is worth three points."));
  const c=h(`<div class="card"><div class="row" style="justify-content:space-between">
      <div><div class="step">Catch at least ${BAT_TARGET} points in ${BAT_SECS} seconds</div>
      <div style="color:var(--muted)">Best score: <b id="best" style="color:var(--gold2)">${S.bestBats||0}</b></div></div>
      <button class="btn" id="play">🦇 ${S.bestBats?"Play again":"Start"}</button></div>
    <div class="arena" id="ar"><div class="hud"><span id="hs">🦇 0 points</span><span id="ht">⏳ ${BAT_SECS}</span></div>
      <div class="count" id="cd">🦇</div></div><div class="fb" id="fb"></div></div>`);
  app.appendChild(c);
  $("#play").onclick=()=>{ $("#play").disabled=true; countdown(); };
  function countdown(){
    const ar=$("#ar"); ar.querySelectorAll(".ent,.timeup").forEach(e=>e.remove());
    let cd=$("#cd"); if(!cd){ cd=h(`<div class="count" id="cd"></div>`); ar.appendChild(cd); }
    let n=3; cd.textContent=n; tone([440],.1,"square");
    const t=setInterval(()=>{
      if(!ar.isConnected) return clearInterval(t);
      n--; if(n>0){ cd.textContent=n; tone([440],.1,"square"); }
      else { clearInterval(t); cd.textContent="Go!"; tone([660,880],.2,"triangle",.08); setTimeout(()=>{ cd.remove(); playBats(ar); },450); }
    },700);
  }
  function playBats(ar){
    const hs=$("#hs"), ht=$("#ht");
    let score=0, bats=[], spawnAt=0, over=false, t0=performance.now(), last=t0, lastTick=0;
    const W=()=>ar.clientWidth, H=()=>ar.clientHeight;
    const hud=()=>{ hs.textContent=`🦇 ${score} point${score===1?"":"s"}`; }; hud();
    function spawn(el){
      if(bats.filter(b=>!b.done).length>=9) return;
      const gold=Math.random()<0.12;
      const b=h(`<div class="ent batE${gold?" gold":""}"><span class="flap">🦇</span></div>`); ar.appendChild(b);
      const ltr=Math.random()<.5, sp=W()*(0.11+0.004*el)*(0.8+Math.random()*0.5)*(gold?1.35:1);
      bats.push({el:b, x0:ltr?-80:W()+10, vx:ltr?sp:-sp, y0:H()*(0.14+Math.random()*0.62), amp:H()*(0.04+Math.random()*0.12), fr:2+Math.random()*3, ph:Math.random()*6, age:0, gold, done:false});
    }
    function frame(now){
      if(over) return;
      if(!ar.isConnected){ over=true; return; }
      const dt=Math.min(.05,(now-last)/1000); last=now;
      const el=(now-t0)/1000, left=Math.max(0,BAT_SECS-el);
      ht.textContent=`⏳ ${Math.ceil(left)}`;
      if(left<=5 && left>0 && Math.ceil(left)!==lastTick){ lastTick=Math.ceil(left); tone([520],.06,"square"); }
      if(el>=spawnAt){ spawn(el); spawnAt=el+Math.max(0.32,0.8-el*0.014); }
      for(const b of bats){ if(b.done) continue; b.age+=dt; b.x=b.x0+b.vx*b.age; b.y=b.y0+b.amp*Math.sin(b.fr*b.age+b.ph);
        b.el.style.transform=`translate(${b.x}px,${b.y}px)`;
        if(b.x<-120||b.x>W()+120){ b.done=true; b.el.remove(); } }
      bats=bats.filter(b=>!b.done);
      if(left<=0) return finish();
      requestAnimationFrame(frame);
    }
    function finish(){
      over=true; ar.removeEventListener("pointerdown",onTap);
      bats.forEach(b=>b.el.remove());
      const best=Math.max(S.bestBats||0,score); S.bestBats=best; save(); $("#best").textContent=best;
      const won=score>=BAT_TARGET;
      ar.appendChild(h(`<div class="timeup"><b>${won?"Dong!":"Time!"}</b><span>${score} point${score===1?"":"s"}</span></div>`));
      $("#play").disabled=false; $("#play").textContent="🦇 Play again";
      if(won){ fb($("#fb"),S.solved[4]?`Great catch! Your best score is ${best}.`:"The bell tolls midnight and the key falls into your hands!","ok"); setTimeout(()=>solve(4),1200); }
      else { sBad(); fb($("#fb"),`The bats are still guarding the key. You need ${BAT_TARGET} points — try again!`,"bad"); }
    }
    function onTap(e){
      if(over) return; e.preventDefault();
      const tgt=e.target.closest(".batE"), b=tgt&&bats.find(q=>q.el===tgt&&!q.done);
      if(!b){ tone([300],.08); return; }
      b.done=true; const pts=b.gold?3:1; score+=pts; hud();
      b.el.classList.add("caught"); setTimeout(()=>b.el.remove(),380);
      const r=ar.getBoundingClientRect(), x=e.clientX-r.left-20, y=e.clientY-r.top-40;
      const p=h(`<div class="plus">+${pts}</div>`); ar.appendChild(p);
      p.animate([{transform:`translate(${x}px,${y}px)`,opacity:1},{transform:`translate(${x}px,${y-80}px)`,opacity:0}],{duration:800,easing:"ease-out"}).onfinish=()=>p.remove();
      b.gold?tone([784,1047,1319],.2,"triangle",.07):tone([880,1320],.1,"triangle",.05);
    }
    ar.addEventListener("pointerdown",onTap);
    requestAnimationFrame(frame);
  }
}

        if(code===FINAL_CODE){ S.finished=Math.round((Date.now()-S.startAt)/1000)+S.penalty*60; save(); sGood(); ghosts(14); setTimeout(render,600); return; }
        sBad(); fb($("#fb"),"The dials won't turn. Check the order of your keys!","bad"); code="";
      } else if(code.length<4){ code+=k; sTap(); }
      draw();
    };
    $("#pad").appendChild(b);
  });
  draw();
}
function escaped(){
  const inTime = S.finished <= S.minutes*60;
  app.appendChild(h(`<div class="hero">
    <div class="bigkey">🎃</div><div class="step">10 · 31 · Halloween</div>
    <h1>You escaped!</h1>
    <div class="card"><p class="narr">Congratulations, ${esc(S.team||"brave storytellers")}! You have faced the ghosts of grammar, unlocked the secrets of storytelling, and escaped Wraithmoor Manor ${inTime?"just in time":"— though the house kept a little of your soul"}!</p>
    <p class="digit" style="font-size:2rem">⏱️ ${fmt(S.finished)}</p>
    <p style="color:var(--muted)">${S.penalty?`Including ${S.penalty} minute${S.penalty>1?"s":""} of hint penalties.`:"No hints used — the ghosts are impressed."}</p>
    <p>🦇 Bats caught in the bell tower: <b style="color:var(--gold2)">${S.bestBats||0} points</b></p>
    <h2 style="margin-top:20px">Happy Halloween!</h2>
    <div class="row" style="justify-content:center"><button class="btn ghost" id="again">Play again with a new team</button></div></div></div>`));
  $("#again").onclick=()=>{ if(confirm("Start over with a new team?")){ S=blank(); save(); render(); } };
}

render();
</script>
