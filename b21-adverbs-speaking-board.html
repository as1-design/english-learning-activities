body{margin:0;background:var(--cream);color:var(--ink);font:400 1.0625rem/1.45 var(--body);min-height:100vh;overflow-x:hidden;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button{font:inherit;color:inherit;min-height:44px;cursor:pointer;border:0;background:none}
button:focus-visible,a:focus-visible{outline:3px solid var(--cobalt);outline-offset:3px;border-radius:8px}
h1,h2,h3{font-family:var(--display);font-weight:400;line-height:1.02;margin:0;letter-spacing:-.01em}
p{margin:0 0 var(--sp-3)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.decor{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.decor svg{position:absolute}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 20px;border-radius:999px;background:var(--ink);color:var(--cream);
  font-weight:700;box-shadow:var(--cut);transition:transform .15s var(--spring);white-space:nowrap}
.btn:active{transform:translate(2px,3px);box-shadow:1px 2px 0 rgba(30,30,42,.25)}
.btn.ghost{background:var(--paper);color:var(--ink);border:2.5px solid var(--ink);box-shadow:none}
.btn.small{min-height:40px;padding:6px 14px;font-size:.95rem}
.label{font:700 .78rem/1.2 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft)}
.wrap{max-width:760px;margin:0 auto;padding:var(--sp-3) var(--sp-3) 110px}

/* ================= home ================= */
.home{max-width:820px;margin:0 auto;padding:var(--sp-5) var(--sp-3) var(--sp-4)}
.home h1{font-size:clamp(3.2rem,2rem + 7vw,6.6rem);line-height:.9;text-transform:uppercase}
.home h1 .a{color:var(--verm)} .home h1 .b{color:var(--cobalt);display:inline-block;transform:rotate(-3deg)}
.cando{background:var(--paper);border-radius:var(--r-m);padding:12px 16px;margin:var(--sp-4) 0;box-shadow:var(--cut);border:2.5px solid var(--ink)}
.playtile{display:block;width:100%;min-height:170px;margin-top:var(--sp-2)}
.playtile .t{font-size:2.6rem}
.hidden-tools{margin-top:var(--sp-5);text-align:center}
.linkbtn{min-height:44px;padding:0 12px;color:var(--ink-soft);text-decoration:underline;text-underline-offset:4px;font-size:.95rem}
.choose{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-3)}
@media (max-width:620px){.choose{grid-template-columns:1fr}}
.tile{position:relative;text-align:left;padding:22px 22px 26px;border-radius:38px 22px 44px 26px;color:#fff;box-shadow:var(--cut);min-height:150px;overflow:hidden;transition:transform .2s var(--spring)}
.tile:hover{transform:rotate(-.8deg) translateY(-3px)}
.tile .t{display:block;font-family:var(--display);font-size:1.9rem;line-height:1}
.tile .s{display:block;margin-top:8px;max-width:85%}

/* ================= play screen ================= */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:var(--sp-2);padding:8px var(--sp-3);background:rgba(251,244,232,.95);border-bottom:2.5px solid var(--ink)}
.top h1{flex:1;font-size:1.25rem;text-transform:uppercase}
.iconbtn{min-width:44px;min-height:44px;border-radius:14px;background:var(--paper);border:2.5px solid var(--ink);font-size:1.05rem;padding:0 10px;font-weight:700}
.play{max-width:760px;margin:0 auto;padding:var(--sp-3) var(--sp-3) 100px;display:grid;gap:var(--sp-3)}
.dierow{display:flex;align-items:center;gap:var(--sp-3)}
.die{width:84px;height:84px;flex:none;border-radius:18px;background:var(--paper);border:3px solid var(--ink);box-shadow:var(--cut);display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:10px;gap:2px}
.die i{width:14px;height:14px;border-radius:50%;background:var(--ink);place-self:center;opacity:0}
.die i.on{opacity:1}
.die.rolling{animation:tumble .6s var(--ease)}
@keyframes tumble{0%{transform:rotate(0)}30%{transform:rotate(-25deg) scale(.9)}60%{transform:rotate(18deg) scale(1.05)}100%{transform:rotate(0)}}
.rollbtn{width:200px}
.types{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--sp-2)}
.type{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:78px;padding:6px 4px;color:#fff;font-weight:700;font-size:.9rem;line-height:1.1;text-align:center;box-shadow:var(--cut);transition:transform .15s var(--spring)}
.type:nth-child(6n+1){border-radius:28px 18px 32px 16px}.type:nth-child(6n+2){border-radius:18px 30px 16px 26px}.type:nth-child(6n+3){border-radius:24px 16px 30px 20px}
.type:nth-child(6n+4){border-radius:16px 28px 22px 30px}.type:nth-child(6n+5){border-radius:30px 22px 16px 24px}.type:nth-child(6n+6){border-radius:20px 26px 30px 16px}
.type:active{transform:translate(2px,3px)}
.type svg{width:30px;height:30px}
.type.ink-text{color:var(--ink)}
.type[aria-pressed=true]{outline:3px solid var(--ink);outline-offset:3px}
.cardzone{position:relative;height:max(300px,min(460px,calc(100dvh - 475px)))}
.card{position:absolute;inset:0;background:var(--paper);border:3px solid var(--ink);border-radius:26px 18px 30px 20px;box-shadow:var(--cut);display:flex;flex-direction:column;overflow:hidden}
.card .band{display:flex;align-items:center;gap:10px;padding:10px 16px;color:#fff;font-weight:700;flex:none}
.card .band svg{width:26px;height:26px}
.card .band .n{margin-left:auto;font-size:.85rem}
.card .body{padding:14px 18px 16px;overflow:auto;flex:1}
.card .prompt{font-family:var(--display);font-size:clamp(1.25rem,1rem + 1.2vw,1.7rem);line-height:1.18;margin:4px 0 12px}
.card .how{font-size:.95rem;color:var(--ink-soft);margin-bottom:10px}
.card .starter{font-style:italic;margin:10px 0 0;color:var(--ink)}
.card .note{font-size:.9rem;color:var(--ink-soft);margin-top:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:4px 14px;border-radius:999px;border:2.5px solid var(--ink);background:var(--cream);font-weight:700;display:inline-flex;align-items:center;gap:6px}
.chip .tick{display:inline-block;width:1.1em;text-align:center}
.chip.used{background:var(--ok);border-color:var(--ok);color:#fff}
.card.lift{animation:lift .55s var(--spring)}
@keyframes lift{0%{transform:translate(-10px,24px) rotate(-6deg);box-shadow:0 0 0 rgba(0,0,0,0);opacity:0}100%{transform:none}}
.empty{position:absolute;inset:0;border:3px dashed var(--ink-soft);border-radius:26px 18px 30px 20px;display:grid;place-items:center;text-align:center;padding:20px;color:var(--ink-soft)}
.bonus{font-weight:700;color:var(--ok)}
.status{height:2.8em;line-height:1.4em;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;margin:-6px 0}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;gap:var(--sp-2);justify-content:flex-end;align-items:center;
  padding:10px var(--sp-3) calc(10px + env(safe-area-inset-bottom));background:rgba(251,244,232,.96);border-top:2.5px solid var(--ink)}
.bar .count{margin-right:auto;font-weight:700}
.bar .btn{width:200px}
@media (max-width:520px){.bar .btn{width:auto;flex:1}.bar .count{display:none}}

/* ================= other screens ================= */
.panel{background:var(--paper);border:2.5px solid var(--ink);border-radius:var(--r-l);padding:var(--sp-4);box-shadow:var(--cut);margin-top:var(--sp-3)}
.panel h2{font-size:1.8rem;margin-bottom:12px}
.rules{margin:0;padding-left:1.3em}
.rules li{margin-bottom:8px}
.qrbig{background:#fff;border-radius:16px;padding:12px;width:min(78vw,420px);margin:var(--sp-3) auto;display:block;box-shadow:var(--cut)}
.qrbig svg{display:block;width:100%;height:auto}
.usedlist{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.row{display:flex;flex-wrap:wrap;gap:var(--sp-2);align-items:center}
.boardprev{background:#fff;border:2.5px solid var(--ink);border-radius:var(--r-m);padding:8px;margin-top:var(--sp-3);box-shadow:var(--cut)}
.boardprev svg{display:block;width:100%;height:auto}
.printonly{display:none}

/* printed A4 sheets (rules + card list) */
.sheet{background:#fff;max-width:820px;margin:var(--sp-4) auto;padding:26px 32px;border-radius:6px;box-shadow:var(--cut);font-size:1rem;line-height:1.4}
.sheet h2{font-size:1.9rem;margin-bottom:6px}
.sheet h3{font-size:1.15rem;margin:14px 0 4px}
.sheet ol{margin:4px 0;padding-left:1.6em} .sheet li{margin-bottom:5px;break-inside:avoid}
.sheet .tw{color:var(--ink-soft)}
.sheet .credit{margin-top:12px;font-size:.8rem;color:#555;border-top:1px solid #bbb;padding-top:6px}


/* ================= digital board ================= */
.die.small{width:58px;height:58px;padding:6px;border-radius:14px;box-shadow:none}
.die.small i{width:10px;height:10px}
.dwrap{max-width:900px;margin:0 auto;padding:10px var(--sp-3) 96px;display:flex;flex-direction:column;gap:8px;height:calc(100dvh - 64px)}
.turn{display:flex;align-items:center;gap:10px;font-size:1.15rem;min-height:40px}
.dot{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;color:#fff;font:400 .8rem var(--display);border:2px solid #fff;box-shadow:0 0 0 2px var(--ink);flex:none}
.dot.big{width:36px;height:36px;font-size:1.05rem}
.prow{display:flex;flex-wrap:nowrap;gap:6px;overflow:hidden;min-height:36px}
.pchip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 4px;border-radius:999px;background:var(--paper);border:2px solid var(--ink);font-size:.9rem;white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
.pchip.now{background:var(--ink);color:var(--cream)}
.boardbox{flex:1;min-height:0;display:flex;justify-content:center}
.boardbox svg{height:100%;width:100%;max-width:100%}
.mainbtn{width:240px}
.dbar{justify-content:space-between}
@media (max-width:520px){.dbar .mainbtn{flex:1;width:auto}}
.cardzone.tallcard{height:max(320px,calc(100dvh - 300px))}
.card .follow{font-size:.92rem;margin:10px 0 0}
.setup .names{display:grid;gap:10px;margin:14px 0}
.setup label{display:flex;align-items:center;gap:10px}
.setup label.hide{visibility:hidden}
.setup input{font:inherit;font-size:16px;flex:1;min-height:46px;padding:8px 12px;border-radius:12px;border:2.5px solid var(--ink);background:#fff}
.seg{display:inline-flex;border:2.5px solid var(--ink);border-radius:999px;overflow:hidden}
.seg button{min-width:56px;font-weight:700}
.seg button.on{background:var(--ink);color:var(--cream)}
.muted{color:var(--ink-soft)}
.bar .btn:disabled{opacity:.45}

/* ================= cards to cut out ================= */
.cutprev{margin-top:var(--sp-3)}
.cutpage{background:#fff;max-width:820px;margin:0 auto var(--sp-4);padding:18px;display:grid;grid-template-columns:1fr 1fr;gap:0;box-shadow:var(--cut)}
.ccard{border:1.5px dashed #888;display:flex;flex-direction:column;min-height:240px;position:relative;overflow:hidden}
.ccard::before{content:"✂";position:absolute;right:4px;top:-2px;font-size:13px;color:#888}
.cband{display:flex;align-items:center;gap:8px;padding:8px 12px;font:400 1.05rem var(--display);margin:10px 10px 0;border-radius:14px 8px 16px 10px}
.cband svg{width:26px;height:26px;flex:none}
.cband .ctype{margin-left:auto;font:700 .8rem var(--body)}
.cbody{padding:10px 16px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
.cp{font:400 1.12rem/1.22 var(--display);margin:0}
.cw2{margin:0;font-size:.95rem}
.cs{margin:0;font-style:italic;font-size:.92rem}
.cf{margin:auto 0 0;font-size:.8rem;color:var(--ink-soft)}
.blankc .lines{flex:1;min-height:110px;background:repeating-linear-gradient(transparent 0 27px,#bbb 27px 28px)}
/* ================= signature footer ================= */
.coc-footer{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:4px 16px;padding:7px 20px;
  background:var(--coc-tan,#E6C496);color:var(--coc-coffee-dark,#5A2D0C);font-family:var(--coc-body,'Nunito','Segoe UI',Verdana,sans-serif);font-size:13px;line-height:1.4}
.coc-footer__brand{display:flex;align-items:center;gap:10px;font-weight:600}
.coc-footer__mark{width:30px;height:30px;flex:none}
.coc-footer a{color:inherit;text-decoration:underline;text-underline-offset:3px;display:inline-flex;align-items:center;min-height:40px;padding:0 4px}

@media print{
  body{background:#fff;min-height:0}
  .decor,.top,.bar,.noprint,.coc-footer{display:none!important}
  .printonly{display:block!important}
  .pr.skip{display:none!important}
  .boardpage{page:board;break-after:page;page-break-after:always}
  .wrap{max-width:none!important;padding:0!important}
  .boardpage svg{width:auto;height:279mm;max-width:100%;display:block;margin:0 auto}
  .sheet{page:sheet;max-width:none;margin:0;padding:0;box-shadow:none;font-size:12.5pt;break-after:page;page-break-after:always}
  .lastp{break-after:auto!important;page-break-after:auto!important}
  .cutprev,.cutpage{box-shadow:none}
  .cutpage{page:sheet;max-width:none;margin:0;padding:0;grid-template-rows:repeat(4,66mm);break-after:page;page-break-after:always}
  .ccard{min-height:0;height:66mm}
  .cp{font-size:12.5pt} .cw2{font-size:10.5pt} .cs{font-size:10pt} .cf{font-size:8.5pt} .cband{font-size:11.5pt}
  @page board{size:A3 landscape;margin:8mm}
  @page sheet{size:A4 portrait;margin:14mm}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>

/* ================= state ================= */
const KEY = 'b21-plot-twists.v1';
const TYPE = k => CONTENT.types.find(t => t.k === k);
const END = CONTENT.squares.length + 1;            // index of THE END (START is 0)
const shuffled = n => { const a = [...Array(n).keys()]; for (let i = n - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const blankGame = () => ({ players: [], turn: 0, phase: 'roll', roll: 0, msg: '', winner: null });
const blank = () => ({ v: 2, view: 'home', sound: true, die: 0, cur: null, bonusGiven: false, decks: {}, used: [], how: true, mode: null, game: blankGame() });
let S = null;
const SESSION = { bonus: '', lift: false, rolling: false, moving: false, newArm: false, prev: 'home', nT: 3, names: [] };

/* ================= logic: cards ================= */
function nextCard(k) {
  const len = CONTENT.cards[k].length;
  let d = S.decks[k];
  if (!d || !Array.isArray(d.order) || d.order.length !== len || d.pos >= len) d = S.decks[k] = { order: shuffled(len), pos: 0 };
  S.cur = { k, i: d.order[d.pos++] }; S.bonusGiven = false; SESSION.bonus = ''; SESSION.lift = true;
}
function draw(k) { nextCard(k); save(); sfx.flip(); render(); }
function allWords() { return [...new Set(Object.values(CONTENT.cards).flat().flatMap(c => c.w))]; }
function useWord(w) {
  if (!S.used.includes(w)) S.used.push(w);
  if (S.bonusGiven) { SESSION.bonus = `✓ “${w}” marked. The bonus for this card is already given.`; save(); render(); return; }
  S.bonusGiven = true; sfx.good();
  if (S.mode === 'digital') {
    const G = S.game, p = G.players[G.turn];
    p.pos = Math.min(END, p.pos + 1);
    SESSION.bonus = `✓ “${w}”: ${p.name} moves to ${p.pos >= END ? 'THE END' : 'square ' + p.pos}!`;
  } else SESSION.bonus = `✓ “${w}”: +1 square!`;
  save(); render();
}

/* ================= logic: die ================= */
function rollDie(done) {
  if (SESSION.rolling || SESSION.moving) return;
  SESSION.rolling = true; SESSION.bonus = ''; sfx.roll();
  const el = $('.die'); if (el) { el.classList.remove('rolling'); void el.offsetWidth; el.classList.add('rolling'); }
  let t = 0; const iv = setInterval(() => { drawDie(1 + Math.floor(Math.random() * 6)); if (++t > 6) { clearInterval(iv); S.die = 1 + Math.floor(Math.random() * 6); drawDie(S.die); SESSION.rolling = false; save(); done(S.die); } }, 80);
}
function rollPrinted() { rollDie(() => render()); }

/* ================= logic: digital board ================= */
function startDigital(names) {
  S.game = blankGame();
  S.game.players = names.map(n => ({ name: n, pos: 0, pass: false, first: true }));
  S.mode = 'digital'; S.view = 'dboard'; S.cur = null; S.used = [];
  S.game.msg = `Pass the phone to ${names[0]}.`;
  save(); render(); keepAwake();
}
function rollDigital() {
  const G = S.game; if (G.phase !== 'roll' || G.winner) return;
  rollDie(n => {
    G.roll = n; const p = G.players[G.turn]; let steps = n;
    SESSION.moving = true; render();
    const step = () => {
      if (steps > 0 && p.pos < END) { p.pos++; steps--; sfx.step(); drawBoard(); return setTimeout(step, 230); }
      const sc = CONTENT.shortcuts.find(s => s.from === p.pos);
      if (sc) {
        const fwd = sc.to > sc.from;
        G.msg = fwd ? `Plot twist! ${p.name} jumps forward to square ${sc.to}.` : `Dead end! ${p.name} goes back to square ${sc.to}.`; SESSION.sc = fwd ? 'Plot twist! ' : 'Dead end! ';
        drawMsg(); setTimeout(() => { p.pos = sc.to; fwd ? sfx.good() : sfx.back(); finishMove(); }, 650); return;
      }
      finishMove();
    };
    setTimeout(step, 200);
  });
}
function finishMove() {
  const G = S.game, p = G.players[G.turn];
  SESSION.moving = false;
  if (p.pos >= END) { G.winner = G.turn; G.phase = 'over'; S.view = 'end'; sfx.win(); save(); render(); return; }
  const k = p.first ? 'talk' : CONTENT.squares[p.pos - 1];
  G.cardType = k; G.phase = 'moved';
  G.msg = (SESSION.sc || '') + (p.first ? `${p.name} is on square ${p.pos}. First card: always “Talk about you”.` : `${p.name} is on square ${p.pos}: ${TYPE(k).name}.`); SESSION.sc = '';
  save(); render();
}
function takeCard() { const G = S.game; if (G.phase !== 'moved') return; nextCard(G.cardType); G.phase = 'card'; S.view = 'dcard'; save(); sfx.flip(); render(); scrollTo(0, 0); }
function endTurn(pass) {
  const G = S.game, p = G.players[G.turn];
  if (pass) { if (p.pass) return; p.pass = true; }
  p.first = false;
  if (p.pos >= END) { G.winner = G.turn; G.phase = 'over'; S.view = 'end'; sfx.win(); save(); render(); return; }
  G.turn = (G.turn + 1) % G.players.length; G.phase = 'roll'; S.cur = null;
  G.msg = `${pass ? p.name + ' passed. ' : ''}Pass the phone to ${G.players[G.turn].name}.`;
  S.view = 'dboard'; SESSION.bonus = ''; save(); render(); scrollTo(0, 0);
}

/* ================= sound (Web Audio, interface sounds only) ================= */
let AC = null;

const sfx = {
  roll() { for (let i = 0; i < 6; i++) tone(180 + Math.random() * 120, .05, 'square', .03, i * .08); },
  flip() { tone(520, .08, 'triangle', .05); tone(780, .1, 'triangle', .05, .06); },
  step() { tone(440, .05, 'triangle', .04); },
  good() { [523, 659, 784].forEach((f, i) => tone(f, .18, 'triangle', .06, i * .07)); },
  back() { [392, 330, 262].forEach((f, i) => tone(f, .18, 'triangle', .06, i * .08)); },
  win() { [523, 659, 784, 1047].forEach((f, i) => tone(f, .3, 'triangle', .07, i * .12)); }

const icon = (k, cls = '') => `<svg class="${cls}" viewBox="0 0 32 32" aria-hidden="true">${ICON[k]}</svg>`;
function rng(seed) { let s = seed >>> 0 || 1; return () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296; }

/* ================= QR codes ================= */

/* ================= the board (SVG) =================

function cutCard(t, c) {
  const fg = t ? (t.ink ? '#1E1E2A' : '#fff') : '#1E1E2A';
  if (!c) return `<div class="ccard blankc"><div class="cband" style="background:#fff;color:#1E1E2A;border-bottom:2px dashed #1E1E2A">✎ <span>Your card</span><span class="ctype">Type: ______________</span></div><div class="cbody"><div class="lines"></div><div class="cw2">Target words: ______________________</div></div></div>`;
  return `<div class="ccard"><div class="cband" style="background:${t.col};color:${fg}"><svg viewBox="0 0 32 32" aria-hidden="true">${ICON[t.k].replace(/currentColor/g, fg)}</svg><span>${t.name}</span></div>
    <div class="cbody"><p class="cp">${esc(c.p)}</p><p class="cw2"><b>Use:</b> ${c.w.map(esc).join(' · ')}</p>${c.s ? `<p class="cs">“${esc(c.s)}”</p>` : ''}<p class="cf">${t.follow}</p></div></div>`;
}
function cutSheets() {
  const all = [];
  CONTENT.types.forEach(t => CONTENT.cards[t.k].forEach(c => all.push([t, c])));
  for (let i = 0; i < CONTENT.blankCards; i++) all.push([null, null]);
  let out = '';
  for (let p = 0; p < all.length; p += 8) out += `<section class="cutpage ${p + 8 >= all.length ? 'lastp' : ''}">${all.slice(p, p + 8).map(([t, c]) => cutCard(t, c)).join('')}</section>`;
  return out;
}

/* ================= saving ================= */
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function load() {
  const b = blank();
  try {
    const d = JSON.parse(localStorage.getItem(KEY));
    if (d && (d.v === 1 || d.v === 2)) {
      b.view = ['home', 'mode', 'play', 'settings', 'how', 'end', 'print', 'setup', 'dboard', 'dcard'].includes(d.view) ? d.view : 'home';
      b.sound = d.sound !== false; b.how = d.how !== false; b.bonusGiven = !!d.bonusGiven;
      b.mode = ['printed', 'digital'].includes(d.mode) ? d.mode : null;
      b.die = [1, 2, 3, 4, 5, 6].includes(d.die) ? d.die : 0;
      b.used = Array.isArray(d.used) ? d.used.filter(w => typeof w === 'string' && allWords().includes(w)) : [];
      if (d.decks && typeof d.decks === 'object') CONTENT.types.forEach(t => { const x = d.decks[t.k], len = CONTENT.cards[t.k].length;
        if (x && Array.isArray(x.order) && x.order.length === len && x.order.every(n => Number.isInteger(n) && n >= 0 && n < len) && Number.isInteger(x.pos) && x.pos >= 0 && x.pos <= len) b.decks[t.k] = { order: x.order, pos: x.pos }; });
      if (d.cur && TYPE(d.cur.k) && Number.isInteger(d.cur.i) && CONTENT.cards[d.cur.k][d.cur.i]) b.cur = { k: d.cur.k, i: d.cur.i };
      const g = d.game;
      if (g && Array.isArray(g.players) && g.players.length <= 4) {
        b.game.players = g.players.map(p => ({ name: String(p.name || 'Player').slice(0, 14), pos: Math.max(0, Math.min(END, +p.pos || 0)), pass: !!p.pass, first: p.first !== false }));
        b.game.turn = Math.max(0, Math.min(b.game.players.length - 1, +g.turn || 0));
        b.game.phase = ['roll', 'moved', 'card', 'over'].includes(g.phase) ? g.phase : 'roll';
        b.game.cardType = TYPE(g.cardType) ? g.cardType : 'talk';
        b.game.msg = typeof g.msg === 'string' ? g.msg.slice(0, 200) : '';
        b.game.winner = Number.isInteger(g.winner) && g.winner < b.game.players.length ? g.winner : null;
      }
      if (['dboard', 'dcard'].includes(b.view) && !b.game.players.length) b.view = 'home';
    }
  } catch (e) {}
  return b;
}

/* ================= events ================= */
function printPart(id) {
  document.querySelectorAll('.printonly .pr').forEach(el => el.classList.toggle('skip', el.dataset.pr !== id));
  try { window.print(); } catch (e) {}
}
addEventListener('afterprint', () => document.querySelectorAll('.pr.skip').forEach(el => el.classList.remove('skip')));
const ACT = {
  go: b => go(b.dataset.v),
  mode: b => { const m = b.dataset.m; S.mode = m; SESSION.prev = 'mode';
    if (m === 'digital') go(S.how ? 'how' : 'setup'); else go(S.how ? 'how' : 'play'); },
  howDone: () => { S.how = false; go(S.mode === 'digital' ? (S.game.players.length && !S.game.winner ? 'dboard' : 'setup') : 'play'); },
  roll: rollPrinted, draw: b => draw(b.dataset.k), use: b => useWord(b.dataset.w),
  nT: b => { SESSION.names = [0, 1, 2, 3].map(k => $('#pn' + k)?.value || ''); SESSION.nT = +b.dataset.n; render(); },
  startDigital: () => { const n = SESSION.nT; const names = [...Array(n)].map((_, k) => ($('#pn' + k)?.value || '').trim().slice(0, 14) || 'Player ' + (k + 1)); SESSION.names = names; startDigital(names); },
  rollD: rollDigital, takeCard, pass: () => endTurn(true), done: () => endTurn(false),
  sound: () => { S.sound = !S.sound; save(); render(); },
  newGame: () => { if (!SESSION.newArm) { SESSION.newArm = true; render(); setTimeout(() => { if (SESSION.newArm) { SESSION.newArm = false; render(); } }, 4000); return; }
    const keep = { sound: S.sound, mode: S.mode }; S = blank(); S.sound = keep.sound; S.mode = keep.mode; S.how = false; SESSION.newArm = false; SESSION.bonus = '';
    go(S.mode === 'digital' ? 'setup' : 'play'); },
  print: b => printPart(b.dataset.pr)
};
document.addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (!b || b.disabled) return; ac(); ACT[b.dataset.act]?.(b); });
let lock = null;
async function keepAwake() { try { if ('wakeLock' in navigator && ['play', 'dboard', 'dcard'].includes(S.view)) lock = await navigator.wakeLock.request('screen'); } catch (e) {} }
document.addEventListener('visibilitychange', () => { if (!document.hidden) keepAwake(); });
let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (S.view === 'dboard') drawBoard(); }, 150); });

S = load();
(function route() { // the QR codes open the file with #play
  if (location.hash === '#play') { S.view = 'mode'; try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {} save(); }
})();
decor(); render(); keepAwake();
</script>
